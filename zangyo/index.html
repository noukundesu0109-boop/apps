<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>残業・就業</title>
<script>
(async function () {
  var target = '../zangyo-app/' + location.search + location.hash;
  try {
    if (navigator.serviceWorker) {
      try { await navigator.serviceWorker.register('./sw.js', { scope: './' }); } catch (e) {}
      var regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.filter(function (reg) {
        try { return new URL(reg.scope).pathname === '/apps/zangyo/'; } catch (e) { return false; }
      }).map(function (reg) { return reg.unregister(); }));
    }
    if (window.caches) {
      var keys = await caches.keys();
      await Promise.all(keys.filter(function (key) { return key.indexOf('zangyo-shell-') === 0; }).map(function (key) { return caches.delete(key); }));
    }
  } catch (e) {}
  location.replace(target);
})();
</script>
<!--../zangyo-app/">
</head>
<body><p><a href="../zangyo-app/">残業・就業を開く</a></p></body>
</html>
