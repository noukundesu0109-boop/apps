<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タイマー</title>
<script>
(async function () {
  var target = '../timer-app/' + location.search + location.hash;
  try {
    if (navigator.serviceWorker) {
      try { await navigator.serviceWorker.register('./sw.js', { scope: './' }); } catch (e) {}
      var regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.filter(function (reg) {
        try { return new URL(reg.scope).pathname === '/apps/timer/'; } catch (e) { return false; }
      }).map(function (reg) { return reg.unregister(); }));
    }
    if (window.caches) {
      var keys = await caches.keys();
      await Promise.all(keys.filter(function (key) { return key.indexOf('timer-shell-') === 0; }).map(function (key) { return caches.delete(key); }));
    }
  } catch (e) {}
  location.replace(target);
})();
</script>
<!--../timer-app/">
</head>
<body><p><a href="../timer-app/">タイマーを開く</a></p></body>
</html>
