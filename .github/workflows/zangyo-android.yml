name: android-apps

on:
  push:
    paths:
      - "zangyo-android/**"
      - "zangyo-app/**"
      - "task-android/**"
      - "task-app/**"
      - ".github/workflows/zangyo-android.yml"
  pull_request:
    paths:
      - "zangyo-android/**"
      - "zangyo-app/**"
      - "task-android/**"
      - "task-app/**"
      - ".github/workflows/zangyo-android.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        run: |
          set -euo pipefail
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mv /tmp/cmdtools/cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" --licenses >/dev/null
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "sdk.dir=$HOME/android-sdk" > zangyo-android/local.properties
          echo "sdk.dir=$HOME/android-sdk" > task-android/local.properties
      - name: Test and build 就業
        working-directory: zangyo-android
        run: ./gradlew :alarm-core:test :app:assembleDebug --stacktrace
      - name: Test and build タスク
        working-directory: task-android
        run: ./gradlew :alarm-core:test :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: zangyo-alarm
          path: zangyo-android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tasks-alarm
          path: task-android/app/build/outputs/apk/debug/app-debug.apk
