<style>
:root{--bg:#f4f7f6;--card:#fff;--fg:#1d2b2b;--mut:#6b7c7c;--acc:#1f8a8a;--acc2:#e6f4f3;--sun:#ffb340;--line:#e2e9e8;--danger:#d64545}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px}
body{min-height:100vh;padding-bottom:calc(env(safe-area-inset-bottom) + 80px)}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.hidden{display:none!important}
header.top{position:sticky;top:0;z-index:5;background:var(--acc);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:8px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
header.top h1{flex:1;font-size:19px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top button{color:#fff;font-size:15px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.16)}
.wrap{max-width:640px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:12px}
.trip{display:flex;align-items:center;gap:12px;cursor:pointer}
.trip .em{font-size:30px}
.trip .t{font-weight:700;font-size:18px}
.trip .s{color:var(--mut);font-size:13px;margin-top:3px}
.trip .chev{margin-left:auto;color:var(--mut);font-size:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;background:var(--acc);color:#fff;font-weight:600}
.btn.sub{background:var(--acc2);color:var(--acc)}
.btn.danger{background:#fdeaea;color:var(--danger)}
.btn.wide{width:100%}
.btn.sm{padding:7px 11px;font-size:14px;border-radius:10px}
.add{width:100%;padding:14px;border:2px dashed #bcd3d1;border-radius:14px;color:var(--acc);font-weight:600;background:transparent}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;padding:9px 0 8px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button .i{font-size:21px}
.tabs button.on{color:var(--acc);font-weight:700}
.dayhead{display:flex;align-items:baseline;gap:8px;margin:18px 2px 8px}
.dayhead .d{font-weight:800;font-size:18px;color:var(--acc)}
.dayhead .dt{color:var(--mut);font-size:14px}
.dayhead .sum{margin-left:auto;font-size:14px;color:var(--fg);font-weight:600}
.daylist{min-height:44px;border-radius:14px;display:flex;flex-direction:column;gap:8px}
.daylist.empty{border:2px dashed var(--line);align-items:center;justify-content:center;color:var(--mut);font-size:13px}
.item{background:#fff;border-radius:14px;padding:10px 8px 10px 4px;display:flex;align-items:stretch;gap:6px;box-shadow:0 1px 3px rgba(0,0,0,.06);border-left:5px solid var(--acc)}
.item.dragging{opacity:.85;box-shadow:0 8px 20px rgba(0,0,0,.2);transform:scale(1.02);border-left-color:var(--sun)}
.handle{touch-action:none;width:30px;display:flex;align-items:center;justify-content:center;color:#a9b9b8;font-size:20px;cursor:grab;user-select:none}
.ibody{flex:1;min-width:0;cursor:pointer}
.ibody .r1{display:flex;gap:8px;align-items:baseline}
.ibody .tm{font-weight:700;color:var(--acc);font-size:15px;min-width:42px}
.ibody .pl{font-weight:700;font-size:16px;word-break:break-word}
.ibody .r2{color:var(--mut);font-size:13px;margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 10px}
.maplink{display:inline-flex;align-items:center;gap:4px;color:#1a73e8;font-weight:600;font-size:13px;text-decoration:none;background:#e8f0fe;border-radius:8px;padding:2px 8px}
.ibody .memo{color:#4a5a5a;font-size:13px;margin-top:4px;white-space:pre-wrap;word-break:break-word}
.chip{display:inline-block;background:var(--acc2);color:var(--acc);border-radius:8px;padding:1px 7px;font-size:12px;font-weight:600}
.updown{display:flex;flex-direction:column;gap:4px}
.updown button{width:34px;height:30px;border-radius:8px;background:#f0f4f4;color:var(--mut);font-size:14px}
.row{display:flex;gap:8px;align-items:center}
.muted{color:var(--mut);font-size:13px;line-height:1.6}
.total{font-size:26px;font-weight:800;color:var(--acc)}
table.cost{width:100%;border-collapse:collapse;font-size:15px}
table.cost td{padding:8px 4px;border-bottom:1px solid var(--line)}
table.cost td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pack{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.pack input[type=checkbox]{width:24px;height:24px;accent-color:var(--acc);flex:none}
.pack .tx{flex:1;word-break:break-word}
.pack.done .tx{color:var(--mut);text-decoration:line-through}
.x{color:#b3c0bf;font-size:18px;padding:4px 8px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--acc)}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);max-height:92vh;overflow:auto}
.sheet h2{font-size:18px;margin:0 0 12px}
label.f{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.in{width:100%;padding:11px 12px;border:1px solid #cfdcdb;border-radius:11px;background:#fff;font-size:16px}
textarea.in{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 11px;border-radius:10px;background:#f0f4f4;font-size:14px}
.seg button.on{background:var(--acc);color:#fff;font-weight:700}
.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.acts .btn{flex:1}
.wbar{display:flex;gap:8px;margin:0 0 10px}.wbar .btn{flex:1}
.wselbar{position:sticky;top:calc(env(safe-area-inset-top) + 57px);z-index:4;background:var(--bg);padding:6px 0 10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wselbar .btn{width:100%}.wselbar .wdel{grid-column:1/-1}.btn:disabled{opacity:.45}
.card.wsel{display:flex;gap:12px;align-items:flex-start;cursor:pointer;border:2px solid transparent}.card.wsel.on{border-color:var(--acc);background:var(--acc2)}
.wck{width:24px;height:24px;flex:none;margin-top:2px;accent-color:var(--acc)}
.toast.undo{display:flex;align-items:center;gap:12px;pointer-events:auto;white-space:nowrap}.toast.undo button{color:#7fe0d8;font-weight:700;padding:4px 6px;background:transparent}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:#1d2b2b;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:90vw;text-align:center}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.anchor{display:flex;align-items:center;gap:8px;background:#fff8ec;border:1px solid #f5dfb5;border-radius:12px;padding:9px 12px;font-size:14px;margin:0 0 8px;cursor:pointer}
.anchor.end{margin:8px 0 0}
.anchor.bad{background:#fdeaea;border-color:#f3b9b9;color:#a12a2a}
.trgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.trgrid button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;border:1px solid var(--line,#dde3e8);background:#f1f4f6;border-radius:12px;font:inherit;font-size:13px;font-weight:600;color:inherit;padding:6px 2px;cursor:pointer}
.trgrid button .ti{font-size:20px;line-height:1.1}
.trgrid button.on{background:var(--acc,#1f8a85);border-color:var(--acc,#1f8a85);color:#fff}
.endpt{border-radius:14px;padding:11px 12px;margin:0 0 8px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;font-size:14px}
.endpt .ic{font-size:22px;line-height:1.2}
.endpt .tt{font-weight:800;font-size:15px}
.endpt .sub2{font-size:13px;margin-top:3px;line-height:1.55}
.endpt .big{margin-left:auto;text-align:right;font-weight:800;font-size:17px;white-space:nowrap}
.endpt.dep{background:#e7f6ec;border:2px solid #7cc79a;color:#1d5e36}
.endpt.ret{background:#e8f1fd;border:2px solid #86aee8;color:#1f4a87;margin:10px 0 0}
.endpt.ret.bad{background:#fdeaea;border-color:#e99;color:#a12a2a}
.endpt .edit{font-size:12px;opacity:.7;font-weight:600}
.kc{display:inline-flex;gap:2px;align-items:center;border-radius:8px;padding:1px 7px;font-size:12px;font-weight:600;background:#eef1f5;color:#44546a}
.anchor .r{margin-left:auto;font-weight:700}
.est{color:#7a9a99;font-weight:600}
.warn{color:var(--danger);font-weight:700}
.leg{display:inline-flex;gap:3px;align-items:center;background:#fff3df;color:#9a6200;border-radius:8px;padding:1px 7px;font-size:12px;font-weight:600}
.sec{font-weight:700;margin:16px 0 2px;color:var(--acc);font-size:14px}
.calc{background:var(--acc2);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px;line-height:1.7}
.empty-big{text-align:center;color:var(--mut);padding:30px 10px}
.empty-big .e{font-size:48px}
.item.grp{border-left-color:#e08a2c;background:#fffaf3}
.prog{display:inline-flex;align-items:center;background:#fff1de;color:#9a5a00;border-radius:8px;padding:1px 7px;font-size:12px;font-weight:700}
.shop{display:flex;gap:10px;align-items:flex-start}
.shop.eaten{background:#f3faf9}.shop.eaten .sn{color:var(--mut);text-decoration:line-through}
.eat{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--acc);font-weight:700;flex:none;cursor:pointer}
.eat input{width:26px;height:26px;accent-color:var(--acc)}
.gsum{display:flex;align-items:center;gap:8px;background:var(--acc2);border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:14px}
.gsum b{margin-left:auto;color:var(--acc);font-size:17px}
.pricef{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:13px;color:var(--mut);font-weight:600}.pricef .in{width:110px;padding:6px 8px;font-size:15px}
.wselbar.grpmode .wdel{background:#fff1de;color:#9a5a00}
</style>

<body>
<header class="top"><button id="hBack" class="hidden">‹ 戻る</button><h1 id="hTitle">りょこう計画</h1><button id="hMenu">⚙︎</button></header>
<main class="wrap" id="main"></main>
<nav class="tabs hidden" id="tabs">
  <button data-tab="plan"><span class="i">🗓️</span>旅程</button>
  <button data-tab="wish"><span class="i">⭐</span>候補</button>
  <button data-tab="cost"><span class="i">💴</span>費用</button>
  <button data-tab="pack"><span class="i">🎒</span>持ち物</button>
</nav>
<div id="ovRoot"></div>
<input type="file" id="fileIn" accept="application/json,.json" class="hidden">
<script>
(function(){
'use strict';
const KEY='ryokou-data-v1';
const GTYPES={food:{ic:'🍴',nm:'食べ歩き',u:'店',done:'食べた',gn:'食べ物'},gift:{ic:'🎁',nm:'お土産',u:'件',done:'買った',gn:'お土産'},spot:{ic:'📍',nm:'スポット',u:'件',done:'行った',gn:'スポット'},other:{ic:'📦',nm:'その他',u:'件',done:'済み',gn:'その他'}};
const CLIENT_ID='182175171319-0kfoj0i0qq0p2q7vulqcnfftmgc1gjcm.apps.googleusercontent.com';
const TRANSPORTS=['徒歩','自転車','車','電車','バス','飛行機','その他'];
const TICON={'徒歩':'🚶','自転車':'🚲','電車':'🚃','車':'🚗','飛行機':'✈️','バス':'🚌','その他':'📍'};
const EXTRA_KINDS=['高速代','駐車場代','宿泊','交通','その他'];
const DEFAULT_PACK=['財布','スマホ','充電器・モバイルバッテリー','保険証','着替え','下着・靴下','パジャマ','洗面用具','常備薬','ハンカチ・ティッシュ','折りたたみ傘','エコバッグ'];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const $=(s,r=document)=>r.querySelector(s);
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen=(n)=>'¥'+(Math.round(Number(n)||0)).toLocaleString('ja-JP');
const num=(v)=>{const n=Number(String(v??'').replace(/[,，¥円\s]/g,''));return isFinite(n)?n:0};
const WD='日月火水木金土';

let S=load();
let view={trip:null,tab:'plan'};

function blank(){return {version:1,trips:[]}}
function load(){try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(j&&Array.isArray(j.trips))return normalize(j)}catch(e){}return blank()}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function normalize(d){
  const out={version:1,trips:[]};
  for(const t of d.trips||[]){
    const days=Math.max(1,Math.min(60,parseInt(t.days)||1));
    const plan=Array.isArray(t.plan)?t.plan.slice(0,days):[];
    while(plan.length<days)plan.push([]);
    const ds=Array.isArray(t.dayStart)?t.dayStart.slice(0,days).map(timeOk):[];while(ds.length<days)ds.push('');
    const car=t.car||{};
    out.trips.push({id:t.id||uid(),title:String(t.title||'旅行'),start:String(t.start||''),days,dest:String(t.dest||''),
      depTime:timeOk(t.depTime),depPlace:t.depPlace==null?'自宅':String(t.depPlace),depMemo:String(t.depMemo||''),depToll:nn(t.depToll),depFare:nn(t.depFare),
      retTime:timeOk(t.retTime),homeMin:nn(t.homeMin),homeKm:nn(t.homeKm),retMemo:String(t.retMemo||''),retToll:nn(t.retToll),retFare:nn(t.retFare),dayStart:ds,
      car:{km:nn(car.km),kmpl:nn(car.kmpl),ypl:nn(car.ypl)},
      hotels:(Array.isArray(t.hotels)?t.hotels:[]).map(h=>({id:h.id||uid(),name:String(h.name||''),price:nn(h.price),nights:(h.nights===null||h.nights===undefined||h.nights==='')?null:nn(h.nights)})),
      plan:plan.map(a=>(Array.isArray(a)?a:[]).map(normItem)),
      wish:(t.wish||[]).map(normItem),
      extras:(t.extras||[]).map(x=>({id:x.id||uid(),kind:EXTRA_KINDS.includes(x.kind)?x.kind:'その他',label:String(x.label||''),cost:num(x.cost)})),
      pack:(t.pack||[]).map(p=>({id:p.id||uid(),text:String(p.text||''),done:!!p.done})),
      created:t.created||Date.now()});
  }
  return out;
}
function normItem(i){const o={id:i.id||uid(),time:String(i.time||''),place:String(i.place||''),transport:TRANSPORTS.includes(i.transport)?i.transport:'',cost:num(i.cost),memo:String(i.memo||''),...(safeUrl(i.url)?{url:safeUrl(i.url)}:{})};for(const k of ['moveMin','stayMin','km','toll','parking','lodging','fare']){const v=nn(i[k]);if(v)o[k]=v}if(i.kind==='group'){o.kind='group';o.gtype=GTYPES[i.gtype]?i.gtype:'food';o.shops=(Array.isArray(i.shops)?i.shops:[]).map(normShop);for(const sh of o.shops)if(!GTYPES[sh.genre])sh.genre=o.gtype}return o}
function normShop(x){x=x||{};const o={id:x.id||uid(),src:String(x.src||''),place:String(x.place||''),memo:String(x.memo||''),eaten:!!x.eaten};const pr=nn(x.price);if(pr)o.price=pr;const u=safeUrl(x.url);if(u)o.url=u;if(GTYPES[x.genre])o.genre=x.genre;return o}
const GN=k=>(GTYPES[k]||GTYPES.food).gn;const gnBtns=(cur,attr)=>`<div class="row" style="gap:6px;flex-wrap:wrap">${Object.entries(GTYPES).map(([k,v])=>`<button type="button" class="btn ${k===cur?'':'sub'} sm" ${attr}="${k}" aria-pressed="${k===cur}">${v.ic}${v.gn}</button>`).join('')}</div>`;
const gT=(it)=>GTYPES[it&&it.gtype]||GTYPES.food;
// old auto icon: a leading U+1F361 (old food icon) in a food group title is dropped on display (stored text untouched)
const gTitle=(it)=>{const p=String(it.place||'');return (!it.gtype||it.gtype==='food')&&/^\u{1F361}\s*/u.test(p)?p.replace(/^\u{1F361}\s*/u,''):p};
const gLabel=(it)=>`${gT(it).ic} ${gTitle(it)||gT(it).nm}（${(it.shops||[]).length}${gT(it).u}）`;
const gTypeBtns=(cur)=>`<div class="row" id="gTypes" style="gap:6px;flex-wrap:wrap">${Object.entries(GTYPES).map(([k,v])=>`<button class="btn ${k===cur?'':'sub'} sm" data-gt="${k}" aria-pressed="${k===cur}">${v.ic}${v.nm}</button>`).join('')}</div>`;
const gEaten=(it)=>(it.shops||[]).filter(x=>x.eaten).length;
function nn(v){const n=num(v);return n>0?n:0}
function timeOk(v){v=String(v||'');return /^\d{2}:\d{2}$/.test(v)?v:''}
const toMin=(s)=>{const m=/^(\d{1,2}):(\d{2})$/.exec(s||'');return m?(+m[1])*60+(+m[2]):null};
function fmtMin(m){if(m==null)return '--:--';const d=Math.floor(m/1440);const r=((m%1440)+1440)%1440;return (d>0?'翌':'')+String(Math.floor(r/60))+':'+String(r%60).padStart(2,'0')}
const durTxt=(m)=>m>=60?`${Math.floor(m/60)}時間${m%60?m%60+'分':''}`:`${m}分`;
// estimated times for one day: manual time wins; otherwise previous departure + 移動分. departure = arrival + 滞在分
function schedule(t,di){
  let cur=toMin(di===0?t.depTime:t.dayStart[di]);const items=[];
  for(const it of t.plan[di]){
    const est=cur!=null?cur+num(it.moveMin):null;const man=toMin(it.time);
    const arr=man!=null?man:est;
    items.push({arr,est,manual:man!=null,late:(man!=null&&est!=null&&est>man)?est-man:0,leave:arr!=null&&num(it.stayMin)?arr+num(it.stayMin):null});
    cur=arr!=null?arr+num(it.stayMin):null;
  }
  const last=di===t.plan.length-1;
  const home=last&&cur!=null?cur+num(t.homeMin):null;const ret=toMin(t.retTime);
  return {items,home,ret,homeLate:(home!=null&&ret!=null&&home>ret)?home-ret:0};
}
function legKm(t){return t.plan.flat().filter(x=>x.transport==='車').reduce((a,x)=>a+num(x.km),0)+num(t.homeKm)}
function otherKm(t){return t.plan.flat().filter(x=>x.transport!=='車').reduce((a,x)=>a+num(x.km),0)}
function gasKm(t){return num(t.car.km)>0?num(t.car.km):legKm(t)}
function gasLiters(t){return num(t.car.kmpl)>0?gasKm(t)/num(t.car.kmpl):0}
function gasCost(t){return Math.round(gasLiters(t)*num(t.car.ypl))}
function hotelNights(t,h){return h.nights==null?Math.max(0,t.days-1):num(h.nights)}
function hotelSum(t){return t.hotels.reduce((a,h)=>a+num(h.price)*hotelNights(t,h),0)}
function safeUrl(u){u=String(u||'').trim();return /^https?:\/\/\S+$/i.test(u)?u:''}
const mapLink=(u)=>u?`<a class="maplink" href="${esc(u)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🗺️ 地図</a>`:'';
const trip=()=>S.trips.find(t=>t.id===view.trip);
function dayDate(t,i){if(!t.start)return '';const d=new Date(t.start+'T00:00:00');if(isNaN(d))return '';d.setDate(d.getDate()+i);return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`}
const CATS=[['cost','行程の費用（入場・食事など）'],['toll','高速代'],['parking','駐車場代'],['lodging','宿泊代'],['fare','交通費']];
// 🍴 食べ歩き: price = first number before 円 in the shop memo
function shopYen(sh){return num(sh&&sh.price)>0?num(sh.price):shopAuto(sh)}
function shopAuto(sh){const m=/(\d[\d,]*)\s*円/.exec(String(sh&&sh.memo||'').normalize('NFKC'));return m?Number(m[1].replace(/,/g,''))||0:0}
function groupEst(x){return x&&x.kind==='group'?(x.shops||[]).reduce((a,sh)=>a+shopYen(sh),0):0}
// rule: manual 入場・食事など if > 0, otherwise the parsed estimate (never both)
function itemCost(x){return num(x.cost)>0?num(x.cost):groupEst(x)}
function itemTotal(x){return itemCost(x)+num(x.toll)+num(x.parking)+num(x.lodging)+num(x.fare)}
const fv=(x,k)=>k==='cost'?itemCost(x):num(x[k]);
function endCost(t,k,i){const K=k==='toll'?'Toll':k==='fare'?'Fare':null;if(!K)return 0;return (i===0?num(t['dep'+K]):0)+(i===t.plan.length-1?num(t['ret'+K]):0)}
function daySum(t,i){return t.plan[i].reduce((a,x)=>a+itemTotal(x),0)+endCost(t,'toll',i)+endCost(t,'fare',i)}
function catSum(t,k){return t.plan.flat().reduce((a,x)=>a+fv(x,k),0)+(k==='toll'?num(t.depToll)+num(t.retToll):k==='fare'?num(t.depFare)+num(t.retFare):0)}
function legacySum(t){return t.extras.reduce((a,x)=>a+num(x.cost),0)+hotelSum(t)}
function tripTotal(t){return t.plan.reduce((a,_,i)=>a+daySum(t,i),0)+gasCost(t)+legacySum(t)}
function sortByTimeKeep(arr){return arr}

function undoToast(m,fn,ms=6000){document.querySelectorAll('.toast.undo').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast undo';d.innerHTML=`<span></span><button type="button">元に戻す</button>`;d.firstChild.textContent=m;let done=false;d.querySelector('button').onclick=()=>{if(done)return;done=true;d.remove();fn()};document.body.appendChild(d);setTimeout(()=>{done=true;d.remove()},ms)}
function toast(m,ms=2600){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),ms)}

  m.querySelectorAll('.item').forEach(el=>{
    const id=el.dataset.id;

    el.querySelectorAll('[data-mv]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();moveStep(t,id,+b.dataset.mv)});

function findItem(t,id){for(let d=0;d<t.plan.length;d++){const i=t.plan[d].findIndex(x=>x.id===id);if(i>=0)return {day:d,idx:i,item:t.plan[d][i]}}const w=t.wish.findIndex(x=>x.id===id);return w>=0?{day:-1,idx:w,item:t.wish[w]}:null}
function moveStep(t,id,dir){
  const loc=findItem(t,id);if(!loc||loc.day<0)return;
  const arr=t.plan[loc.day];const ni=loc.idx+dir;
  if(ni>=0&&ni<arr.length){[arr[loc.idx],arr[ni]]=[arr[ni],arr[loc.idx]]}
  else if(ni<0&&loc.day>0){arr.splice(loc.idx,1);t.plan[loc.day-1].push(loc.item)}
  else if(ni>=arr.length&&loc.day<t.plan.length-1){arr.splice(loc.idx,1);t.plan[loc.day+1].unshift(loc.item)}
  else return;
  save();render();
}
/* drag & drop with pointer events (works with touch) */
function initDrag(handle,el,t){
  handle.addEventListener('pointerdown',(e)=>{
    e.preventDefault();
    const pid=e.pointerId;
    el.classList.add('dragging');
    let lastY=e.clientY,raf=null;
    const onMove=(ev)=>{
      if(ev.pointerId!==pid)return;ev.preventDefault();
      lastY=ev.clientY;
      const x=ev.clientX,y=ev.clientY;
      el.style.pointerEvents='none';
      const under=document.elementFromPoint(x,y);
      el.style.pointerEvents='';
      if(!under)return;
      const over=under.closest('.item');
      const list=under.closest('.daylist');
      if(over&&over!==el){const r=over.getBoundingClientRect();over.parentNode.insertBefore(el,y<r.top+r.height/2?over:over.nextSibling)}
      else if(list&&!over){if(list.classList.contains('empty')){list.textContent='';list.classList.remove('empty')}if(!list.contains(el))list.appendChild(el)}
      // auto scroll
      if(y<90)scrollBy(0,-12);else if(y>innerHeight-110)scrollBy(0,12);
    };
    const onUp=(ev)=>{
      if(ev&&ev.pointerId!==pid)return;
      window.removeEventListener('pointermove',onMove);window.removeEventListener('pointerup',onUp);window.removeEventListener('pointercancel',onUp);
      el.classList.remove('dragging');
      const all={};t.plan.flat().forEach(i=>all[i.id]=i);
      const np=[...document.querySelectorAll('.daylist')].map(l=>[...l.querySelectorAll('.item')].map(n=>all[n.dataset.id]).filter(Boolean));
      if(np.length===t.plan.length&&np.flat().length===Object.keys(all).length){t.plan=np;save()}
      render();
    };
    window.addEventListener('pointermove',onMove,{passive:false});window.addEventListener('pointerup',onUp);window.addEventListener('pointercancel',onUp);
  });
}
let wishSel=null;
function deleteWish(t,ids){
  const rm=new Set(ids),before=t.wish.slice(),removed=before.filter(w=>rm.has(w.id));if(!removed.length)return;
  t.wish=t.wish.filter(w=>!rm.has(w.id));wishSel=null;save();render();
  undoToast(`候補を${removed.length}件削除しました`,()=>{const cur=S.trips.find(x=>x.id===t.id);if(!cur)return;
    const now=new Set(cur.wish.map(w=>w.id)),old=new Set(before.map(w=>w.id));
    cur.wish=before.filter(w=>rm.has(w.id)||now.has(w.id)).map(w=>rm.has(w.id)?w:cur.wish.find(x=>x.id===w.id)).concat(cur.wish.filter(w=>!old.has(w.id)));
    save();render();toast(`${removed.length}件を元に戻しました`)});
}

let _lastPos=null;
function removeEverywhere(t,id){
  _lastPos=null;
  t.plan.forEach((d,di)=>{const i=d.findIndex(x=>x.id===id);if(i>=0){_lastPos={day:di,idx:i};d.splice(i,1)}});
  t.wish=t.wish.filter(x=>x.id!==id);
}
// new items / moved items: insert by time order (if time given); same-day edits keep their position
function insertByTime(arr,obj,auto,info,t){
  if(info&&_lastPos&&t.plan[_lastPos.day]===arr){arr.splice(_lastPos.idx,0,obj);return}
  if(obj.time){const i=arr.findIndex(x=>x.time&&x.time>obj.time);if(i>=0){arr.splice(i,0,obj);return}}
  arr.push(obj);
}

/* ---------- import (Google Takeout saved list CSV / plain text) ---------- */
function parseCSV(text){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows;
}
const H_TITLE=/^(title|name|タイトル|名前|名称)$/i,H_URL=/^(url|link|リンク)$/i,H_NOTE=/^(note|notes|メモ|説明)$/i,H_COMMENT=/^(comment|comments|コメント)$/i;
function placesFromCSV(text){
  const rows=parseCSV(text).map(r=>r.map(x=>x.trim()));
  let hi=rows.findIndex(r=>r.some(x=>H_TITLE.test(x))&&r.some(x=>H_URL.test(x)));
  let ti=0,ui=-1,ni=[],start=0;
  if(hi>=0){const h=rows[hi];ti=h.findIndex(x=>H_TITLE.test(x));ui=h.findIndex(x=>H_URL.test(x));ni=h.map((x,i)=>H_NOTE.test(x)||H_COMMENT.test(x)?i:-1).filter(i=>i>=0);start=hi+1}
  const out=[];
  for(const r of rows.slice(start)){
    if(!r.some(x=>x))continue;
    let url=ui>=0?safeUrl(r[ui]):'';
    if(hi<0){url=r.map(safeUrl).find(Boolean)||''}
    let name=(r[ti]||'').trim();
    if(hi<0&&(!name||safeUrl(name)))name=r.find(x=>x&&!safeUrl(x))||'';
    const memo=[...new Set(ni.map(i=>(r[i]||'').trim()).filter(Boolean))].join('\n');
    if(!name&&!url)continue;
    out.push({place:name||'(名前なし・地図リンク)',memo,url});
  }
  return out;
}
function placesFromLines(text){
  return text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/https?:\/\/\S+/);const url=m?safeUrl(m[0]):'';const name=(m?l.replace(m[0],''):l).replace(/[\s,、|｜\-–—:：]+$/,'').trim();return {place:name||'(名前なし・地図リンク)',memo:'',url}});
}
function looksCSV(text){const first=text.split(/\r?\n/).slice(0,8).join('\n');return /(^|,)\s*"?(Title|タイトル)"?\s*,/im.test(first)&&/URL/i.test(first)}
function placesFromText(text){text=text.replace(/^\uFEFF/,'');return looksCSV(text)?placesFromCSV(text):placesFromLines(text)}
const normUrl=(u)=>String(u||'').trim().replace(/\/+$/,'').toLowerCase();
const normName=(n)=>String(n||'').normalize('NFKC').replace(/\s+/g,' ').trim().toLowerCase();
function addImported(t,places){
  const urls=new Set(t.wish.map(w=>normUrl(w.url)).filter(Boolean)),names=new Set(t.wish.map(w=>normName(w.place)).filter(Boolean));
  let added=0,skipped=0;
  for(const p of places){
    const u=normUrl(p.url),n=normName(p.place);const isNoName=p.place.startsWith('(名前なし');
    if((u&&urls.has(u))||(!isNoName&&n&&names.has(n))){skipped++;continue}
    const it=normItem({place:p.place,memo:p.memo,url:p.url});t.wish.push(it);added++;
    if(u)urls.add(u);if(!isNoName&&n)names.add(n);
  }
  return {added,skipped};
}
async function readFileText(f){
  const buf=await f.arrayBuffer();let txt=new TextDecoder('utf-8').decode(buf);
  if(txt.includes('\uFFFD')){try{const sj=new TextDecoder('shift_jis').decode(buf);if(!sj.includes('\uFFFD'))txt=sj}catch(e){}}
  return txt.replace(/^\uFEFF/,'');
}

    $('#ok',s).onclick=()=>{Object.assign(t,{retTime:timeOk($('#rT',s).value),homeMin:nn($('#rMin',s).value),homeKm:nn($('#rKm',s).value),retToll:nn($('#rToll',s).value),retFare:nn($('#rFare',s).value),retMemo:$('#rM',s).value.trim()});save();closeSheet();render()};
  });
}
function menuSheet(){
  const t=trip();
  openSheet(`<h2>メニュー</h2><div style="display:grid;gap:8px">
   ${t?'<button class="btn sub" id="mTrip">✏️ この旅行の設定（名前・日程・削除）</button>':''}
   ${t?'<button class="btn" id="mShare">📤 この旅行だけ共有</button>':''}
   <button class="btn" id="mDrive">☁️ Googleドライブに保存（Grokフォルダ）</button>
   <button class="btn sub" id="mExport">⬇️ バックアップを書き出す（JSON）</button>
   <button class="btn sub" id="mImport">⬆️ バックアップ・共有ファイルを読み込む（JSON）</button></div>
   <p class="muted" style="margin-top:12px">「この旅行だけ共有」で作ったファイルを読み込むと、今の旅行はそのままで<b>旅行が1件追加</b>されます。全体のバックアップを読み込むと全部置き換わります。</p>
   <p class="muted" style="margin-top:12px">データはこのスマホのブラウザ内に保存されています。アプリを消したりブラウザのデータを消すと失われるので、ときどきバックアップしてください。</p>
   <p class="muted">ドライブ保存は、Googleの許可（このアプリが作ったファイルだけを扱う権限 drive.file）で、マイドライブの「Grok」フォルダに <b>ryokou-backup-年月日.json</b> を保存します。保存に成功したときだけ、りょこう計画のバックアップを新しい2件だけ残して古いものをゴミ箱へ移します（完全削除はしません。他のアプリのファイルには触れません）。この権限のため、既存の別フォルダ（例：財）には直接保存できません。</p>
   <div class="acts"><button class="btn sub" id="cancel">閉じる</button></div>`,(s)=>{
    $('#cancel',s).onclick=closeSheet;
    const mt=$('#mTrip',s);if(mt)mt.onclick=()=>{closeSheet();tripSheet(t)};
    $('#mExport',s).onclick=()=>{exportJSON();};
    const ms=$('#mShare',s);if(ms)ms.onclick=()=>shareTrip(t);
    $('#mImport',s).onclick=()=>{$('#fileIn').click()};
    $('#mDrive',s).onclick=async(e)=>{const b=e.currentTarget;b.disabled=true;b.textContent='保存中…';try{await driveBackup()}finally{b.disabled=false;b.textContent='☁️ Googleドライブに保存（Grokフォルダ）'}};
  });
}
function stamp(){const d=new Date();return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`}
function backupText(){return JSON.stringify({app:'ryokou',exportedAt:new Date().toISOString(),...S},null,1)}
function exportJSON(){
  const blob=new Blob([backupText()],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`ryokou-backup-${stamp()}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('書き出しました');
}
function tripFileName(t){return `ryokou-trip-${String(t.title||'旅行').replace(/[\\/:*?"<>|\s]+/g,'_').slice(0,40)}-${stamp()}.json`}
function tripText(t){return JSON.stringify({app:'ryokou',type:'ryokou-trip',version:1,exportedAt:new Date().toISOString(),trip:t},null,1)}
async function shareTrip(t){
  const name=tripFileName(t),txt=tripText(t);
  try{const file=new File([txt],name,{type:'application/json'});
    if(navigator.canShare&&navigator.share&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:t.title||'旅行',text:`りょこう計画「${t.title||'旅行'}」`});return}
  }catch(err){if(err&&err.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('この旅行のファイルを保存しました');
}
// give every id in a trip a fresh one (keeps 候補 → まとめ src links)
function reId(t){const m={};const walk=o=>{if(Array.isArray(o))o.forEach(walk);else if(o&&typeof o==='object'){if(typeof o.id==='string'&&!m[o.id])m[o.id]=uid()+Math.random().toString(36).slice(2,4);Object.values(o).forEach(walk)}};walk(t);
  const fix=o=>{if(Array.isArray(o))o.forEach(fix);else if(o&&typeof o==='object'){if(m[o.id])o.id=m[o.id];if(typeof o.src==='string'&&m[o.src])o.src=m[o.src];Object.values(o).forEach(fix)}};fix(t);return t}
function allIds(d){const st=new Set();const walk=o=>{if(Array.isArray(o))o.forEach(walk);else if(o&&typeof o==='object'){if(typeof o.id==='string')st.add(o.id);Object.values(o).forEach(walk)}};walk(d);return st}
function addTrip(nt,mode,old){
  if(mode==='over'){nt.id=old.id;S.trips[S.trips.indexOf(old)]=nt}
  else{const ids=allIds(S.trips);if(mode==='copy'){reId(nt);nt.title=(nt.title||'旅行')+'（コピー）'}else if([...allIds(nt)].some(i=>ids.has(i)))reId(nt);S.trips.push(nt)}
  save();view={trip:nt.id,tab:'plan'};closeSheet();render();toast(`「${nt.title}」を${mode==='over'?'上書き':'追加'}しました`);
}
function importTrip(raw){
  const nt=normalize({trips:[raw]}).trips[0];if(!nt)throw new Error('形式');
  const old=S.trips.find(x=>x.id===nt.id)||S.trips.find(x=>x.title===nt.title&&x.start&&x.start===nt.start);
  if(!old){addTrip(nt,'add');return}
  openSheet(`<h2>同じ旅行があります</h2><p>「${esc(old.title||'旅行')}」${old.start?'（'+esc(old.start)+'〜）':''}はすでにあります。どうしますか？</p>
   <div style="display:grid;gap:8px"><button class="btn" id="impOver">上書き（今の「${esc(old.title||'旅行')}」を置き換える）</button><button class="btn sub" id="impCopy">別に追加（「${esc(nt.title||'旅行')}（コピー）」として追加）</button></div>
   <div class="acts"><button class="btn sub" id="cancel">やめる</button></div>`,(s)=>{
    $('#cancel',s).onclick=closeSheet;
    $('#impOver',s).onclick=()=>{if(confirm(`「${old.title||'旅行'}」を読み込んだ内容で置き換えます。よろしいですか？`))addTrip(nt,'over',old)};
    $('#impCopy',s).onclick=()=>addTrip(nt,'copy');
  });
}
$('#fileIn').onchange=async(e)=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const j=JSON.parse(await f.text());if(j&&j.type==='ryokou-trip'&&j.trip&&typeof j.trip==='object'){importTrip(j.trip);return}
    if(!j||!Array.isArray(j.trips))throw new Error('形式');
    if(j.app&&j.app!=='ryokou')throw new Error('他アプリ');
    const n=normalize(j);
    if(!confirm(`旅行 ${n.trips.length}件を読み込みます。今のデータ（旅行 ${S.trips.length}件）は置き換わります。よろしいですか？`))return;
    S=n;save();view={trip:null,tab:'plan'};closeSheet();render();toast('読み込みました');
  }catch(err){alert('このファイルは読み込めませんでした（りょこう計画のバックアップJSONを選んでください）')}
};

/* ---------- Google Drive (GIS + drive.file) ---------- */
function loadGis(){return new Promise((res,rej)=>{if(window.google?.accounts?.oauth2)return res();const sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.async=true;sc.onload=()=>res();sc.onerror=()=>rej(new Error('gis-load'));document.head.appendChild(sc)})}
function getToken(){return new Promise((res,rej)=>{try{const tc=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:'https://www.googleapis.com/auth/drive.file',callback:(r)=>r?.access_token?res(r.access_token):rej(new Error('token')),error_callback:()=>rej(new Error('token'))});tc.requestAccessToken({prompt:''})}catch(e){rej(e)}})}
const api=(tk,url,opt={})=>fetch(url,{...opt,headers:{Authorization:`Bearer ${tk}`,...(opt.headers||{})}});
async function folderId(tk){
  const q=encodeURIComponent(`name='Grok' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const r=await api(tk,`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id%2Cname)&spaces=drive`);
  if(!r.ok)throw new Error('drive-list');const j=await r.json();if(j.files?.length)return j.files[0].id;
  const cr=await api(tk,'https://www.googleapis.com/drive/v3/files',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'Grok',mimeType:'application/vnd.google-apps.folder'})});
  if(!cr.ok)throw new Error('drive-folder');return (await cr.json()).id;
}
const BACKUP_RE=/^ryokou-backup-\d{8}.*\.json$/;
async function driveBackup(){
  if(navigator.onLine===false){alert('オフラインのため保存できません。ネットにつながってから試してください。');return}
  let step='gis';
  try{
    await loadGis();step='token';const tk=await getToken();step='folder';const fid=await folderId(tk);
    step='upload';const name=`ryokou-backup-${stamp()}.json`;const bd='ryokou_'+Date.now();
    const meta=JSON.stringify({name,parents:[fid],mimeType:'application/json'});
    const body=`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${backupText()}\r\n--${bd}--`;
    const r=await api(tk,'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id%2Cname%2Cparents',{method:'POST',headers:{'Content-Type':`multipart/related; boundary=${bd}`},body});
    if(!r.ok)throw new Error('drive-upload');const up=await r.json();
    if(!up?.id){alert(`保存しました（${name}）。\n保存の確認ができなかったため、古いバックアップの整理はしていません。`);return}
    // cleanup only after confirmed upload & successful listing that includes the new file
    let cleaned=0,note='';
    try{
      const lq=encodeURIComponent(`'${fid}' in parents and trashed=false`);
      const lr=await api(tk,`https://www.googleapis.com/drive/v3/files?q=${lq}&orderBy=createdTime%20desc&fields=files(id%2Cname%2CcreatedTime)&pageSize=1000&spaces=drive`);
      if(!lr.ok)throw new Error('list');
      const files=((await lr.json()).files||[]).filter(f=>BACKUP_RE.test(f.name||''));
      if(!files.some(f=>f.id===up.id))throw new Error('notlisted');
      files.sort((a,b)=>(b.createdTime||'').localeCompare(a.createdTime||''));
      for(const f of files.slice(2)){if(f.id===up.id)continue;const tr=await api(tk,`https://www.googleapis.com/drive/v3/files/${f.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({trashed:true})});if(tr.ok)cleaned++;else note='（一部の古いバックアップはゴミ箱へ移せませんでした）'}
    }catch(e){note='（一覧の確認ができなかったため、古いバックアップの整理はしていません）'}
    alert(`Googleドライブの「Grok」フォルダに保存しました。\n${name}${cleaned?`\n古いバックアップ ${cleaned}件をゴミ箱へ移しました。`:''}${note?'\n'+note:''}`);
  }catch(e){
    const msg={gis:'Googleのログイン部品を読み込めませんでした。',token:'Googleの許可が取れませんでした（キャンセル、またはこの公開URLがGoogle側に未登録の可能性があります）。',folder:'「Grok」フォルダを確認・作成できませんでした。',upload:'アップロードに失敗しました。'}[step]||'保存に失敗しました。';
    alert(msg+'\nドライブ上のファイルは何も消していません。');
  }
}
