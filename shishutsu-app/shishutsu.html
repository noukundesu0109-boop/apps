  function removeAnnualItemFromYear(data, itemId) {
    if (!data || !itemId) return false
    let changed = false
    ;(data.groups || []).forEach(function (group) {
      if (!group || !Array.isArray(group.items)) return
      const next = group.items.filter(function (row) { return !(row && row.id === itemId) })
      if (next.length !== group.items.length) {
        group.items = next
        changed = true
      }
    })
    MONTH_KEYS.forEach(function (mm) {
      if (data.months && data.months[mm] && Object.prototype.hasOwnProperty.call(data.months[mm], itemId)) {
        delete data.months[mm][itemId]
        changed = true
      }
    })
    return changed
  }

  function writeVehicleAnnualMonths(data, itemId, months) {
    if (!data || !itemId || !yearHasItem(data, itemId)) return false
    let changed = false
    if (!data.months) data.months = {}
    MONTH_KEYS.forEach(function (mm) {
      if (!data.months[mm]) data.months[mm] = {}
      const current = data.months[mm][itemId] || { budget: 0, actual: 0 }
      const next = Math.round(asFiniteNumber(months && months[mm]))
      if (asFiniteNumber(current.budget) !== next) changed = true
      data.months[mm][itemId] = {
        budget: next,
        actual: asFiniteNumber(current.actual),
      }
    })
    return changed
  }

  function syncVehiclesToAnnual() {
    if (vehicleAnnualSyncing) return false
    vehicleAnnualSyncing = true
    try {
      const vehicles = state && state.vehicles
      reconcileVehicleAnnualItemIds(vehicles)
      const mapById = {}
      listVehicleAnnualMaps(vehicles).forEach(function (map) {
        if (map && map.itemId) mapById[map.itemId] = map
      })
      const known = {}
      vehicleBudgetAnnualItemIds(vehicles).forEach(function (id) { known[id] = true })
      let changed = false
      Object.keys(state && state.years ? state.years : {}).forEach(function (key) {
        const data = state.years[key]
        if (!data) return
        const pack = vehicleReflectMonths(vehicles, key)
        Object.keys(known).forEach(function (itemId) {
          if (pack[itemId]) return
          if (removeAnnualItemFromYear(data, itemId)) changed = true
        })
        Object.keys(pack).forEach(function (itemId) {
          const map = mapById[itemId]
          const before = yearHasItem(data, itemId)
          ensureVehicleAnnualItemInData(
            data,
            itemId,
            (map && map.label) || vehicleAnnualLabelForItem(itemId),
            (map && map.kind) || vehicleAnnualKindForItem(itemId)
          )
          if (!before) changed = true
          if (writeVehicleAnnualMonths(data, itemId, pack[itemId])) changed = true
        })
      })
      return changed
    } finally {
      vehicleAnnualSyncing = false
    }
  }

  function pruneOrphanVehicleAnnualItem(itemId) {

    if (vehicleCatsForAnnualItem(state && state.vehicles, itemId).length) return
    removeAnnualItemAllYears(itemId)
  }

  function pruneAllOrphanVehicleAnnualItems() {

    VEHICLE_ANNUAL_MAP.forEach(function (map) { candidates[map.itemId] = true })
    ;(state && state.vehicles ? state.vehicles : []).forEach(function (car) {
      ;(car && car.categories ? car.categories : []).forEach(function (cat) {
        const id = vehicleCategoryAnnualItemId(cat)
        if (id) candidates[id] = true
      })
    })
    Object.keys(state && state.years ? state.years : {}).forEach(function (key) {
      const group = findGroup(state.years[key], 'auto')
      ;(group && group.items ? group.items : []).forEach(function (item) {
        if (item && item.id) candidates[item.id] = true
      })
    })
    Object.keys(candidates).forEach(function (id) { pruneOrphanVehicleAnnualItem(id) })
  }

  function collectReflectMonths(ctx, year) {

    ANNUAL_REFLECT_SOURCES.forEach(function (src) {

      Object.keys(pack).forEach(function (id) { merged[id] = pack[id] })

  }

  function mappedReflectItemIds() {

    ANNUAL_REFLECT_SOURCES.forEach(function (src) {
      const list = typeof src.itemIds === 'function' ? src.itemIds() : (src.itemIds || [])
      ;(list || []).forEach(function (id) {

      })

  }

  function yearHasItem(data, itemId) {
    const groups = data && data.groups ? data.groups : []
    for (let i = 0; i < groups.length; i++) {
      const items = groups[i] && groups[i].items ? groups[i].items : []
      for (let j = 0; j < items.length; j++) {
        if (items[j] && items[j].id === itemId) return true
      }
    }
    return false
  }

  function itemYearBudgetsAllZero(data, itemId) {
    return MONTH_KEYS.every(function (mm) {

      return !line || asFiniteNumber(line.budget) === 0
    })
  }

  function setItemYearBudgets(data, itemId, months) {
    if (!data || !yearHasItem(data, itemId)) return
    if (!data.months) data.months = {}
    MONTH_KEYS.forEach(function (mm) {
      if (!data.months[mm]) data.months[mm] = {}
      const current = data.months[mm][itemId] || { budget: 0, actual: 0 }
      data.months[mm][itemId] = {

    })
  }

  let yearBudgetCeilPersistLock = false

  function normalizeYearBudgetsCeil100(data) {
    if (!data || !data.months) return false
    let changed = false
    MONTH_KEYS.forEach(function (mm) {
      const bucket = data.months[mm]
      if (!bucket || typeof bucket !== 'object') return
      Object.keys(bucket).forEach(function (itemId) {
        const line = bucket[itemId]
        if (!line || typeof line !== 'object' || !('budget' in line)) return
        // hobby stores the paid month's actual. Vehicle months are entry sums.
        // None of those is a 100-yen ceil. Annual 月平均 is ceilYen100, not a month-cell ceil.
        // Editable 目的別 totals are one integer spread across months (remainder on month 12).
        // Do not ceil those cells or the typed 合計 would change on the next year render.
        if (isActualMonthAvgAnnualItem(itemId) || isVehicleAnnualReadonly(itemId)) return
        const savingRef = annualItemRef(data, itemId)
        if (savingRef && yearSavingTotalEditable(savingRef.item)) return
        const raw = asFiniteNumber(line.budget)
        const next = ceilYen100(raw)
        if (next !== raw) {
          line.budget = next
          changed = true
        }
      })
    })
    return changed
  }

  function applyAnnualReflect(data, year, ctx, overwrite) {

  // Annual groups of removed tabs (and the MF 食費/日用品/交通費 rows). Dropped when old data or a v183 backup loads.
  const REMOVED_ANNUAL_GROUP_IDS = { health: true, cash: true, util: true, tel: true, ins: true, daily: true, food: true, transit: true, tax: true }
  const REMOVED_ANNUAL_ITEM_PREFIXES = ['health-', 'cash-', 'util-', 'tel-', 'ins-', 'tax-', 'food-', 'daily-', 'transit-']

  function parseGroups(value) {
    if (!Array.isArray(value)) return []
    const groups = []
    const used = {}
    value.forEach(function (group) {
      if (!group || typeof group !== 'object') return
      const id = typeof group.id === 'string' && group.id ? group.id : ''
      const label = typeof group.label === 'string' && group.label ? group.label : ''
      if (!id || !label || used[id] || !Array.isArray(group.items)) return
      if (REMOVED_ANNUAL_GROUP_IDS[id]) return
      const items = []
      const itemUsed = {}
      group.items.forEach(function (item) {
        if (!item || typeof item !== 'object') return
        const itemId = typeof item.id === 'string' && item.id ? item.id : ''
        const itemLabel = typeof item.label === 'string' && item.label ? item.label : ''
        if (!itemId || !itemLabel || itemUsed[itemId]) return
        if (isRemovedAnnualItemId(itemId)) return
        itemUsed[itemId] = true
        items.push({ id: itemId, label: itemLabel, kind: itemKind({ kind: item.kind, label: itemLabel }) })
      })
      // その他 (misc) had no tab. Keep it only when it still has rows.
      if (id === 'misc' && !items.length) return
      used[id] = true
      groups.push({ id: id, label: label, items: items })
    })
    return groups
  }

  function normalizeYear(year, value) {
    const parsedGroups = parseGroups(value && value.groups)
    const groups = alignYearGroups(parsedGroups.length ? parsedGroups : cloneGroups(GROUPS))
    const ids = listItemIds(groups)
    const fallback = year === SEED_YEAR ? seedYear2026() : emptyYear(groups)
    const rawMonths = value && value.months && typeof value.months === 'object' ? value.months : {}
    const months = {}
    MONTH_KEYS.forEach(function (mm) {
      const src = rawMonths[mm]
      const lines = {}
      ids.forEach(function (id) {
        const fromSrc = src && typeof src === 'object' ? src[id] : undefined
        const fromFallback = fallback.months[mm] && fallback.months[mm][id] ? fallback.months[mm][id] : emptyLine()
        if (fromSrc && typeof fromSrc === 'object') {
          lines[id] = {
            budget: 'budget' in fromSrc ? asFiniteNumber(fromSrc.budget) : fromFallback.budget,
            actual: 'actual' in fromSrc ? asFiniteNumber(fromSrc.actual) : fromFallback.actual,
          }
        } else {
          lines[id] = { budget: fromFallback.budget, actual: fromFallback.actual }
        }
      })
      months[mm] = lines
    })
    const normalized = { groups: groups, months: months }
    migrateHobbyAnnualLabelsInData(normalized)
    migrateEducationAnnualLabelsInData(normalized)
    migrateVehicleAnnualLabelsInData(normalized)
    return normalized
  }

  function normalizeSocialItem(personId, item, catalog, index) {
    if (!item || typeof item !== 'object') {
      if (!catalog) return null
      return {
        id: personId + '-' + catalog.id,
        name: catalog.name,
        plan: 0,
        entries: [],
      }
    }
    const name = typeof item.name === 'string' && item.name.trim()
      ? item.name.trim()
      : (catalog ? catalog.name : '')
    if (!name || name === '計') return null
    const id = typeof item.id === 'string' && item.id
      ? item.id
      : (catalog ? personId + '-' + catalog.id : personId + '-item-' + index)
    const planRaw = 'plan' in item ? item.plan : item.total
    return {
      id: id,
      name: name,
      plan: Math.round(asFiniteNumber(planRaw)),
      entries: normalizeEntries(item.entries),
    }
  }

  function normalizeSocialPerson(raw, index) {
    const id = raw && typeof raw.id === 'string' && raw.id
      ? raw.id
      : ('social-p-' + (index + 1))
    const label = raw && typeof raw.label === 'string' && raw.label.trim()
      ? raw.label.trim()
      : ('人' + (index + 1))
    const byName = {}
    const items = []
    ;(raw && Array.isArray(raw.items) ? raw.items : []).forEach(function (item, itemIndex) {
      const normalized = normalizeSocialItem(
        id,
        item,
        socialCatalogByName(item && item.name),
        itemIndex,
      )
      if (!normalized) return
      byName[normalized.name] = normalized
      items.push(normalized)
    })
    SOCIAL_CATALOG.forEach(function (cat) {
      if (byName[cat.name]) return
      const seeded = normalizeSocialItem(id, null, cat, items.length)
      if (seeded) items.push(seeded)
    })
    const out = { id: id, label: label, items: items }
    if (raw && raw.deleted === true) out.deleted = true
    return out
  }

  function normalizeSocialShape(raw) {
    const people = []
    ;(raw && Array.isArray(raw.people) ? raw.people : []).forEach(function (person, index) {
      const normalized = normalizeSocialPerson(person, index)
      if (normalized) people.push(normalized)
    })
    return {
      start: raw && raw.start ? String(raw.start) : '2026-01-01',
      end: raw && raw.end ? String(raw.end) : '2056-01-01',
      planYears: asFiniteNumber(raw && raw.planYears) || 30,
      people: people,

    let sum = 0
    ;(rows || []).forEach(function (row) { sum += socialNamePlan(person, row.name) })
    return sum
  }

  function socialRowsPlanTotal(people, rows) {
    let sum = 0
    ;(people || []).forEach(function (person) { sum += socialRowsPlanForPerson(person, rows) })

  }

  function socialRowsSpentForPerson(person, rows) {

      const item = findSocialItemByName(person, row.name)
      sum += socialItemSpent(item)
    })

  }

  function socialRowsSpentTotal(people, rows) {

  function socialPersonSpent(person) {

  function socialPersonShowsAmount(person, name) {

  function socialVisibleRows(people, rows, editMode) {
    return (rows || []).filter(function (row) {

  function socialSplitAmount(amount, years) {

    return (

    )

  function socialVisibleGroupTotals(soc) {
    const groups = socialGroupedRows()
    const people = socialActivePeople(soc && soc.people)
    const allPeople = soc && soc.people ? soc.people : []
    function pack(rows) {
      const plan = socialRowsPlanTotal(people, rows)
      const spent = socialRowsSpentTotal(allPeople, rows)
      return { plan: plan, spent: spent, remain: plan - spent }
    }
    const daily = pack(groups[0].rows)
    const purpose = pack(groups[1].rows)
    return {
      daily: daily,
      purpose: purpose,
      total: {
        plan: daily.plan + purpose.plan,
        spent: daily.spent + purpose.spent,
        remain: (daily.plan + purpose.plan) - (daily.spent + purpose.spent),
      },
    }
  }

  function socialPersonGroupTotals(person, groups) {
    return (groups || []).map(function (group) {
      const plan = socialRowsPlanForPerson(person, group.rows)
      const spent = socialRowsSpentForPerson(person, group.rows)
      const show = socialVisibleRows([person], group.rows).length > 0
      return {
        id: group.id,
        show: show,
        plan: plan,
        spent: spent,
        remain: plan - spent,
      }
    })
  }

  function socialSumPlansByNames(soc, names) {
    let sum = 0
    const nameSet = {}
    ;(names || []).forEach(function (name) { nameSet[name] = true })
    socialActivePeople(soc && soc.people).forEach(function (person) {
      ;(person.items || []).forEach(function (item) {
        if (!item || !nameSet[item.name]) return
        sum += asFiniteNumber(item.plan)
      })
    })
    return sum
  }

  function socialReflectMonths(soc, year) {
    const out = {}
    const years = asFiniteNumber(soc && soc.planYears)
    const inWindow = yearOverlapsWindow(year, soc && soc.start, soc && soc.end)
    SOCIAL_ANNUAL_SPECS.forEach(function (spec) {
      const yearAmt = inWindow && years > 0
        ? socialSumPlansByNames(soc, spec.names) / years
        : 0
      out[spec.id] = splitYearAcrossMonths(yearAmt)
    })
    return out
  }

  function ensureSocialAnnualItemInData(data, itemId, label, kind) {
    if (!data || !itemId) return
    let group = findGroup(data, 'social')
    if (!group) {
      group = { id: 'social', label: '交際費', items: [] }
      data.groups = Array.isArray(data.groups) ? data.groups.concat([group]) : [group]
    }
    let item = findItem(group, itemId)
    if (!item) {
      item = { id: itemId, label: label, kind: kind === 'saving' ? 'saving' : 'daily' }
      group.items.push(item)
    } else {
      item.label = label
      item.kind = kind === 'saving' ? 'saving' : 'daily'
    }
    if (!data.months) data.months = {}
    MONTH_KEYS.forEach(function (mm) {
      if (!data.months[mm]) data.months[mm] = {}
      if (!data.months[mm][itemId]) data.months[mm][itemId] = emptyLine()
    })
  }

  function syncSocialToAnnual() {
    if (socialAnnualSyncing) return
    if (!state.social) state.social = seedSocial()
    socialAnnualSyncing = true
    try {
      const year = state.activeYear
      const pack = socialReflectMonths(state.social, year)
      const data = yearData()
      SOCIAL_ANNUAL_SPECS.forEach(function (spec) {
        Object.keys(state.years || {}).forEach(function (key) {
          const yd = state.years[key]
          if (!yd) return
          ensureSocialAnnualItemInData(yd, spec.id, spec.label, spec.kind)
        })
        setAnnualItemLabelAllYears(spec.id, spec.label)
        ensureSocialAnnualItemInData(data, spec.id, spec.label, spec.kind)
        setItemYearBudgets(data, spec.id, pack[spec.id] || splitYearAcrossMonths(0))
      })
    } finally {
      socialAnnualSyncing = false
    }
  }

  function renderSocialHeadlineKpis(totals, years) {

    const purposeSplit = socialSplitAmount(totals.purpose.plan, years)
    const totalSplit = socialSplitAmount(totals.total.plan, years)

    const remainMonthly = remainMonths > 0 ? ceilYen100(Math.max(0, asFiniteNumber(totals.total.remain)) / remainMonths) : 0

      money('計', totals.total.plan, '年 ' + formatYen(totalSplit.year) + ' · 月 ' + formatYen(totalSplit.month), '', remainLine) +

  function defaultTabOrder(vehicles) {
    return ['vehicles', 'education', 'hobby', 'special', 'social', 'housing', 'loans']
  }

  function tabIdToSyncedGroupId(tabId) {
    if (tabId === 'vehicles') return 'auto'
    if (tabId === 'education') return 'education'
    if (tabId === 'hobby') return 'hobby'
    if (tabId === 'special') return 'special'
    if (tabId === 'social') return 'social'
    return null
  }

  const ANNUAL_GROUP_LABEL_ORDER = [
    '自動車',
    '教養・教育',
    '趣味・娯楽',
    '特別な支出',
    'その他',
    '交際費',
  ]

  function orderAnnualGroupsByLabel(groups) {
    const rank = {}
    ANNUAL_GROUP_LABEL_ORDER.forEach(function (label, index) { rank[label] = index })
    return (Array.isArray(groups) ? groups : []).map(function (group, index) {
      return { group: group, index: index }
    }).sort(function (a, b) {
      const ra = Object.prototype.hasOwnProperty.call(rank, a.group && a.group.label)
        ? rank[a.group.label]
        : ANNUAL_GROUP_LABEL_ORDER.length
      const rb = Object.prototype.hasOwnProperty.call(rank, b.group && b.group.label)
        ? rank[b.group.label]
        : ANNUAL_GROUP_LABEL_ORDER.length
      return ra === rb ? a.index - b.index : ra - rb
    }).map(function (row) { return row.group })
  }

  function orderGroupsByTabOrder(groups, tabOrder) {
    const list = Array.isArray(groups) ? groups.slice() : []
    const byId = {}
    list.forEach(function (group) {
      if (group && group.id) byId[group.id] = group
    })
    const syncedIds = []
    const seen = {}
    ;(Array.isArray(tabOrder) ? tabOrder : []).forEach(function (tabId) {
      const gid = tabIdToSyncedGroupId(tabId)
      if (!gid || seen[gid] || !byId[gid]) return
      seen[gid] = true
      syncedIds.push(gid)
    })
    ;['auto', 'education', 'hobby', 'special', 'social'].forEach(function (gid) {
      if (!seen[gid] && byId[gid]) {
        seen[gid] = true
        syncedIds.push(gid)
      }
    })
    const synced = syncedIds.map(function (id) { return byId[id] })
    const rest = list.filter(function (group) { return group && !seen[group.id] })
    return synced.concat(rest)
  }

  function applyGroupOrderFromTabs(tabOrder) {
    const order = Array.isArray(tabOrder) ? tabOrder : normalizeTabOrder(state.tabOrder, state.vehicles)
    Object.keys(state.years || {}).forEach(function (key) {
      const year = state.years[key]
      if (year && Array.isArray(year.groups)) {
        year.groups = orderGroupsByTabOrder(year.groups, order)
      }
    })
  }

  function normalizeTabOrder(raw, vehicles) {
    const known = { education: true, hobby: true, special: true, social: true, housing: true, loans: true, vehicles: true }
    const carIds = {}
    ;(vehicles || []).forEach(function (car) {
      if (car && car.id) carIds[car.id] = true
    })
    const seen = {}
    const order = []
    if (Array.isArray(raw)) {
      raw.forEach(function (id) {
        if (typeof id !== 'string' || seen[id]) return
        if (carIds[id]) {
          if (!seen.vehicles) {
            seen.vehicles = true
            order.push('vehicles')
          }
          return
        }
        if (known[id]) {
          seen[id] = true
          order.push(id)
        }
      })
    }
    defaultTabOrder(vehicles).forEach(function (id) {
      if (known[id] && !seen[id]) {
        seen[id] = true
        if (id === 'loans') {
          const hi = order.indexOf('housing')
          if (hi >= 0) order.splice(hi + 1, 0, id)
          else order.push(id)
        } else {
          order.push(id)
        }
      }
    })
    return order
  }

  function defaultState() {
    const vehicles = seedVehicles()
    return {
      format: FORMAT,
      activeYear: SEED_YEAR,
      selectedMonth: defaultSelectedMonth(),
      years: { '2026': seedYear2026() },
      vehicles: vehicles,
      education: seedEducation(),
      hobby: seedHobby(),
      housing: seedHousing(),
      loans: seedLoans(),
      special: seedSpecial(),
      social: seedSocial(),
      tabOrder: normalizeTabOrder(null, vehicles),
    }
  }

  function listYears(state) {
    return Object.keys(state.years).map(Number).filter(function (year) {
      return Number.isFinite(year)
    }).sort(function (a, b) { return a - b })
  }

  function normalizeState(raw) {
    const base = defaultState()
    if (!raw || typeof raw !== 'object') return base
    const years = {}
    const sourceYears = raw.years && typeof raw.years === 'object' ? raw.years : {}
    Object.keys(sourceYears).forEach(function (key) {
      const year = Number(key)
      if (!Number.isFinite(year)) return
      years[String(year)] = normalizeYear(year, sourceYears[key])
    })
    if (!Object.keys(years).length) years['2026'] = seedYear2026()
    const yearList = Object.keys(years).map(Number).sort(function (a, b) { return a - b })
    let activeYear = asFiniteNumber(raw.activeYear) || SEED_YEAR
    if (!years[String(activeYear)]) activeYear = yearList[0]
    let selectedMonth = typeof raw.selectedMonth === 'string' ? raw.selectedMonth : defaultSelectedMonth()
    if (MONTH_KEYS.indexOf(selectedMonth) < 0) selectedMonth = '01'
    const vehicles = normalizeVehicles(raw.vehicles)
    const tabOrder = normalizeTabOrder(raw.tabOrder, vehicles)
    Object.keys(years).forEach(function (key) {
      if (years[key] && Array.isArray(years[key].groups)) {
        years[key].groups = orderGroupsByTabOrder(years[key].groups, tabOrder)
      }
    })
    return {
      format: FORMAT,
      activeYear: activeYear,
      selectedMonth: selectedMonth,
      years: years,
      vehicles: vehicles,
      education: normalizeEducation(raw.education),
      hobby: normalizeHobby(raw.hobby),
      housing: normalizeHousing(raw.housing),
      loans: normalizeLoans(raw.loans),
      special: normalizeSpecial(raw.special),
      social: normalizeSocial(raw.social),
      tabOrder: tabOrder,
    }
  }

  function loadState() {
    try {
      const text = localStorage.getItem(STORAGE_KEY)
      if (!text) return { state: defaultState(), recovered: false }
      return { state: normalizeState(JSON.parse(text)), recovered: false }
    } catch (err) {
      return { state: defaultState(), recovered: true }
    }
  }

  function persist() {
    const payload = {
      format: FORMAT,
      activeYear: state.activeYear,
      selectedMonth: state.selectedMonth,
      years: state.years,
      vehicles: state.vehicles,
      education: state.education,
      hobby: state.hobby,
      housing: state.housing,
      loans: state.loans,
      special: state.special,
      social: state.social,
      tabOrder: normalizeTabOrder(state.tabOrder, state.vehicles),
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload))
  }

  function exportObject() {
    return {
      format: FORMAT,
      exportedAt: new Date().toISOString(),
      activeYear: state.activeYear,
      years: state.years,
      vehicles: state.vehicles,
      education: state.education,
      hobby: state.hobby,
      housing: state.housing,
      loans: state.loans,
      special: state.special,
      social: state.social,
      tabOrder: normalizeTabOrder(state.tabOrder, state.vehicles),
    }
  }

  function extractYearsFromUnknown(parsed) {
    if (!parsed || typeof parsed !== 'object') return null
    if (parsed.format === FORMAT && parsed.years && typeof parsed.years === 'object') {
      return parsed.years
    }
    if (parsed.years && typeof parsed.years === 'object') {
      const years = {}
      Object.keys(parsed.years).forEach(function (key) {
        const bucket = parsed.years[key]
        if (bucket && typeof bucket === 'object' && bucket.expenseDetail) {
          years[key] = bucket.expenseDetail
        } else if (bucket && typeof bucket === 'object' && bucket.groups && bucket.months) {
          years[key] = bucket
        }
      })
      if (Object.keys(years).length) return years
    }
    if (parsed.groups && parsed.months) {
      const year = asFiniteNumber(parsed.activeYear) || SEED_YEAR
      const years = {}
      years[String(year)] = parsed
      return years
    }
    return null
  }

  function parseIncoming(text) {
    let parsed
    try {
      parsed = JSON.parse(text)
    } catch (err) {
      return { ok: false, reason: 'invalid-json' }
    }
    const years = extractYearsFromUnknown(parsed)
    if (!years) return { ok: false, reason: 'not-shishutsu' }
    const wrapped = {
      format: FORMAT,
      activeYear: parsed.activeYear,
      selectedMonth: parsed.selectedMonth,
      years: years,
      vehicles: parsed.vehicles,
      education: parsed.education,
      hobby: parsed.hobby,
      housing: parsed.housing,
      loans: parsed.loans,
      special: parsed.special,
      social: parsed.social,

  function utf8ToBase64(text) {
    const bytes = new TextEncoder().encode(text)
    let binary = ''
    const chunk = 0x8000
    for (let i = 0; i < bytes.length; i += chunk) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk))
    }
    return btoa(binary)
  }

  function clickDownload(href, filename) {
    const link = document.createElement('a')
    link.href = href
    link.download = filename
    link.rel = 'noopener'
    link.style.display = 'none'
    document.body.appendChild(link)
    link.click()
    document.body.removeChild(link)
  }

  function downloadJsonFile(filename, json) {
    const android = /Android/i.test(navigator.userAgent)
    const localFile = location.protocol === 'file:' || location.protocol === 'content:'
    if (android && localFile) {
      clickDownload('data:application/octet-stream;base64,' + utf8ToBase64(json), filename)
      return
    }
    const blob = new Blob([json], { type: 'application/json;charset=utf-8' })
    const url = URL.createObjectURL(blob)
    clickDownload(url, filename)
    window.setTimeout(function () { URL.revokeObjectURL(url) }, 2000)
  }

      if (catalog) {

        if (!row.label || row.label === catalog.label || aliases[row.label]) {
          row.label = catalog.label
        }
        byId[group.id] = row
      } else {
        extras.push(row)
      }
    })
    const aligned = GROUPS.map(function (canon) {
      if (byId[canon.id]) return byId[canon.id]
      return {

        label: canon.label,
        items: (canon.items || []).map(function (item) {

  function spreadIntegerYenAcrossMonths(total) {

    const base = Math.trunc(n / 12)
    const rem = n - base * 12
    const months = {}
    MONTH_KEYS.forEach(function (mm, index) {

    return months

  function suggestedSameMonthBudget(data, itemId) {
    const amounts = MONTH_KEYS.map(function (mm) {
      return lineAt(data, mm, itemId).budget
    })
    const counts = {}
    amounts.forEach(function (n) {
      const key = String(n)
      counts[key] = (counts[key] || 0) + 1
    })
    let bestNonZero = null
    let bestCount = 0
    Object.keys(counts).forEach(function (key) {
      const n = asFiniteNumber(key)
      const c = counts[key]
      if (n === 0) return
      if (c > bestCount) {
        bestCount = c
        bestNonZero = n
      }
    })
    if (bestCount >= 2) return bestNonZero
    return amounts[0]
  }

  /**
   * When a new calendar year Y is created, purpose/saving buckets that store
   * multi-year「貯めた」as entry sums get a one-time Y-01 memo「繰越」equal to
   * sum(entries with year < Y). Year-filtered KPIs then keep cumulative progress.
   * Skips if a 繰越 for Y-01 already exists (no double-count).
   * Vehicles are excluded: that tab shows every year, so a carry row would double-count.
   */
  function carryPurposeSavingsIntoYear(year) {
    const y = asFiniteNumber(year)
    if (!Number.isFinite(y)) return

    function carryCatList(root, listKey) {
      const pack = root && typeof root === 'object' ? root : null
      if (!pack || !Array.isArray(pack[listKey])) return
      pack[listKey].forEach(function (cat) {
        if (!cat || isSoftDeleted(cat)) return
        // Purpose-style: has saving plan line (incl. dual daily+saving like ペット)
        if (!(cat.saving && typeof cat.saving === 'object')) return
        cat.entries = ensurePurposeCarryEntry(cat.entries || [], y)
      })
    }

    carryCatList(state.hobby, 'categories')

    // Special「その他」entries act as a catch-all purpose-adjacent bucket
    if (state.special && Array.isArray(state.special.categories)) {
      state.special.categories.forEach(function (cat) {
        if (!cat || cat.id !== 'other') return
        cat.entries = ensurePurposeCarryEntry(cat.entries || [], y)
      })
    }

    // Education: non-daily (目的別) items
    if (state.education && Array.isArray(state.education.people)) {
      state.education.people.forEach(function (person) {
        if (!person || isSoftDeleted(person)) return
        ;(person.items || []).forEach(function (item) {
          if (!item || item.name === '計') return
          if (isEducationDailyItem(item)) return
          item.entries = ensurePurposeCarryEntry(item.entries || [], y)
        })
      })
    }

    // Social: purpose-group catalog items
    if (state.social && Array.isArray(state.social.people)) {
      state.social.people.forEach(function (person) {
        if (!person || isSoftDeleted(person)) return
        ;(person.items || []).forEach(function (item) {
          if (!item || item.name === '計') return
          if (!socialItemIsPurpose(item)) return
          item.entries = ensurePurposeCarryEntry(item.entries || [], y)
        })
      })
    }

    // Vehicles: no 繰越. The automobile tab lists every year, so a carry row double-counts.
  }

  function copyPreviousBudgets() {
    const prev = previousYear(state.activeYear)

    if (!ok) return
    const source = state.years[String(prev)]
    const current = yearData()
    const next = copyYear(source, true)
    MONTH_KEYS.forEach(function (mm) {
      allItemIds(next).forEach(function (id) {
        next.months[mm][id].actual = lineAt(current, mm, id).actual
      })
    })
    state.years[String(state.activeYear)] = next
    syncVehiclesToAnnual()
    persist()
    flash(prev + '年の予算をコピーしました。', 'ok')
    render()
  }

  // v15: 全体の目安（住宅費・借入金・趣味・娯楽を除く）。趣味・娯楽は将来的な名目で貯めないため対象外。
  // 教養・教育／交際費は将来残額÷計画終了（state.education.end / state.social.end）までの残り月数（100円切上げ）。
  // 終了日が無い・不正・過去なら100歳までの残り月数。自動車は従来どおり（100歳まで）。
  // 特別な支出の月額は各カテゴリの月額合計。累計（future）は教育の計画終了までの月数で数える。
  function overallMonthsUntilEnd(endRaw, fallbackMonths) {
    const m = String(endRaw || '').trim().match(/^(\d{4})-(\d{2})/)
    if (!m) return fallbackMonths
    const ey = Number(m[1])
    const em = Number(m[2])
    if (!(ey > 0) || !(em >= 1 && em <= 12)) return fallbackMonths
    const t = tokyoTodayParts()
    const n = ey * 12 + em - (t.y * 12 + t.m)
    return n > 0 ? n : fallbackMonths
  }

  function overallMonthlyEstimate() {
    const housing = ensureHousingState()
    const months = housingMonthsTo100(housing)
    const eduMonths = overallMonthsUntilEnd(state.education && state.education.end, months)
    const socialMonths = overallMonthsUntilEnd(state.social && state.social.end, months)
    function byRemain(remain, n) { return n > 0 ? ceilYen100(Math.max(0, asFiniteNumber(remain)) / n) : 0 }
    let vehiclePlan = 0
    let vehicleSpent = 0
    ;(state.vehicles || []).forEach(function (car) {
      if (!car || isSoftDeleted(car)) return
      vehiclePlan += asFiniteNumber(car.budgetTotal)
      vehicleSpent += asFiniteNumber(car.spentTotal)
    })
    const vehicleRemain = vehiclePlan - vehicleSpent
    const eduTot = educationVisibleGroupTotals(state.education || seedEducation()).total
    const specialMonthly = Math.round(specialTabMonthlyTotal())
    let specialSpent = 0
    ;((state.special && state.special.categories) || []).forEach(function (cat) {
      if (!cat || !(cat.sync === 'plan' || cat.id === 'other')) return
      ;(cat.entries || []).forEach(function (e) { if (e) specialSpent += asFiniteNumber(e.amount) })
    })
    const specialFuture = specialMonthly * eduMonths
    const socialTot = socialVisibleGroupTotals(state.social || {}).total
    const parts = [
      { label: '自動車', monthly: byRemain(vehicleRemain, months), spent: vehicleSpent, remain: vehicleRemain, plan: vehiclePlan, months: months },
      { label: '教養・教育', monthly: byRemain(eduTot.remain, eduMonths), spent: eduTot.spent, remain: eduTot.remain, plan: eduTot.plan, months: eduMonths },
      { label: '特別な支出', monthly: specialMonthly, spent: specialSpent, remain: specialFuture, plan: specialSpent + specialFuture, months: eduMonths },
      { label: '交際費', monthly: byRemain(socialTot.remain, socialMonths), spent: socialTot.spent, remain: socialTot.remain, plan: socialTot.plan, months: socialMonths },
    ]
    const monthly = parts.reduce(function (t, x) { return t + x.monthly }, 0)
    return { monthly: monthly, yearly: monthly * 12, parts: parts, months: months, eduMonths: eduMonths, socialMonths: socialMonths }
  }

      if (id === 'hobby') return tabChipHtml('hobby', '趣味・娯楽')

      if (id === 'social') return tabChipHtml('social', '交際費')

  function moveTabOrder(fromId, beforeId) {
    const order = contentTabIds().slice()
    const from = order.indexOf(fromId)
    if (from < 0 || fromId === beforeId) return false
    order.splice(from, 1)
    if (!beforeId) order.push(fromId)
    else {
      const to = order.indexOf(beforeId)
      order.splice(to < 0 ? order.length : to, 0, fromId)
    }
    const next = normalizeTabOrder(order, state.vehicles)
    if (next.join('\0') === contentTabIds().join('\0')) return false
    state.tabOrder = next
    applyGroupOrderFromTabs(next)
    persist()
    return true
  }

  function reservedVehicleIds() {
    return { year: true, education: true, hobby: true, special: true, social: true, housing: true, loans: true, vehicles: true }
  }

  function nextVehicleId(label) {
    const reserved = reservedVehicleIds()
    const used = {}
    state.vehicles.forEach(function (car) { used[car.id] = true })
    const slug = String(label || '')
      .trim()
      .toLowerCase()
      .replace(/[ぁ-んァ-ン一-龯々〆〤ー]/g, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '')
    if (slug && !used[slug] && !reserved[slug]) return slug
    let n = 1
    while (used['car-' + n] || reserved['car-' + n]) n++
    return 'car-' + n
  }

  function findVehicleItem(car, itemId) {
    let found = null
    car.items.forEach(function (item) {
      if (item.id === itemId) found = item
    })
    return found
  }

  function findVehicleCategory(car, catId) {
    let found = null
    car.categories.forEach(function (cat) {
      if (cat.id === catId) found = cat
    })
    return found
  }

  function nextVehicleCategoryId(car) {
    const reserved = { shaken: true, tax: true, other: true, oil: true, tsumitate: true }
    let max = 0
    ;(car && car.categories ? car.categories : []).forEach(function (cat) {
      if (!cat || !cat.id) return
      reserved[cat.id] = true
      const match = String(cat.id).match(/^cat-(\d+)$/)
      if (match) max = Math.max(max, Number(match[1]))
    })
    let n = max + 1
    let id = 'cat-' + n
    while (reserved[id]) {
      n += 1
      id = 'cat-' + n
    }
    return id
  }

  function addVehicleCategory(carId, label, kind) {
    const car = findVehicle(carId)
    if (!car) return false
    const name = String(label == null ? '' : label).replace(/\s+/g, ' ').trim()
    if (!name) {
      flash('カテゴリ名を入力してください。', 'warn')
      return false
    }
    const resolvedKind = kind === 'saving' ? 'saving' : 'daily'
    if (!Array.isArray(car.categories)) car.categories = []
    let dup = false
    car.categories.forEach(function (row) {
      if (row && row.label === name && vehicleCategoryKind(row) === resolvedKind) dup = true
    })
    if (dup) {
      flash('同じカテゴリ名（同区分）がすでにあります。', 'warn')
      return false
    }
    const id = nextVehicleCategoryId(car)
    const annualItemId = allocateVehicleAnnualItemId(id, name, resolvedKind, state.vehicles)
    car.categories.push({
      id: id,
      label: name,
      kind: resolvedKind,
      annualItemId: annualItemId,
      lifetimeBudget: 0,
      perYear: 0,
      actual: 0,
    })
    applyVehicleDerived(car)
    reconcileVehicleAnnualItemIds(state.vehicles)
    syncVehiclesToAnnual()
    persist()
    const kindLabel = resolvedKind === 'saving' ? '目的別' : '日常'
    flash('カテゴリ「' + name + '」（' + kindLabel + '）を追加し年間へ同期しました。', 'ok')
    return true
  }

  function removeVehicleCategory(carId, catId) {
    const car = findVehicle(carId)
    if (!car) return
    const cat = findVehicleCategory(car, catId)
    if (!cat) return
    if (!Array.isArray(car.categories) || car.categories.length <= 1) {
      flash('カテゴリは最低1つ必要です。', 'warn')
      return
    }
    if (cat.id === 'other') {
      flash('「その他」は削除できません。', 'warn')
      return
    }
    const other = findVehicleCategory(car, 'other')
    const otherLabel = other && other.label ? other.label : 'その他'
    let itemCount = 0
    ;(car.items || []).forEach(function (item) {
      if (item && item.category === cat.label) itemCount += 1
    })
    let msg = 'カテゴリ「' + cat.label + '」を削除します。'
    if (itemCount) {
      msg += '明細が' + itemCount + '件あります。削除後はカテゴリを「' + otherLabel + '」に付け替えます。'
    }
    const annualItemId = vehicleCategoryAnnualItemId(cat)
    if (annualItemId) {
      msg += '他の車両に同じ区分のカテゴリが無ければ、年間の対応細目も消えます。'
    }
    msg += 'よろしいですか？'
    if (!window.confirm(msg)) return
    const oldLabel = cat.label
    car.categories = car.categories.filter(function (row) { return row.id !== catId })
    ;(car.items || []).forEach(function (item) {
      if (item && item.category === oldLabel) item.category = otherLabel
    })
    applyVehicleDerived(car)
    syncVehiclesToAnnual()
    if (annualItemId) pruneOrphanVehicleAnnualItem(annualItemId)
    persist()
    flash('カテゴリ「' + oldLabel + '」を削除しました。', 'ok')
  }

  function setVehicleField(carId, field, value) {
    const car = findVehicle(carId)
    if (!car) return
    if (field === 'label') {
      const next = String(value).replace(/\s+/g, ' ').trim()
      if (!next) {
        flash('車両名を入力してください。', 'warn')
        return
      }
      car.label = next
    } else if (field === 'plate') {
      car.plate = normalizePlate(value)
    } else if (field === 'start') {
      car.start = String(value)
    } else if (field === 'end') {
      car.end = String(value)
    } else if (field === 'planYears') {
      car.planYears = asFiniteNumber(value)
    } else if (field === 'elapsedYears') {
      car.elapsedYears = value === '' || value == null ? null : asFiniteNumber(value)
    } else if (field === 'mfImport') {
      car.mfImport = value !== false && value !== 'false' && value !== 0 && value !== '0'
    } else if (field === 'budgetTotal' || field === 'spentTotal' || field === 'budgetPerYear') {
      applyVehicleDerived(car)
      syncVehiclesToAnnual()
      persist()
      return
    }
    applyVehicleDerived(car)
    syncVehiclesToAnnual()
    persist()
  }

  function setVehicleCategory(carId, catId, field, value) {
    const car = findVehicle(carId)
    if (!car) return
    const cat = findVehicleCategory(car, catId)
    if (!cat) return
    if (field === 'lifetimeBudget') {
      cat.lifetimeBudget = Math.round(asFiniteNumber(value))
    } else if (field === 'perYear' || field === 'actual') {
      applyVehicleDerived(car)
      syncVehiclesToAnnual()
      persist()
      return
    } else if (field === 'label') {
      const next = String(value).replace(/\s+/g, ' ').trim()
      if (!next) {
        flash('カテゴリ名を入力してください。', 'warn')
        return
      }
      let dup = false
      car.categories.forEach(function (row) {
        if (row.id !== cat.id && row.label === next) dup = true
      })
      if (dup) {
        flash('同じカテゴリ名がすでにあります。', 'warn')
        return
      }
      const old = cat.label
      if (old === next) return
      const catalogId = vehicleCatalogAnnualItemId(cat.id)
      const annualId = vehicleCategoryAnnualItemId(cat)
      const renameOne = function (targetCar, targetCat, fromLabel) {
        if (!targetCar || !targetCat) return
        targetCat.label = next
        ;(targetCar.items || []).forEach(function (entry) {
          if (entry && entry.category === fromLabel) entry.category = next
        })
        applyVehicleDerived(targetCar)
      }
      renameOne(car, cat, old)
      if (catalogId) {
        state.vehicles.forEach(function (other) {
          if (!other || other.id === car.id) return
          const otherCat = findVehicleCategory(other, cat.id)
          if (!otherCat) return
          renameOne(other, otherCat, otherCat.label)
        })
      } else if (annualId) {
        state.vehicles.forEach(function (other) {
          if (!other) return
          ;(other.categories || []).forEach(function (otherCat) {
            if (!otherCat || (other.id === car.id && otherCat.id === cat.id)) return
            if (vehicleCategoryAnnualItemId(otherCat) !== annualId) return
            renameOne(other, otherCat, otherCat.label)
          })
        })
      }
      syncVehiclesToAnnual()
      persist()
      return
    }
    applyVehicleDerived(car)
    syncVehiclesToAnnual()
    persist()
  }

  function setVehicleItem(carId, itemId, field, value) {
    const car = findVehicle(carId)

    const item = findVehicleItem(car, itemId)

    if (!Array.isArray(item.entries)) item.entries = []

        item.total = Math.round(asFiniteNumber(value))
      } else if (field === 'count') {

        item.avg = asFiniteNumber(value)

        syncVehiclesToAnnual()

  function copyCustomVehicleCategoriesOnto(targetCar, sourceVehicles) {
    if (!targetCar) return 0
    if (!Array.isArray(targetCar.categories)) targetCar.categories = emptyVehicleCatalog()
    const present = {}
    targetCar.categories.forEach(function (cat) {
      if (!cat) return
      present[vehicleLabelKindKey(cat.label, vehicleCategoryKind(cat))] = true
    })
    const specs = []
    const seen = {}
    ;(sourceVehicles || []).forEach(function (car) {
      if (!car || car.id === targetCar.id) return
      ;(car.categories || []).forEach(function (cat) {
        if (!cat || vehicleCatalogAnnualItemId(cat.id)) return
        const kind = vehicleCategoryKind(cat)
        const key = vehicleLabelKindKey(cat.label, kind)
        if (present[key] || seen[key]) return
        seen[key] = true
        specs.push({
          label: cat.label,
          kind: kind,
          annualItemId: vehicleCategoryAnnualItemId(cat) || '',
        })
      })
    })
    specs.forEach(function (spec) {
      const id = nextVehicleCategoryId(targetCar)
      const annualItemId = spec.annualItemId || allocateVehicleAnnualItemId(id, spec.label, spec.kind, (sourceVehicles || []).concat([targetCar]))
      targetCar.categories.push({
        id: id,
        label: spec.label,
        kind: spec.kind,
        annualItemId: annualItemId,
        lifetimeBudget: 0,
        perYear: 0,
        actual: 0,
      })
      present[vehicleLabelKindKey(spec.label, spec.kind)] = true
    })
    return specs.length
  }

    if (raw == null) return
    const label = String(raw).replace(/\s+/g, ' ').trim()
    if (!label) {
      flash('車両名を入力してください。', 'warn')
      return
    }

    state.vehicles.forEach(function (car) {
      if (car.label === label) dup = true
    })
    if (dup) {
      flash('同じ車両名がすでにあります。', 'warn')
      return
    }
    const car = emptyVehicle(nextVehicleId(label), label)
    copyCustomVehicleCategoriesOnto(car, state.vehicles)
    state.vehicles.push(car)
    reconcileVehicleAnnualItemIds(state.vehicles)
    applyVehicleDerived(car)
    state.tabOrder = normalizeTabOrder((state.tabOrder || []).concat(['vehicles']), state.vehicles)
    applyGroupOrderFromTabs(state.tabOrder)
    view = 'vehicles'

  function applyVehiclesFromSheetSeed(options) {
    const opts = options || {}
    const seeded = seedVehicles()
    const seedById = {}
    seeded.forEach(function (car) { seedById[car.id] = car })
    if (opts.carId) {
      if (!seedById[opts.carId]) return false
      state.vehicles = (state.vehicles || []).map(function (car) {
        return car.id === opts.carId ? normalizeVehicle(seedById[opts.carId], seedById[opts.carId]) : car

  function nextEducationPersonId(label) {
    const base = String(label || 'person')
      .replace(/\s+/g, '')
      .replace(/[^a-zA-Z0-9\u3040-\u30ff\u4e00-\u9fff]/g, '')
      .slice(0, 12) || 'person'
    let id = 'edu-p-' + base
    let n = 1
    while (findEducationPerson(id)) {
      n += 1
      id = 'edu-p-' + base + '-' + n
    }
    return id
  }

  function nextEducationItemId(person, role) {
    const suffix = role === 'daily' ? 'daily' : 'purpose'
    let id = person.id + '-' + suffix
    let n = 1
    while (findEducationItem(person, id)) {
      n += 1
      id = person.id + '-' + suffix + '-' + n
    }
    return id
  }

  function seedEducationCatalogItemsForPerson(person, kind) {
    if (!person) return
    if (!Array.isArray(person.items)) person.items = []
    const resolvedKind = kind || educationPersonKind(person)
    const wantDaily = resolvedKind === 'child' || resolvedKind === 'both'
    const seenNames = {}
    person.items.forEach(function (item) {
      if (item && item.name) seenNames[item.name] = true
    })
    if (wantDaily) {
      const dailyName = educationDailyItemName(person)
      if (!seenNames[dailyName] && !findEducationDailyItem(person)) {
        person.items.push({
          id: person.id + '-daily',
          name: dailyName,
          role: 'daily',
          plan: 0,
          entries: [],
        })
        seenNames[dailyName] = true
      }
    }
    EDUCATION_CATALOG.forEach(function (cat) {
      if (!cat || !cat.name || isEducationDailyName(cat.name)) return
      if (seenNames[cat.name]) return
      person.items.push({
        id: person.id + '-' + cat.id,
        name: cat.name,
        role: 'purpose',
        plan: 0,
        entries: [],
      })
      seenNames[cat.name] = true
    })
  }

      '3',
    )
    if (raw == null) return null
    const t = String(raw).trim()
    if (t === '1' || t === '子' || t === 'child') return 'child'
    if (t === '2' || t === '孫' || t === 'grandchild') return 'grandchild'
    return 'both'
  }

    if (kind == null) return
    const id = nextEducationPersonId(label)
    const person = { id: id, label: label, kind: kind, items: [] }
    // v103: seed purpose from EDUCATION_CATALOG (plan 0); daily 雑費+label for child/both only
    seedEducationCatalogItemsForPerson(person, kind)
    state.education.people.push(person)
    if (kind === 'child' || kind === 'both') {
      let annualId = educationAnnualItemIdForPerson(person)

  function addEducationItem(personId) {
    const person = findEducationPerson(personId)
    if (!person || isSoftDeleted(person)) return
    const name = askLabel('「' + person.label + '」に追加する項目名を入力してください。', '')
    if (!name) return
    const typeRaw = window.prompt('種類を選んでください。\n1 = 日常\n2 = 目的別\n番号を入力（空は目的別）', '2')
    if (typeRaw == null) return
    const t = String(typeRaw).trim()
    const role = (t === '1' || t === '日常' || t === 'daily') ? 'daily' : 'purpose'
    if (role === 'daily' && findEducationDailyItem(person)) {
      flash('日常項目は1人につき1つです。既存の日常を直すか消してから追加してください。', 'warn')
      return
    }
    let nameTaken = false
    ;(person.items || []).forEach(function (row) { if (row && row.name === name) nameTaken = true })
    if (nameTaken) {
      flash('同じ名前の項目があります。', 'warn')
      return
    }
    if (!Array.isArray(person.items)) person.items = []
    const itemName = role === 'daily' ? educationDailyItemName(person) : name
    let clash = false
    ;(person.items || []).forEach(function (row) { if (row && row.name === itemName) clash = true })
    if (clash) {
      flash('同じ名前の項目があります。', 'warn')
      return
    }
    const item = {
      id: nextEducationItemId(person, role),
      name: itemName,
      role: role,
      plan: 0,
      entries: [],
    }
    if (role === 'daily') {
      let annualId = educationAnnualItemIdForPerson(person)
      if (!annualId) annualId = allocateEducationAnnualItemId(person.label)
      item.annualItemId = annualId
      person.items.unshift(item)
      ensureEducationPersonForAnnualDaily(annualId, person.label)
      const midLabel = educationDailyItemName(person)
      Object.keys(state.years || {}).forEach(function (key) {
        ensureEducationAnnualItemInData(state.years[key], annualId, midLabel, 'daily')
      })
      syncEducationItemToAnnual(annualId)
    } else {
      person.items.push(item)
      syncEducationPurposeToAnnual()
    }
    openPlanEditors.education = true
    persist()
    flash('「' + itemName + '」を追加しました。', 'ok')
    render()
  }

  function driveToken() {
    return new Promise(function (resolve, reject) {
      try {
        const tc = google.accounts.oauth2.initTokenClient({
          client_id: SHISHUTSU_GOOGLE_CLIENT_ID,
          scope: 'https://www.googleapis.com/auth/drive.file',
          callback: function (r) { if (r && r.access_token) resolve(r.access_token); else reject(new Error('token')) },
          error_callback: function () { reject(new Error('token')) },
        })
        tc.requestAccessToken({ prompt: '' })
      } catch (e) { reject(e) }
    })
  }
  async function driveGrokFolder(tk) {
    const q = encodeURIComponent("name='Grok' and mimeType='application/vnd.google-apps.folder' and trashed=false")
    const r = await fetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id%2Cname)&spaces=drive', { headers: { Authorization: 'Bearer ' + tk } })
    if (!r.ok) throw new Error('drive-list')
    const j = await r.json()
    if (j.files && j.files.length) return j.files[0].id
    const cr = await fetch('https://www.googleapis.com/drive/v3/files', { method: 'POST', headers: { Authorization: 'Bearer ' + tk, 'Content-Type': 'application/json' }, body: JSON.stringify({ name: 'Grok', mimeType: 'application/vnd.google-apps.folder' }) })
    if (!cr.ok) throw new Error('drive-folder')
    return (await cr.json()).id
  }
  async function saveDriveBackup() {
    if (typeof navigator !== 'undefined' && navigator.onLine === false) { flash('いまはオフラインのため、Googleドライブに保存できません。通信できる場所でもう一度試してください。', 'warn'); return }
    const text = JSON.stringify(exportObject(), null, 2) + '\n'
    const name = driveBackupFilename()
    flash('Googleドライブに保存しています…', 'ok')
    try {
      await loadGis()
      const tk = await driveToken()
      const fid = await driveGrokFolder(tk)
      const bd = 'shishutsu_' + Date.now()
      const meta = JSON.stringify({ name: name, parents: [fid], mimeType: 'application/json' })
      const body = '--' + bd + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + meta + '\r\n--' + bd + '\r\nContent-Type: application/json\r\n\r\n' + text + '\r\n--' + bd + '--'
      const r = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id%2Cname%2Cparents', { method: 'POST', headers: { Authorization: 'Bearer ' + tk, 'Content-Type': 'multipart/related; boundary=' + bd }, body: body })
      if (!r.ok) throw new Error('drive-upload')
      const j = await r.json()
      if (!j || !j.id) { flash('Googleドライブに保存しましたが、確認ができなかったため、古いバックアップは削除していません：' + name, 'warn'); return }
      let cleaned = 0, cleanErr = false
      try {
        const lq = encodeURIComponent("'" + fid + "' in parents and trashed=false")
        const lr = await fetch('https://www.googleapis.com/drive/v3/files?q=' + lq + '&orderBy=createdTime%20desc&fields=files(id%2Cname%2CcreatedTime)&spaces=drive', { headers: { Authorization: 'Bearer ' + tk } })
        if (!lr.ok) throw new Error('drive-clean-list')
        const lj = await lr.json()
        const olds = (lj.files || []).filter(function (f) { return /^shishutsu-backup-\d{8}\.json$/.test(f.name || '') }).slice(2)
        for (const f of olds) {
          const tr = await fetch('https://www.googleapis.com/drive/v3/files/' + f.id, { method: 'PATCH', headers: { Authorization: 'Bearer ' + tk, 'Content-Type': 'application/json' }, body: JSON.stringify({ trashed: true }) })
          if (tr.ok) cleaned++; else cleanErr = true
        }
      } catch (e) { cleanErr = true }
      flash('Googleドライブの「Grok」に保存しました：' + (j.name || name) + (cleaned > 0 ? '。古いバックアップを' + cleaned + '件ゴミ箱へ移しました。' : '') + (cleanErr ? '古いバックアップの整理はできませんでした。' : ''), 'ok')
    } catch (err) {
      flash('Googleドライブに保存できませんでした。通信状態やGoogleの許可を確認して、もう一度試してください。だめなときは「バックアップを保存」を使ってください。', 'warn')
    }
  }

  function restoreFromText(text) {
    const parsed = parseIncoming(text)
    if (!parsed.ok) {
      flash(
        parsed.reason === 'invalid-json'
          ? 'このファイルは読み取れませんでした。JSONを選んでください。'
          : 'このファイルは支出細目のバックアップではありません。',
        'warn',
      )
      return
    }
    const years = listYears(parsed.state).map(function (year) { return year + '年' }).join('・')
    const ok = window.confirm('今の支出細目を、このファイルで置き換えます。いま画面にある数字は消えます。よろしいですか？（' + years + '）')
    if (!ok) return
    state = parsed.state
    persist()
    flash('復元しました', 'ok')
    render()
  }

  function displayedAnnualTotal(data, ids) {
    let total = 0
    ;(ids || []).forEach(function (id) {
      if (isVehicleScheduleAnnualItem(id)) {
        const n = vehicleScheduleAnnualAmount(id)
        if (n != null) total += n
        return
      }
      total += sumItems(data, [id], MONTH_KEYS).budget
    })
    return total
  }

  function renderKpis(data) {
    const ids = allItemIds(data)
    const yearBudget = displayedAnnualTotal(data, ids)
    const kinds = annualKindIds(data)
    const daily = displayedAnnualTotal(data, kinds.daily)
    const saving = displayedAnnualTotal(data, kinds.saving)
    const groupCount = (data.groups || []).length
    const itemCount = ids.length
    const avg = ceilYen100(yearBudget / 12)
    return (
      '<dl class="kpis kpis-year">' +
        '<div class="kpi"><dt>年予算</dt><dd>' + formatYen(yearBudget) + '</dd></div>' +
        '<div class="kpi"><dt>月平均</dt><dd>' + formatYen(avg) + '</dd></div>' +
        '<div class="kpi"><dt>日常的な支出</dt><dd>' + formatYen(daily) + '</dd>' +
          '<p class="sub">月平均 ' + formatYen(ceilYen100(daily / 12)) + '</p></div>' +
        '<div class="kpi"><dt>目的別の貯金枠</dt><dd>' + formatYen(saving) + '</dd>' +
          '<p class="sub">月平均 ' + formatYen(ceilYen100(saving / 12)) + '</p></div>' +
        '<div class="kpi"><dt>グループ</dt><dd>' + groupCount + '</dd></div>' +
        '<div class="kpi"><dt>細目</dt><dd>' + itemCount + '</dd></div>' +
      '</dl>'
    )
  }

  const HOBBY_ANNUAL_NOZOMU_IDS = [
    'hobby-gaishoku-nozomu',
    'hobby-leisure-nozomu',
    'hobby-takeout-nozomu',
    'hobby-zakka-nozomu',
    'hobby-irui-nozomu',
    'hobby-biyou-nozomu',
    'hobby-subsc-nozomu',
  ]
  const HOBBY_ANNUAL_HARU_IDS = [
    'hobby-gaishoku-haru',
    'hobby-leisure-haru',
    'hobby-takeout-haru',
    'hobby-zakka-haru',
    'hobby-irui-haru',
    'hobby-biyou-haru',
    'hobby-subsc-haru',
  ]
  const HOBBY_ANNUAL_PERSON_OF = {}
  HOBBY_ANNUAL_NOZOMU_IDS.forEach(function (id) { HOBBY_ANNUAL_PERSON_OF[id] = 'nozomu' })
  HOBBY_ANNUAL_HARU_IDS.forEach(function (id) { HOBBY_ANNUAL_PERSON_OF[id] = 'haru' })

  // 年間予定 月平均. Every displayed annual 月平均 (rows, person parents,
  // section and group subtotals, and the year-page KPI) is ceilYen100:
  // round up to the next 100 yen. Exact multiples of 100 stay. 0 stays 0.
  // Hobby rows follow the category
  // payCycle: 年払い is year total / 12, 月払い is year total / elapsed
  // months (last dated non-zero month, min 1, current year capped at the
  // current month). ペット目的別 ignores payCycle and stays
  // ceilYen100(typed year total / 12).
  // Vehicle schedule stays /12. Housing, loans, education, social, and
  // 自動車目的別 stay on their previous path.
  // Tab 月平均 uses the same divisor with Math.round, not ceilYen100.
  const YEAR_ELAPSED_CORE_GROUPS = {}
  const YEAR_ELAPSED_OPTIONAL_GROUPS = {
    hobby: true, education: true, social: true,
  }

  function annualItemRef(data, itemId) {
    let found = null
    ;(data && data.groups ? data.groups : []).forEach(function (group) {
      if (found || !group) return
      ;(group.items || []).forEach(function (item) {
        if (!found && item && item.id === itemId) found = { group: group, item: item }
      })
    })
    return found
  }

  function yearKeyOfData(data) {
    if (state && state.years && data) {
      const keys = Object.keys(state.years)
      for (let i = 0; i < keys.length; i++) {
        if (state.years[keys[i]] === data) return Number(keys[i])
      }
    }
    return state && state.activeYear != null ? Number(state.activeYear) : NaN
  }

  function forEachLinkedDailyCategory(itemId, fn) {
    if (!itemId || !state) return
    ;['hobby'].forEach(function (tab) {
      const block = state[tab]
      const cats = block && block.categories
      if (!Array.isArray(cats)) return
      cats.forEach(function (cat) {
        if (!cat || isSoftDeleted(cat) || !cat.daily || cat.daily.annualItemId !== itemId) return
        fn(cat)
      })
    })
  }

  function datedSpendMonthsForItem(itemId, year) {
    const seen = {}
    forEachLinkedDailyCategory(itemId, function (cat) {
      ;(cat.entries || []).forEach(function (row) {
        if (!row || !entryMatchesYear(row, year)) return
        if (asFiniteNumber(row.amount) === 0) return
        const ym = normalizeYm(row.date != null ? row.date : row.ym)
        if (!ym) return
        const month = Number(ym.slice(5, 7))
        if (month >= 1 && month <= 12) seen[month] = true
      })
    })
    return Object.keys(seen).map(function (key) { return Number(key) }).sort(function (a, b) { return a - b })
  }

  function latestDatedSpendMonth(itemId, year) {
    const months = datedSpendMonthsForItem(itemId, year)
    return months.length ? months[months.length - 1] : 0
  }

  function sumLinkedYearEntries(itemId, year) {
    let sum = 0
    forEachLinkedDailyCategory(itemId, function (cat) {
      sum += sumEntriesForYear(cat.entries, year)
    })
    return sum
  }

  function lastNonZeroBudgetMonth(data, itemId) {
    let last = 0
    MONTH_KEYS.forEach(function (key, index) {
      if (asFiniteNumber(lineAt(data, key, itemId).budget) !== 0) last = index + 1
    })
    return last
  }

  // True when the 12 month cells are the screen-year actual sum spread evenly,
  // not a separate fixed annual plan.
  function rowMatchesActualSpread(data, itemId, year) {
    if (!isActualMonthAvgAnnualItem(itemId)) return false
    const spent = sumLinkedYearEntries(itemId, year)
    if (!(spent > 0)) return false
    const amounts = MONTH_KEYS.map(function (key) { return asFiniteNumber(lineAt(data, key, itemId).budget) })
    let total = 0
    let min = null
    let max = null
    amounts.forEach(function (n) {
      total += n
      if (min == null || n < min) min = n
      if (max == null || n > max) max = n
    })
    if (!(total > 0) || min == null) return false
    if (amounts.some(function (n) { return n === 0 })) return false
    if (max - min > 1) return false
    return Math.abs(total - spent) <= 12
  }

  function yearRowUsesElapsedMonths(data, itemId) {
    if (!itemId) return false
    if (isVehicleScheduleAnnualItem(itemId)) return false
    const ref = annualItemRef(data, itemId)
    if (ref && itemKind(ref.item) === 'saving') return false
    const groupId = ref && ref.group ? ref.group.id : ''
    const core = !!YEAR_ELAPSED_CORE_GROUPS[groupId]
    const optional = !!YEAR_ELAPSED_OPTIONAL_GROUPS[groupId]
    // Housing, loans, and other groups stay /12. 自動車 annual plans are
    // schedule or saving and already returned false above.
    if (!core && !optional && groupId !== 'auto') return false
    if (groupId === 'auto') return lastNonZeroBudgetMonth(data, itemId) > 0
    return lastNonZeroBudgetMonth(data, itemId) > 0
  }

  // Tab-linked annual rows. Annual 月平均 no longer branches on this;
  // every annual 月平均 uses ceilYen100. Tab 月平均 stays Math.round.
  function isTabRoundAnnualItem(itemId) {
    if (!itemId || !state) return false
    const tabs = ['hobby']
    for (let i = 0; i < tabs.length; i++) {
      const block = state[tabs[i]]
      const cats = block && block.categories
      if (!Array.isArray(cats)) continue
      for (let j = 0; j < cats.length; j++) {
        const cat = cats[j]
        if (cat && cat.daily && cat.daily.annualItemId === itemId) return true
      }
    }
    return false
  }

  function isOngoingMonthlyYearGroup(data, itemId) {
    const ref = annualItemRef(data, itemId)
    const groupId = ref && ref.group ? ref.group.id : ''
    return !!YEAR_ELAPSED_CORE_GROUPS[groupId] || !!YEAR_ELAPSED_OPTIONAL_GROUPS[groupId]
  }

  function elapsedMonthsForYearRow(data, itemId) {
    const year = yearKeyOfData(data)
    const ongoing = isOngoingMonthlyYearGroup(data, itemId)
    let last = 0
    // Core and optional rows use the last dated spend month even when the
    // 12 cells are a filled spread. Other rows still need that spread check.
    if (ongoing || rowMatchesActualSpread(data, itemId, year)) last = latestDatedSpendMonth(itemId, year)
    if (!(last > 0)) last = lastNonZeroBudgetMonth(data, itemId)
    const now = new Date()
    const currentMonth = now.getMonth() + 1
    if (Number(year) === now.getFullYear() && last > currentMonth && ongoing) {
      last = currentMonth
    }
    return last > 0 ? last : 1
  }

  function personBucketYearSum(cats, year) {
    let sum = 0
    ;(cats || []).forEach(function (cat) {
      sum += sumEntriesForYear(cat && cat.entries, year)
    })
    return sum
  }

  // Annual person-parent 月平均 (hobby 望/はる).
  // Parent is 年払い only when every included category is 年払い; otherwise 月払い (elapsed of the 月払い children).
  function personBucketMonthAvgAmount(cats, year) {
    const sum = personBucketYearSum(cats, year)
    if (bucketPayIsAnnual(cats)) return ceilYen100(asFiniteNumber(sum) / 12)
    return ceilYen100(asFiniteNumber(sum) / screenYearElapsedMonths(entriesFromCats(bucketMonthlyPayCats(cats)), year))
  }

  function isTypedPurposeAnnualItem(itemId) {
    return itemId === 'hobby-pet-saving'
  }

  function catsForAnnualPayCycle(itemId) {
    const out = []
    if (!itemId || !state || isTypedPurposeAnnualItem(itemId)) return out
    ;['hobby'].forEach(function (tab) {
      const cats = state[tab] && state[tab].categories
      if (!Array.isArray(cats)) return
      cats.forEach(function (cat) {
        if (!cat) return
        const dailyId = cat.daily && cat.daily.annualItemId
        const savingId = cat.saving && cat.saving.annualItemId
        if (dailyId === itemId || savingId === itemId) out.push(cat)
      })
    })
    return out
  }

  function yearItemMonthAvgText(data, itemId) {
    if (isTypedPurposeAnnualItem(itemId)) {
      const typed = sumItems(data, [itemId], MONTH_KEYS).budget
      return formatYen(ceilYen100(asFiniteNumber(typed) / 12))
    }
    if (isVehicleScheduleAnnualItem(itemId)) {
      const schedule = vehicleScheduleAnnualAmount(itemId)
      return schedule == null ? '—' : formatYen(ceilYen100(schedule / 12))
    }
    const total = sumItems(data, [itemId], MONTH_KEYS).budget
    const linked = catsForAnnualPayCycle(itemId)
    let denom
    if (linked.length) {
      denom = bucketPayIsAnnual(linked)
        ? 12
        : screenYearElapsedMonths(entriesFromCats(bucketMonthlyPayCats(linked)), yearKeyOfData(data))
    } else {
      denom = yearRowUsesElapsedMonths(data, itemId) ? elapsedMonthsForYearRow(data, itemId) : 12
    }
    return formatYen(ceilYen100(total / denom))
  }

  function yearIdsMonthAvgAmount(data, ids) {
    let lump = 0
    let monthly = 0
    ;(ids || []).forEach(function (id) {
      if (isVehicleScheduleAnnualItem(id)) {
        const n = vehicleScheduleAnnualAmount(id)
        if (n != null) lump += n
        return
      }
      if (isTypedPurposeAnnualItem(id)) {
        lump += sumItems(data, [id], MONTH_KEYS).budget
        return
      }
      const total = sumItems(data, [id], MONTH_KEYS).budget
      const linked = catsForAnnualPayCycle(id)
      if (linked.length) {
        if (bucketPayIsAnnual(linked)) lump += total
        else monthly += ceilYen100(total / screenYearElapsedMonths(entriesFromCats(bucketMonthlyPayCats(linked)), yearKeyOfData(data)))
        return
      }
      if (yearRowUsesElapsedMonths(data, id)) {
        const avg = total / elapsedMonthsForYearRow(data, id)
        monthly += ceilYen100(avg)
      } else lump += total
    })
    return ceilYen100(monthly + ceilYen100(lump / 12))
  }

  function yearItemRowHtml(data, group, item, child) {
    const scheduleRow = isVehicleScheduleAnnualItem(item.id)
    const schedule = scheduleRow ? vehicleScheduleAnnualAmount(item.id) : null
    const year = sumItems(data, [item.id], MONTH_KEYS)
    const avgText = yearItemMonthAvgText(data, item.id)
    const totalText = scheduleRow
      ? (schedule == null ? '—' : formatYen(schedule))
      : formatYen(year.budget)
    const totalEditable = yearSavingTotalEditable(item)
    const totalCell = totalEditable
      ? '<td class="year-summary"><input class="cell yen-amount" data-item="' + escapeHtml(item.id) +
          '" data-field="year-total" inputmode="numeric" aria-label="' + escapeHtml(item.label + ' 合計') +
          '" value="' + escapeHtml(yenAmountDisplay(year.budget)) + '"></td>'
      : '<td class="year-summary">' + totalText + '</td>'
    return (
      '<tr><td' + (child ? ' class="hobby-child-name"' : '') + '><div class="name-cell">' + itemNameHtml(group, item) + '</div></td>' +
        '<td class="year-summary">' + avgText + '</td>' +
        totalCell + '</tr>'
    )
  }

  function yearTotalCellsHtml(data, ids, avgAmount) {
    const total = displayedAnnualTotal(data, ids)
    const avg = avgAmount == null ? yearIdsMonthAvgAmount(data, ids) : avgAmount
    return (
      '<td class="year-summary">' + formatYen(avg) + '</td>' +
      '<td class="year-summary">' + formatYen(total) + '</td>'
    )
  }

  // Catalog person lines, plus a custom daily annual id whose category sits
  // in the same tab person bucket. Those lines are not drawn; the parent is.
  function hobbyAnnualItemCollapsedPerson(itemId) {
    if (!itemId) return ''
    if (HOBBY_ANNUAL_PERSON_OF[itemId]) return HOBBY_ANNUAL_PERSON_OF[itemId]
    const cats = state && state.hobby && Array.isArray(state.hobby.categories) ? state.hobby.categories : []
    let person = ''
    cats.forEach(function (cat) {
      if (person || !cat || !cat.daily || cat.daily.annualItemId !== itemId) return
      const group = hobbyDisplayBucket(cat).group
      if (group === 'nozomu' || group === 'haru') person = group
    })
    return person
  }

  function yearBucketParentRowHtml(data, label, cats) {
    if (!cats || !cats.length) return ''
    const year = yearKeyOfData(data)
    return (
      '<tr class="hobby-group-parent">' +
        '<td><div class="name-cell"><span class="name-hit">' + escapeHtml(label) + '</span></div></td>' +
        '<td class="year-summary">' + formatYen(personBucketMonthAvgAmount(cats, year)) + '</td>' +
        '<td class="year-summary">' + formatYen(personBucketYearSum(cats, year)) + '</td>' +
      '</tr>'
    )
  }

  function yearSectionHtml(data, group, items, sectionLabel, subtotalLabel, opts) {
    if (!items.length) return ''
    const hobbyPersonParents = !!(opts && opts.hobbyPersonParents)
    const nozomuCats = hobbyPersonParents ? hobbyPersonBucketCats('nozomu') : []
    const haruCats = hobbyPersonParents ? hobbyPersonBucketCats('haru') : []
    let nozomuDone = false
    let haruDone = false
    const rows = items.map(function (item) {
      let parent = ''
      const person = hobbyPersonParents ? hobbyAnnualItemCollapsedPerson(item.id) : ''
      if (person === 'nozomu' && !nozomuDone) {
        parent = yearBucketParentRowHtml(data, '望', nozomuCats)
        nozomuDone = true
      } else if (person === 'haru' && !haruDone) {
        parent = yearBucketParentRowHtml(data, 'はる', haruCats)
        haruDone = true
      }
      if (person) return parent
      return yearItemRowHtml(data, group, item, false)
    }).join('')
    let lead = ''
    if (hobbyPersonParents && !nozomuDone) lead += yearBucketParentRowHtml(data, '望', nozomuCats)
    if (hobbyPersonParents && !haruDone) lead += yearBucketParentRowHtml(data, 'はる', haruCats)
    const ids = items.map(function (item) { return item.id })
    return (
      '<tr class="year-section"><td>' + escapeHtml(sectionLabel) + '</td><td colspan="2"></td></tr>' +
      lead + rows +
      '<tr class="year-subtotal"><td>' + escapeHtml(subtotalLabel) + '</td>' + yearTotalCellsHtml(data, ids) + '</tr>'
    )
  }

  function renderYearGrid(data) {
    data.groups = orderAnnualGroupsByLabel(data.groups)
    const hobbyDailyDisplayOrder = [
      'hobby-gaishoku-nozomu',
      'hobby-leisure-nozomu',
      'hobby-takeout-nozomu',
      'hobby-zakka-nozomu',
      'hobby-irui-nozomu',
      'hobby-biyou-nozomu',
      'hobby-subsc-nozomu',
      'hobby-gaishoku-haru',
      'hobby-leisure-haru',
      'hobby-takeout-haru',
      'hobby-zakka-haru',
      'hobby-irui-haru',
      'hobby-biyou-haru',
      'hobby-subsc-haru',
      'hobby-travel',
      'hobby-family',
      'hobby-pet',
    ]
    return data.groups.map(function (group) {
      const ids = groupItemIds(group)
      let itemsForSplit = group.items
      if (group.id === 'hobby') {
        const rank = {}
        hobbyDailyDisplayOrder.forEach(function (id, index) { rank[id] = index })
        const daily = []
        const saving = []
        ;(group.items || []).forEach(function (item, index) {
          if (itemKind(item) === 'saving') saving.push({ item: item, index: index })
          else daily.push({ item: item, index: index })
        })
        daily.sort(function (a, b) {
          const ra = Object.prototype.hasOwnProperty.call(rank, a.item.id) ? rank[a.item.id] : hobbyDailyDisplayOrder.length
          const rb = Object.prototype.hasOwnProperty.call(rank, b.item.id) ? rank[b.item.id] : hobbyDailyDisplayOrder.length
          if (ra !== rb) return ra - rb
          return a.index - b.index
        })
        itemsForSplit = daily.map(function (row) { return row.item }).concat(
          saving.map(function (row) { return row.item })
        )
      }
      const split = splitAnnualGroupItems(itemsForSplit)
      const body =
        yearSectionHtml(data, group, split.daily, '日常的な支出', '日常計', group.id === 'hobby' ? { hobbyPersonParents: true } : null) +
        yearSectionHtml(data, group, split.saving, '目的別の貯金枠', '貯金枠計')
      const empty = body
        ? body
        : '<tr><td colspan="3">細目はまだありません。下から追加できます。</td></tr>'
      return (
        '<section>' +

    const n = asFiniteNumber(value)

      maximumFractionDigits: digits == null ? 2 : digits,
      minimumFractionDigits: 0,
    }).format(n)
  }


  function categoryOptionsHtml(car, selected) {
    const cats = car && Array.isArray(car.categories) && car.categories.length ? car.categories : VEHICLE_CATALOG

    let html = cats.map(function (row) {
      return '<option value="' + escapeHtml(row.label) + '"' + (row.label === selected ? ' selected' : '') + '>' + escapeHtml(row.label) + '</option>'
    }).join('')
    if (selected && labels.indexOf(selected) < 0) {
      html += '<option value="' + escapeHtml(selected) + '" selected>' + escapeHtml(selected) + '</option>'
    }

  }

  }

  function listUnifiedVehicleCategoryRows() {
    const rows = []
    const seen = {}
    VEHICLE_CATALOG.forEach(function (def) {
      const links = []
      ;(state.vehicles || []).forEach(function (car) {
        const cat = findVehicleCategory(car, def.id)
        if (cat) links.push({ car: car, cat: cat })
      })
      if (!links.length) return
      const key = 'catalog:' + def.id
      seen[key] = true
      rows.push({
        key: key,
        catalog: true,
        catId: def.id,
        label: links[0].cat.label,
        kind: vehicleCategoryKind(links[0].cat),
        links: links,
      })
    })
    ;(state.vehicles || []).forEach(function (car) {
      ;(car.categories || []).forEach(function (cat) {
        if (!cat || vehicleCatalogAnnualItemId(cat.id)) return
        const annualId = vehicleCategoryAnnualItemId(cat) || ('local:' + car.id + ':' + cat.id)
        const key = 'custom:' + annualId
        if (seen[key]) {
          let row = null
          rows.forEach(function (r) { if (r.key === key) row = r })
          if (row) row.links.push({ car: car, cat: cat })
          return
        }
        seen[key] = true
        rows.push({
          key: key,
          catalog: false,
          catId: cat.id,
          label: cat.label,
          kind: vehicleCategoryKind(cat),
          annualItemId: annualId,
          links: [{ car: car, cat: cat }],
        })
      })
    })
    return rows
  }

  function removeUnifiedVehicleCategory(rowKey) {
    const rows = listUnifiedVehicleCategoryRows()
    let row = null
    rows.forEach(function (r) { if (r.key === rowKey) row = r })
    if (!row || !row.links.length) return
    const names = row.links.map(function (link) { return link.car.label }).join('・')
    const ok = window.confirm(
      '大項目「' + row.label + '」を ' + names + ' から削除します。明細は「その他」に付け替えます。他の車両にも同じ区分が無ければ年間細目も消えます。よろしいですか？'
    )
    if (!ok) return
    // remove without nested confirms: call core path once per link by temporarily skipping confirm
    row.links.forEach(function (link) {
      removeVehicleCategoryQuiet(link.car.id, link.cat.id)
    })
    render()
  }

  function removeVehicleCategoryQuiet(carId, catId) {
    const car = findVehicle(carId)
    if (!car) return
    const cat = findVehicleCategory(car, catId)
    if (!cat) return
    if (!Array.isArray(car.categories) || car.categories.length <= 1) return
    if (cat.id === 'other') return
    const other = findVehicleCategory(car, 'other')
    const otherLabel = other && other.label ? other.label : 'その他'
    const annualItemId = vehicleCategoryAnnualItemId(cat)
    const oldLabel = cat.label
    car.categories = car.categories.filter(function (row) { return row.id !== catId })
    ;(car.items || []).forEach(function (item) {
      if (item && item.category === oldLabel) item.category = otherLabel
    })
    applyVehicleDerived(car)
    syncVehiclesToAnnual()
    if (annualItemId) pruneOrphanVehicleAnnualItem(annualItemId)
    persist()
  }

  function educationHeadlineRows() {
    return [
      { key: 'daily', label: '日常的' },
      { key: 'saving', label: '目的別' },
      { key: 'total', label: '計' },
    ]
  }

  function educationPersonHeadlineTotals(person, groups) {
    const packs = educationPersonGroupTotals(person, groups)
    const empty = { plan: 0, spent: 0, remain: 0 }
    let daily = empty
    let saving = empty
    packs.forEach(function (pack) {
      const row = { plan: pack.plan, spent: pack.spent, remain: pack.remain }
      if (pack.id === 'daily') daily = row
      if (pack.id === 'saving') saving = row
    })
    return {
      daily: daily,
      saving: saving,
      total: {
        plan: daily.plan + saving.plan,
        spent: daily.spent + saving.spent,
        remain: daily.plan + saving.plan - (daily.spent + saving.spent),
      },
    }
  }

  function renderEducationHeadlineKpis(totals, years) {
    const dailySplit = educationSplitAmount(totals.daily.plan, years)
    const savingSplit = educationSplitAmount(totals.saving.plan, years)
    const totalSplit = educationSplitAmount(totals.total.plan, years)
    const remainOver = totals.total.remain < 0
    function money(label, amount, sub, ddClass, sub2) {
      return (
        '<div class="kpi"><dt>' + escapeHtml(label) + '</dt>' +
          '<dd' + (ddClass ? ' class="' + ddClass + '"' : '') + '>' + formatYen(amount) + '</dd>' +
          (sub ? '<p class="sub">' + sub + '</p>' : '') +
          (sub2 ? '<p class="sub">' + sub2 + '</p>' : '') +
        '</div>'
      )
    }
    // v17: 残りの月平均＝残り÷計画終了までの月数（全体の目安と同じ計算、100円切上げ）
    const remainMonths = overallMonthsUntilEnd(state.education && state.education.end, housingMonthsTo100(ensureHousingState()))
    const remainMonthly = remainMonths > 0 ? ceilYen100(Math.max(0, asFiniteNumber(totals.total.remain)) / remainMonths) : 0
    const remainLine = '残りの月平均 ' + formatYen(remainMonthly) + '（' + remainMonths + 'か月）'
    return (
      money('日常的', totals.daily.plan, '年 ' + formatYen(dailySplit.year) + ' · 月 ' + formatYen(dailySplit.month)) +
      money('目的別', totals.saving.plan, '年 ' + formatYen(savingSplit.year) + ' · 月 ' + formatYen(savingSplit.month)) +
      money('計', totals.total.plan, '年 ' + formatYen(totalSplit.year) + ' · 月 ' + formatYen(totalSplit.month), '', remainLine) +
      money('実績', totals.total.spent) +
      money('残り', totals.total.remain, '', remainOver ? 'over' : 'remain-ok')
    )
  }

  function renderEducationHeadlineTable(totals, years, mode) {
    const rows = educationHeadlineRows().map(function (row) {
      return { key: row.key, label: row.label, pack: totals[row.key] }
    })
    const showPlan = mode === 'plan' || mode === 'full'
    const showActual = mode === 'actual' || mode === 'full'
    const head =
      '<th>区分</th>' +
      (showPlan ? '<th>計画</th><th>年</th><th>月</th>' : '') +
      (showActual ? '<th>実績</th><th>残り</th>' : '')
    const body = rows.map(function (row) {
      const split = educationSplitAmount(row.pack.plan, years)
      const remainOver = row.pack.remain < 0
      return (
        '<tr' + (row.key === 'total' ? ' class="edu-subtotal"' : '') + '>' +
          '<td>' + escapeHtml(row.label) + '</td>' +
          (showPlan
            ? '<td>' + formatYen(row.pack.plan) + '</td><td>' + formatYen(split.year) + '</td><td>' + formatYen(split.month) + '</td>'
            : '') +
          (showActual
            ? '<td>' + formatYen(row.pack.spent) + '</td><td class="' + (remainOver ? 'over' : 'remain-ok') + '">' + formatYen(row.pack.remain) + '</td>'

          '<summary><span class="when-closed">計画を編集する</span><span class="when-open">閉じる</span></summary>' +
          '<div class="plan-grid">' +
            educationFieldHtml('start', '開始日', data.start, { type: 'date' }) +

      el.style.setProperty('--special-hist-w', el.clientWidth + 'px')
