    <style>
      :root {
        --paper: #f3efe6;
        --paper-2: #ebe4d6;
        --card: #fffdf8;
        --ink: #1c1917;
        --muted: #6f675c;
        --line: #e4ddd0;
        --forest: #1f5c45;
        --forest-2: #2d6a4f;
        --forest-soft: #e7f1eb;
        --gold: #9a6700;
        --gold-soft: #f8eed8;
        --over: #b42318;
        --over-soft: #fde8e6;
        --shadow: 0 1px 0 rgba(28, 25, 23, 0.04);
        --sans: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", YuGothic, Meiryo,
          "Noto Sans JP", ui-sans-serif, system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; overflow-x: hidden; }
      body {
        margin: 0;
        min-height: 100svh;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--sans);
        font-feature-settings: "palt" 0;
        -webkit-text-size-adjust: 100%;
      }
      button, input, select { font: inherit; color: inherit; }
      button { cursor: pointer; }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 20;
        border-bottom: 1px solid color-mix(in oklab, var(--line) 80%, transparent);
        background: color-mix(in oklab, var(--paper) 90%, transparent);
        backdrop-filter: blur(12px);
      }
      .wrap {
        max-width: 72rem;
        margin: 0 auto;
        padding-left: 1rem;
        padding-right: 1rem;
      }
      .head-row {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        justify-content: flex-start;
        gap: 0.75rem;
        padding: 0.65rem 0 0.5rem;
      }
      .brand {
        display: flex;
        min-width: 0;
        flex-direction: column;
        gap: 0.35rem;
      }
      .kicker {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 500;
        letter-spacing: 0.18em;
        color: var(--forest);
      }
      .kicker-sub {
        margin: 0;
        font-size: 11px;
        font-weight: 500;
        color: var(--muted);
      }
      .app-switch {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        margin-left: auto;
        padding-top: 0.35rem;
        font-size: 11px;
        font-weight: 500;
      }
      .app-switch a {
        color: var(--forest);
        text-decoration: none;
        opacity: 0.85;
      }
      .app-switch a:hover,
      .app-switch a:focus-visible {
        text-decoration: underline;
        opacity: 1;
      }
      .app-switch span {
        color: var(--muted);
        opacity: 0.7;
      }
      h1 {
        margin: 0;
        font-size: 1.15rem;
        line-height: 1.25;
        font-weight: 600;
      }
      .muted { color: var(--muted); }
      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-start;
        gap: 0.5rem;
      }
      select.year-select {
        height: 2rem;
        min-width: 4.75rem;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--card);
        padding: 0 0.75rem;
        font-size: 13px;
        font-weight: 600;
      }
      .btn.add-year {
        height: 2rem;
        padding: 0 0.65rem;
        font-size: 12px;
        font-weight: 600;
      }
      select.year-select:focus-visible,
      .btn:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--forest);
        outline-offset: 2px;
      }
      .views {
        display: flex;
        gap: 0.25rem;
        overflow-x: auto;
        padding: 0 0 0.65rem;
        scrollbar-width: none;
      }
      .views::-webkit-scrollbar { display: none; }
      .backup-tools {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.35rem;
        padding: 0 0 0.6rem;
      }
      .backup-tools-label {
        margin-right: 0.1rem;
        font-size: 11px;
        color: var(--muted);
      }
      .backup-tools .btn {
        height: 1.75rem;
        padding: 0 0.6rem;
        font-size: 12px;
      }
      @media (max-width: 39.99rem) {
        .backup-tools { flex-wrap: nowrap; gap: 0.4rem; }
        .backup-tools .btn { flex: 1 1 0; min-width: 0; height: 2.25rem; padding: 0 0.3rem; font-size: 12px; white-space: nowrap; }
      }
      .chip {
        flex-shrink: 0;
        border: 0;
        border-radius: 999px;
        padding: 0.25rem 0.75rem;
        font-size: 13px;
        color: var(--muted);
        background: transparent;
      }
      .chip:hover { background: var(--paper-2); color: var(--ink); }
      .chip.is-on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); font-weight: 600; }
      .chip.add {
        border: 1px dashed color-mix(in oklab, var(--forest) 45%, var(--line));
        color: var(--forest);
        background: color-mix(in oklab, var(--forest-soft) 70%, transparent);
      }
      .chip.add:hover { background: var(--forest-soft); color: var(--forest); }
      .chip.is-movable {
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      .chip.is-hold,
      .chip.is-dragging {
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      .chip.is-hold {
        transform: scale(1.07);
        color: var(--ink);
        background: var(--card);
        box-shadow: 0 0 0 2px color-mix(in oklab, var(--forest) 45%, transparent);
      }
      .chip.is-dragging { opacity: 0.28; }
      .chip.is-drop-before { box-shadow: inset 3px 0 0 var(--forest); }
      .chip-ghost {
        position: fixed;
        z-index: 40;
        pointer-events: none;
        margin: 0;
        opacity: 0.92;
        transform: scale(1.06);
        box-shadow: 0 8px 22px rgba(28, 25, 23, 0.16);
      }
      main { padding: 1.25rem 0 max(4rem, env(safe-area-inset-bottom)); }
      .stack { display: flex; flex-direction: column; gap: 1rem; }
      .banner {
        border-radius: 0.75rem;
        padding: 0.5rem 1rem;
        font-size: 13px;
      }
      .banner.warn { background: var(--gold-soft); color: var(--gold); }
      .banner.note { background: var(--paper-2); color: var(--muted); }
      .banner.ok { background: var(--forest-soft); color: var(--forest); }
      .banner.error { background: var(--over-soft); color: var(--over); font-weight: 600; }
      .install-hint {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 0.75rem;
      }
      .install-hint span { min-width: 0; }
      .install-hint .btn { flex-shrink: 0; height: 1.75rem; }
      .card {
        background: var(--card);
        border-radius: 1rem;
        padding: 1rem;
        box-shadow: var(--shadow);
      }
      @media (min-width: 40rem) { .card { padding: 1.25rem; } }
      .card h2 { margin: 0; font-size: 0.875rem; font-weight: 600; }
      .hint { margin: 0.2rem 0 0; font-size: 12px; color: var(--muted); }
      .kpis {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
      }
      @media (min-width: 40rem) { .kpis { grid-template-columns: repeat(4, 1fr); } }
      @media (min-width: 70rem) { .kpis.kpis-year { grid-template-columns: repeat(6, 1fr); } }
      @media (min-width: 40rem) { .kpis.kpis-hobby { grid-template-columns: repeat(3, 1fr); } }
      .kpi {
        border-radius: 0.75rem;
        background: color-mix(in oklab, var(--paper-2) 80%, transparent);
        padding: 0.5rem 0.75rem;
      }
      .kpi dt { margin: 0; font-size: 11px; color: var(--muted); }
      .kpi dd { margin: 0.15rem 0 0; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
      .kpi .sub { margin: 0.15rem 0 0; font-size: 11px; color: var(--muted); }

  var ZERO_PREF_KEY = 'shishutsu-ui-show-zero'
  function zeroPrefOn() { try { return localStorage.getItem(ZERO_PREF_KEY) === '1' } catch (e) { return false } }
  function applyZeroPref() { document.documentElement.classList.toggle('show-zero', zeroPrefOn()) }
  function zeroToggleHtml() {
    return '<label class="zero-toggle"><input type="checkbox" data-zero-toggle' + (zeroPrefOn() ? ' checked' : '') + '> 0円の項目も表示</label>'
  }
  applyZeroPref()
  document.addEventListener('change', function (ev) {
    var t = ev.target
    if (!t || !t.matches || !t.matches('input[data-zero-toggle]')) return
    ev.stopPropagation()
    try { localStorage.setItem(ZERO_PREF_KEY, t.checked ? '1' : '0') } catch (e) {}
    applyZeroPref()
    document.querySelectorAll('input[data-zero-toggle]').forEach(function (el) { el.checked = t.checked })
  }, true);

  function hobbyPersonLabel(person) {
    return HOBBY_PERSON_LABEL[person] || ''
  }

  function hobbyCanonicalFullLabel(base, person) {
    const mid = String(base || '').trim()
    const p = hobbyPersonLabel(person)
    if (!mid || !p) return mid
    // Takeout haru: MF mid is space form「テイクアウト はる」(no parens). Nozomu keeps parens.
    if (mid === 'テイクアウト' && person === 'haru') return 'テイクアウト はる'
    return mid + '(' + p + ')'
  }

  function hobbySplitDisplayLabel(midLabel, person) {
    const mid = String(midLabel || '').trim()
    if (!person) return mid
    const p = hobbyPersonLabel(person)
    if (!p) return mid
    // Already canonical full forms
    if (mid === 'テイクアウト はる' && person === 'haru') return mid
    if (/\((望|はる|春美)\)$/.test(mid)) return mid
    return hobbyCanonicalFullLabel(mid, person)
  }

  const yenFmt = new Intl.NumberFormat('ja-JP', { style: 'currency', currency: 'JPY', maximumFractionDigits: 0 })

  function formatYen(value) {
    const n = Number(value) || 0
    const abs = yenFmt.format(Math.abs(Math.round(n)))
    return n < 0 ? '−' + abs : abs
  }

  function parseYenInput(raw) {
    const normalized = String(raw).replace(/[¥￥,\s]/g, '').replace('−', '-').replace('ー', '-')
    if (normalized === '' || normalized === '-') return 0
    const n = Number(normalized)
    return Number.isFinite(n) ? Math.round(n) : 0
  }

  function yenAmountDisplay(value) {
    if (value === '' || value == null) return ''
    return formatYen(value)
  }

  function bindYenAmountInputs(root) {
    const scope = root || document
    scope.querySelectorAll('input.yen-amount').forEach(function (input) {
      if (input.dataset.yenBound === '1') return
      input.dataset.yenBound = '1'
      input.addEventListener('focus', function () {
        if (input.readOnly || input.disabled) return
        const raw = String(input.value || '').trim()
        if (raw === '') {
          input.value = ''
          return
        }
        input.value = String(parseYenInput(raw))
        try { input.select() } catch (err) {}
      })
      input.addEventListener('blur', function () {
        const raw = String(input.value || '').trim()
        if (raw === '') {
          input.value = ''
          return
        }
        input.value = formatYen(parseYenInput(raw))
      })
    })
  }

  function asFiniteNumber(value) {
    if (typeof value === 'number' && Number.isFinite(value)) return value
    if (typeof value === 'string' && value.trim() !== '') {
      const n = Number(value)
      if (Number.isFinite(n)) return n
      return parseYenInput(value)
    }
    return 0
  }

  function ceilYen100(n) {
    const v = asFiniteNumber(n)
    if (!(v > 0)) return 0
    return Math.ceil(v / 100) * 100
  }

  function parseUsageInput(raw) {
    if (raw == null) return null
    const s = String(raw).trim().replace(/,/g, '')
    if (s === '' || s === '-') return null
    const n = Number(s)
    return Number.isFinite(n) ? n : null
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
  }

  function cloneGroups(groups) {
    const source = Array.isArray(groups) && groups.length ? groups : GROUPS
    return source.map(function (group) {
      return {
        id: group.id,
        label: group.label,
        items: (group.items || []).map(function (item) {
          return { id: item.id, label: item.label, kind: itemKind(item) }
        }),
      }
    })
  }

  function listItemIds(groups) {
    const ids = []
    cloneGroups(groups).forEach(function (group) {
      group.items.forEach(function (item) { ids.push(item.id) })
    })
    return ids
  }

  function emptyLine() { return { budget: 0, actual: 0 } }

  function emptyYear(groups, budgets) {
    const cloned = cloneGroups(groups)
    const ids = listItemIds(cloned)
    const months = {}
    MONTH_KEYS.forEach(function (mm, index) {
      const lines = {}
      ids.forEach(function (id) {
        lines[id] = {
          budget: budgets && budgets[id] ? asFiniteNumber(budgets[id][index]) : 0,
          actual: 0,
        }
      })
      months[mm] = lines
    })
    return { groups: cloned, months: months }
  }

  function seedYear2026() {
    return emptyYear(GROUPS, BUDGET_2026)
  }

  function cloneJson(value) {
    return JSON.parse(JSON.stringify(value))
  }

  function seedVehicles() {
    // Vehicle tab is lifetime (all entry years). Do not drop pre-SEED_YEAR rows.
    return cloneJson(VEHICLE_SEED).map(function (car) {
      return applyVehicleDerived(normalizeVehicle(car, car))
    })
  }

  function nextVehicleItemId(car) {
    let max = 0
    ;(car.items || []).forEach(function (item) {
      const match = String(item.id || '').match(/item-(\d+)$/)
      if (match) max = Math.max(max, Number(match[1]))
    })
    return car.id + '-item-' + (max + 1)
  }

  function emptyVehicleCatalog() {
    return VEHICLE_CATALOG.map(function (row) {
      return {
        id: row.id,
        label: row.label,
        kind: row.kind === 'saving' ? 'saving' : 'daily',
        lifetimeBudget: 0,
        perYear: 0,
        actual: 0,
      }
    })
  }

  function emptyVehicle(id, label) {
    return {
      id: id,
      label: label,
      plate: '',
      planYears: 0,
      start: '',
      end: '',
      budgetTotal: 0,
      spentTotal: 0,
      budgetPerYear: 0,
      elapsedYears: null,
      mfImport: true,
      categories: emptyVehicleCatalog(),
      items: [],
    }
  }

  function normalizeYm(raw) {
    const text = String(raw == null ? '' : raw).trim()
    const match = text.match(/^(\d{4})[-/.年]?(\d{1,2})$/)
    if (!match) return ''
    const month = Number(match[2])
    if (month < 1 || month > 12) return ''
    return match[1] + '-' + String(month).padStart(2, '0')
  }

  function currentYm() {
    const now = new Date()
    const calY = now.getFullYear()
    const calM = String(now.getMonth() + 1).padStart(2, '0')
    const active = state && state.activeYear != null ? Number(state.activeYear) : calY
    if (Number.isFinite(active) && active === calY) return active + '-' + calM
    if (Number.isFinite(active)) return active + '-01'
    return calY + '-' + calM
  }

  function normalizeMemo(raw) {
    return String(raw == null ? '' : raw).replace(/\s+/g, ' ').trim()
  }

  function normalizeEntries(raw) {
    if (!Array.isArray(raw)) return []
    const out = []
    raw.forEach(function (row) {
      if (!row || typeof row !== 'object') return
      const date = normalizeYm(row.date)
      if (!date) return
      const entry = {
        date: date,
        amount: asFiniteNumber(row.amount),
        memo: normalizeMemo(row.memo),
      }
      const usage = parseUsageInput(row.usage)
      if (usage != null) entry.usage = usage
      const unitPrice = parseUsageInput(row.unitPrice)
      if (unitPrice != null) entry.unitPrice = unitPrice
      out.push(entry)
    })
    out.sort(function (a, b) {
      if (a.date < b.date) return -1
      if (a.date > b.date) return 1
      return 0
    })
    return out
  }


  function entryYearPrefix(row) {
    const raw = row && (row.date != null ? row.date : row.ym)
    const ym = normalizeYm(raw)
    if (ym) return ym.slice(0, 4)
    const text = String(raw == null ? '' : raw).trim()
    const yOnly = text.match(/^(\d{4})(?:\s*年)?$/)
    return yOnly ? yOnly[1] : ''
  }

  function entryYearNum(row) {
    const prefix = entryYearPrefix(row)
    if (!prefix) return null
    const y = Number(prefix)
    return Number.isFinite(y) ? y : null
  }

  /** Keep entries whose YYYY (from date/ym) is >= minYear. Used at seed apply time. */
  function filterEntriesToYearFrom(entries, minYear) {
    const min = asFiniteNumber(minYear)
    if (!Array.isArray(entries)) return []
    if (!Number.isFinite(min)) return entries.slice()
    return entries.filter(function (row) {
      const y = entryYearNum(row)
      return y != null && y >= min
    })
  }

  function filterYmRowsToYearFrom(rows, minYear, ymKey) {
    const min = asFiniteNumber(minYear)
    const key = ymKey || 'ym'
    if (!Array.isArray(rows)) return []
    if (!Number.isFinite(min)) return rows.slice()
    return rows.filter(function (row) {
      const raw = row && row[key]
      const ym = normalizeYm(raw) || (String(raw || '').match(/^(\d{4})/) ? String(raw).slice(0, 4) + '-01' : '')
      if (!ym) return false
      const y = Number(ym.slice(0, 4))
      return Number.isFinite(y) && y >= min
    })
  }

  function filterYearKeyedMapFrom(map, minYear) {
    const min = asFiniteNumber(minYear)
    const out = {}
    if (!map || typeof map !== 'object' || Array.isArray(map)) return out
    Object.keys(map).forEach(function (key) {
      const y = Number(String(key).trim())
      if (!Number.isFinite(y)) return
      if (Number.isFinite(min) && y < min) return
      out[String(key).trim()] = map[key]
    })
    return out
  }

  function activeYearPrefix(year) {
    const y = year != null ? year : (state && state.activeYear)
    return String(y != null ? y : SEED_YEAR)
  }

  function entryMatchesYear(row, year) {
    const prefix = activeYearPrefix(year)
    return entryYearPrefix(row) === prefix
  }

  function entriesForYear(entries, year) {
    if (!Array.isArray(entries)) return []
    const prefix = activeYearPrefix(year)
    return entries.filter(function (row) { return entryYearPrefix(row) === prefix })
  }

  /** Preserve original indices for edit/delete handlers. */
  function entriesWithIndexForYear(entries, year) {
    const out = []
    if (!Array.isArray(entries)) return out
    const prefix = activeYearPrefix(year)
    entries.forEach(function (row, index) {
      if (entryYearPrefix(row) === prefix) out.push({ row: row, index: index })
    })
    return out
  }

  function sumEntriesForYear(entries, year) {
    let sum = 0
    entriesForYear(entries, year).forEach(function (row) {
      sum += asFiniteNumber(row.amount)
    })
    return sum
  }

  // Saving-only tab rows still use screen-year actual sum / 12, Math.round.
  // Monthly-pay annual rows do not. Sum 0 displays 0 yen.
  function screenYearActualMonthAvg(sum) {
    return Math.round(asFiniteNumber(sum) / 12)
  }

  function screenYearActualMonthAvgText(sum) {
    return formatYen(screenYearActualMonthAvg(sum))
  }

  // Tab 月平均. Math.round, not ceilYen100. 年払い uses /12. 月払い uses elapsed
  // months: last month with a dated non-zero spend in the screen year, minimum 1.
  // The current calendar year is capped at the current month. Same divisor as
  // the annual row for that category. Annual 月平均 stays ceilYen100.
  function screenYearElapsedMonths(entries, year) {
    const y = year != null ? year : (state && state.activeYear)
    let last = 0
    ;(Array.isArray(entries) ? entries : []).forEach(function (row) {
      if (!row || !entryMatchesYear(row, y)) return
      if (asFiniteNumber(row.amount) === 0) return
      const ym = normalizeYm(row.date != null ? row.date : row.ym)
      if (!ym) return
      const month = Number(ym.slice(5, 7))
      if (month >= 1 && month <= 12 && month > last) last = month
    })
    const now = new Date()
    if (Number(y) === now.getFullYear() && last > now.getMonth() + 1) last = now.getMonth() + 1
    return last > 0 ? last : 1
  }

  function screenYearElapsedMonthAvgText(sum, entries, year) {
    return formatYen(Math.round(asFiniteNumber(sum) / screenYearElapsedMonths(entries, year)))
  }

  function isSavingOnlyCategory(cat) {
    return !!(cat && cat.saving && !cat.daily)
  }

  function entriesFromCats(cats) {
    const out = []
    ;(cats || []).forEach(function (cat) {
      if (!cat || !Array.isArray(cat.entries)) return
      cat.entries.forEach(function (row) { out.push(row) })
    })
    return out
  }

  function payCycleDefault(tab) {

    return 'monthly'
  }

  function payCycleFromRaw(raw, tab) {
    const value = raw && raw.payCycle
    if (value === 'annual' || value === 'monthly') return value
    return payCycleDefault(tab)
  }

  function payCycleTabOf(cat) {
    if (!cat || !state) return ''
    const tabs = ['hobby']
    for (let i = 0; i < tabs.length; i++) {
      const cats = state[tabs[i]] && state[tabs[i]].categories
      if (!Array.isArray(cats)) continue
      for (let j = 0; j < cats.length; j++) {
        if (cats[j] === cat) return tabs[i]
      }
    }
    return ''
  }

  function categoryPayCycle(cat) {

    return payCycleDefault(payCycleTabOf(cat))
  }

  // Parent is 年払い only when every included category is 年払い; otherwise 月払い (elapsed of the 月払い children).
  function bucketPayIsAnnual(cats) {
    const list = (cats || []).filter(function (cat) { return !!cat })
    if (!list.length) return true
    for (let i = 0; i < list.length; i++) {
      if (categoryPayCycle(list[i]) !== 'annual') return false
    }
    return true
  }

  function bucketMonthlyPayCats(cats) {
    return (cats || []).filter(function (cat) {
      return cat && categoryPayCycle(cat) !== 'annual'
    })
  }

  function payCycleSelectHtml(tab, cat) {
    const cycle = categoryPayCycle(cat)
    return (
      '<label class="pay-cycle">' +
        '<select data-pay-cycle-tab="' + escapeHtml(tab) + '" data-pay-cycle-cat="' + escapeHtml(cat.id) + '" aria-label="年払いまたは月払い">' +
          '<option value="annual"' + (cycle === 'annual' ? ' selected' : '') + '>年払い</option>' +
          '<option value="monthly"' + (cycle === 'monthly' ? ' selected' : '') + '>月払い</option>' +
        '</select>' +
      '</label>'
    )
  }

  function setCategoryPayCycle(tab, catId, value) {
    const next = value === 'annual' ? 'annual' : (value === 'monthly' ? 'monthly' : '')
    if (!next || !state || !state[tab] || !Array.isArray(state[tab].categories)) return
    let cat = null
    state[tab].categories.forEach(function (row) {
      if (row && row.id === catId) cat = row
    })
    if (!cat || cat.payCycle === next) return
    cat.payCycle = next
    persist()
  }

  function tabActualMonthAvgText(cat, sum) {
    if (categoryPayCycle(cat) === 'annual') return formatYen(Math.round(asFiniteNumber(sum) / 12))
    return screenYearElapsedMonthAvgText(sum, cat && cat.entries)
  }

  function tabCatsMonthAvgText(cats, sum) {
    if (bucketPayIsAnnual(cats)) return formatYen(Math.round(asFiniteNumber(sum) / 12))
    const year = state && state.activeYear
    return formatYen(Math.round(asFiniteNumber(sum) / screenYearElapsedMonths(entriesFromCats(bucketMonthlyPayCats(cats)), year)))
  }

  // Daily annual items that skip ceilYen100.
  // hobby stores the paid month's actual, not sum/12. A linked id still skips ceilYen100.
  function isActualMonthAvgAnnualItem(itemId) {
    if (!itemId || !state) return false
    const tabs = ['hobby']
    for (let i = 0; i < tabs.length; i++) {
      const block = state[tabs[i]]
      const cats = block && block.categories
      if (!Array.isArray(cats)) continue
      for (let j = 0; j < cats.length; j++) {
        const cat = cats[j]
        if (cat && cat.daily && cat.daily.annualItemId === itemId) return true
      }
    }
    return false
  }

  // Month budgets for a monthly-pay annual row: each screen-year actual in the
  // month it was paid. Other months are 0. Does not spread sum/12 and does not
  // ceilYen100. A zero year sum still clears stored months so 合計 is not the
  // old monthly budget × 12. Returns true only when a month changed.
  function monthBudgetsFromEntries(entries, year) {
    const amounts = {}
    MONTH_KEYS.forEach(function (mm) { amounts[mm] = 0 })
    ;(Array.isArray(entries) ? entries : []).forEach(function (row) {
      if (!row || !entryMatchesYear(row, year)) return
      const ym = normalizeYm(row.date != null ? row.date : row.ym)
      if (!ym) return
      const mm = ym.slice(5, 7)
      if (!Object.prototype.hasOwnProperty.call(amounts, mm)) return
      amounts[mm] += asFiniteNumber(row.amount)
    })
    MONTH_KEYS.forEach(function (mm) { amounts[mm] = Math.round(amounts[mm]) })
    return amounts
  }

  function writeDailyAnnualMonthsFromEntries(data, itemId, entries, year) {
    // ペット目的別 is typed on 年間予定. Never overwrite it from tab actuals.
    if (itemId === 'hobby-pet-saving') return false
    if (!data || !itemId || !yearHasItem(data, itemId)) return false
    const amounts = monthBudgetsFromEntries(entries, year)
    let changed = false
    if (!data.months) changed = true
    MONTH_KEYS.forEach(function (mm) {
      const current = data.months && data.months[mm] && data.months[mm][itemId]
      const budget = current ? asFiniteNumber(current.budget) : 0
      if (budget !== amounts[mm]) changed = true
    })
    if (!changed) return false
    if (!data.months) data.months = {}
    MONTH_KEYS.forEach(function (mm) {
      if (!data.months[mm]) data.months[mm] = {}
      const current = data.months[mm][itemId] || { budget: 0, actual: 0 }
      data.months[mm][itemId] = {
        budget: amounts[mm],
        actual: asFiniteNumber(current.actual),
      }
    })
    return true
  }

  function sumEntriesBeforeYear(entries, year) {
    const yLimit = asFiniteNumber(year)
    let sum = 0
    ;(entries || []).forEach(function (row) {
      const y = entryYearNum(row)
      if (y == null || !Number.isFinite(yLimit) || y >= yLimit) return
      sum += asFiniteNumber(row.amount)
    })
    return sum
  }

  const PURPOSE_CARRY_MEMO = '繰越'

  function isPurposeCarryRow(row) {
    return normalizeMemo(row && row.memo) === PURPOSE_CARRY_MEMO
  }

  /** All vehicle entries except synthetic Y-01「繰越」. Indices stay aligned with the stored array. */
  function vehicleEntriesWithIndexAll(entries) {
    const out = []
    if (!Array.isArray(entries)) return out
    entries.forEach(function (row, index) {
      if (isPurposeCarryRow(row)) return
      out.push({ row: row, index: index })
    })
    return out
  }

  /** Lifetime spent for one vehicle item. Ignores memo「繰越」 so prior years are not double-counted. */
  function vehicleItemSpentAll(item) {
    if (!item) return 0
    if (Array.isArray(item.entries) && item.entries.length) {
      let sum = 0
      item.entries.forEach(function (row) {
        if (isPurposeCarryRow(row)) return
        sum += asFiniteNumber(row.amount)
      })
      return sum
    }
    return asFiniteNumber(item.total)
  }

  function hasPurposeCarryForYear(entries, year) {
    const ym = activeYearPrefix(year) + '-01'
    return (entries || []).some(function (row) {
      return normalizeYm(row && row.date) === ym && normalizeMemo(row && row.memo) === PURPOSE_CARRY_MEMO
    })
  }

  /** Add Y-01 memo「繰越」= sum of prior years' spent, if missing and prior > 0. */
  function ensurePurposeCarryEntry(entries, year) {
    const list = Array.isArray(entries) ? entries : []
    const y = asFiniteNumber(year)
    if (!Number.isFinite(y)) return list
    if (hasPurposeCarryForYear(list, y)) return list
    const prior = sumEntriesBeforeYear(list, y)
    if (!(prior > 0)) return list
    list.push({
      date: String(y) + '-01',
      amount: Math.round(prior),
      memo: PURPOSE_CARRY_MEMO,
    })
    return normalizeEntries(list)
  }

  function uniqueYmCountForYear(entries, year) {
    const seen = {}
    entriesForYear(entries, year).forEach(function (row) {
      const ym = normalizeYm(row && row.date)
      if (ym) seen[ym] = true
    })
    return Object.keys(seen).length
  }


  function parseIsoDate(raw) {
    const text = String(raw == null ? '' : raw).trim()
    const match = text.match(/^(\d{4})-(\d{2})-(\d{2})$/)
    if (!match) return null
    const y = Number(match[1])
    const m = Number(match[2])
    const d = Number(match[3])
    if (m < 1 || m > 12 || d < 1 || d > 31) return null
    const dt = new Date(y, m - 1, d)
    if (dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return null
    return { y: y, m: m, d: d }
  }

  function isoDateValue(raw) {
    const parsed = parseIsoDate(raw)
    return parsed ? parsed.y * 10000 + parsed.m * 100 + parsed.d : null
  }

  function daysInCalendarMonth(year, month) {
    return new Date(Number(year), Number(month), 0).getDate()
  }

  function dateInWindow(year, month, day, startRaw, endRaw) {
    const value = Number(year) * 10000 + Number(month) * 100 + Number(day)
    const start = isoDateValue(startRaw)
    const end = isoDateValue(endRaw)
    if (start != null && value < start) return false
    if (end != null && value > end) return false
    return true
  }

  function yearOverlapsWindow(year, startRaw, endRaw) {
    const yearStart = Number(year) * 10000 + 101
    const yearEnd = Number(year) * 10000 + 1231
    const start = isoDateValue(startRaw)
    const end = isoDateValue(endRaw)
    if (start != null && yearEnd < start) return false
    if (end != null && yearStart > end) return false
    return true
  }

  function periodActiveFraction(year, month, startRaw, endRaw) {
    const dim = daysInCalendarMonth(year, month)
    if (dim < 1) return 0
    let n = 0
    for (let day = 1; day <= dim; day++) {
      if (dateInWindow(year, month, day, startRaw, endRaw)) n += 1
    }
    return n / dim
  }

  function vehicleActiveFraction(car, year, month) {
    if (!car) return 0
    return periodActiveFraction(year, month, car.start, car.end)
  }

  function splitYearAcrossMonths(yearAmount) {
    const amount = Math.round(asFiniteNumber(yearAmount))
    const months = {}
    const base = Math.trunc(amount / 12)
    const rem = amount - base * 12
    MONTH_KEYS.forEach(function (mm, index) {
      months[mm] = index === 11 ? base + rem : base
    })
    return months
  }

  function applyItemDerived(item) {
    if (!item) return
    if (item.entries && item.entries.length) {
      let total = 0
      let count = 0
      item.entries.forEach(function (row) {
        if (isPurposeCarryRow(row)) return
        total += asFiniteNumber(row.amount)
        count += 1
      })
      item.total = Math.round(total)
      item.count = count
      item.avg = item.count ? item.total / item.count : 0
      return
    }
    if (!Array.isArray(item.entries)) item.entries = []
    item.avg = item.count ? item.total / item.count : 0
  }

  function spentFromVehicleItems(items) {
    let sum = 0
    ;(items || []).forEach(function (item) {
      sum += vehicleItemSpentAll(item)
    })
    return sum
  }

  function vehicleItemSpentForYear(item, year) {
    if (!item) return 0
    if (Array.isArray(item.entries) && item.entries.length) {
      return sumEntriesForYear(item.entries, year)
    }
    return 0
  }

  function spentFromVehicleItemsForYear(items, year) {
    let sum = 0
    ;(items || []).forEach(function (item) {
      sum += vehicleItemSpentForYear(item, year)
    })
    return sum
  }

  function sumLifetimeBudgets(categories) {
    let sum = 0
    ;(categories || []).forEach(function (cat) {
      sum += asFiniteNumber(cat && cat.lifetimeBudget)
    })
    return sum
  }

  function categoryActualFromItems(items, label) {
    let sum = 0
    ;(items || []).forEach(function (item) {
      if (item && item.category === label) sum += vehicleItemSpentAll(item)
    })
    return sum
  }

  function categoryActualFromItemsForYear(items, label, year) {
    let sum = 0
    ;(items || []).forEach(function (item) {
      if (item && item.category === label) sum += vehicleItemSpentForYear(item, year)
    })
    return sum
  }

  function normalizePlate(raw) {
    return String(raw == null ? '' : raw).replace(/\s+/g, ' ').trim()
  }

  function applyVehicleDerived(car) {
    if (!car) return car
    const planYears = asFiniteNumber(car.planYears)
    ;(car.categories || []).forEach(function (cat) {
      cat.lifetimeBudget = Math.round(asFiniteNumber(cat.lifetimeBudget))
      cat.actual = categoryActualFromItems(car.items, cat.label)
      cat.perYear = planYears > 0 ? cat.lifetimeBudget / planYears : 0

    car.budgetTotal = sumLifetimeBudgets(car.categories)
    car.spentTotal = spentFromVehicleItems(car.items)
    car.budgetPerYear = planYears > 0 ? car.budgetTotal / planYears : 0
    return car
  }

  function normalizeVehicleItem(carId, item, index) {
    if (!item || typeof item !== 'object') return null
    const name = typeof item.name === 'string' ? item.name.trim() : ''
    if (!name) return null
    if (name === '計' || name === 'ガソリン') return null
    const category = typeof item.category === 'string' && item.category ? item.category : 'その他'
    const entries = normalizeEntries(item.entries).filter(function (row) {
      return !isPurposeCarryRow(row)
    })
    let total = asFiniteNumber(item.total)
    let count = asFiniteNumber(item.count)
    let avg = 'avg' in item && item.avg != null ? asFiniteNumber(item.avg) : (count ? total / count : 0)
    if (entries.length) {
      total = 0
      entries.forEach(function (row) { total += asFiniteNumber(row.amount) })
      total = Math.round(total)
      count = entries.length
      avg = count ? total / count : 0
    }
    const id = typeof item.id === 'string' && item.id ? item.id : carId + '-item-' + index
    return { id: id, name: name, category: category, total: total, avg: avg, count: count, entries: entries }
  }

  function normalizeVehicle(raw, fallback) {
    const base = fallback || emptyVehicle('car', '車両')
    const src = raw && typeof raw === 'object' ? raw : {}
    const id = typeof src.id === 'string' && src.id ? src.id : base.id
    const label = typeof src.label === 'string' && src.label ? src.label : base.label
    const plate = normalizePlate('plate' in src ? src.plate : base.plate)
    const planYears = 'planYears' in src ? asFiniteNumber(src.planYears) : asFiniteNumber(base.planYears)
    let start = typeof src.start === 'string' ? src.start : (base.start || '')
    let end = ''
    if ('end' in src) {
      end = typeof src.end === 'string' ? src.end : ''
    } else if (base && typeof base.end === 'string') {
      end = base.end
    }
    if (id === 'sienta' && start === '2026-10-03') start = '2026-10-07'
    let mfImport = true
    if ('mfImport' in src) {
      mfImport = src.mfImport !== false
    } else if (base && 'mfImport' in base) {
      mfImport = base.mfImport !== false
    }
    const itemsSrc = Array.isArray(src.items) ? src.items : (base.items || [])
    const items = []
    itemsSrc.forEach(function (item, index) {
      const normalized = normalizeVehicleItem(id, item, index)

    } else if ('elapsedYears' in base) {

    }

    const catalogIds = {}
    VEHICLE_CATALOG.forEach(function (def) { catalogIds[def.id] = true })
    const categories = VEHICLE_CATALOG.map(function (def) {
      let found = null
      catsSrc.forEach(function (row) {
        if (row && row.id === def.id) found = row
      })
      if (!found) {
        catsSrc.forEach(function (row) {
          if (row && row.label === def.label) found = row
        })
      }
      let fb = null
      ;(base.categories || []).forEach(function (row) {
        if (row && row.id === def.id) fb = row
      })
      const catLabel = found && typeof found.label === 'string' && found.label.trim()
        ? found.label.trim()
        : def.label
      const lifetimeBudget = found && 'lifetimeBudget' in found
        ? asFiniteNumber(found.lifetimeBudget)
        : (fb ? asFiniteNumber(fb.lifetimeBudget) : 0)
      return {
        id: def.id,
        label: catLabel,
        kind: def.kind === 'saving' ? 'saving' : 'daily',
        lifetimeBudget: lifetimeBudget,
        perYear: 0,
        actual: 0,
        annualItemId: vehicleCatalogAnnualItemId(def.id),
      }
    })
    const seenCatIds = {}
    categories.forEach(function (cat) { seenCatIds[cat.id] = true })
    catsSrc.forEach(function (row) {
      if (!row || typeof row !== 'object') return
      const id = typeof row.id === 'string' ? row.id.trim() : ''
      if (!id || catalogIds[id] || seenCatIds[id]) return
      const catLabel = typeof row.label === 'string' && row.label.trim() ? row.label.trim() : id
      const kind = row.kind === 'saving' ? 'saving' : 'daily'
      const annualItemId = typeof row.annualItemId === 'string' && row.annualItemId.trim()
        ? row.annualItemId.trim()
        : ''
      const custom = {
        id: id,
        label: catLabel,
        kind: kind,
        lifetimeBudget: asFiniteNumber(row.lifetimeBudget),
        perYear: 0,
        actual: 0,
      }
      if (annualItemId) custom.annualItemId = annualItemId
      categories.push(custom)
      seenCatIds[id] = true
    })
    return applyVehicleDerived(migrateVehicleLabelsInCar({
      id: id,
      label: label,
      plate: plate,
      planYears: planYears,
      start: start,
      end: end,
      budgetTotal: 0,
      spentTotal: 0,
      budgetPerYear: 0,
      elapsedYears: elapsedYears,
      mfImport: mfImport,
      categories: categories,
      items: items,
    }))
  }

  function normalizeVehicles(raw) {
    const seeded = seedVehicles()
    if (!Array.isArray(raw)) {
      const seededOut = seeded.map(function (car) { return normalizeVehicle(car, car) })
      reconcileVehicleAnnualItemIds(seededOut)
      return seededOut
    }
    const seedById = {}
    seeded.forEach(function (car) { seedById[car.id] = car })
    const out = []
    const seen = {}
    raw.forEach(function (car) {
      if (!car || typeof car !== 'object') return
      const id = typeof car.id === 'string' && car.id ? car.id : ''

      const sharedBase = HOBBY_SHARED_DISPLAY.indexOf(base)

  function sortHobbyCategoriesForDisplay(cats) {
    const groupRank = { nozomu: 0, haru: 1, shared: 2, custom: 3 }
    const indexed = (cats || []).map(function (cat, index) { return { cat: cat, index: index } })
    indexed.sort(function (a, b) {
      const ba = hobbyDisplayBucket(a.cat)
      const bb = hobbyDisplayBucket(b.cat)
      const ra = groupRank[ba.group]
      const rb = groupRank[bb.group]
      if (ra !== rb) return ra - rb
      if (ba.group !== 'custom' && ba.order !== bb.order) return ba.order - bb.order
      if (ba.group === 'custom') return a.index - b.index
      const fa = hobbyMidLabelOf(a.cat)
      const fb = hobbyMidLabelOf(b.cat)
      if (fa === fb) return a.index - b.index
      return fa < fb ? -1 : 1

      data.months[mm][itemId] = {
        budget: amount,
        actual: asFiniteNumber(current.actual),
      }
    })
  }

  function ensureAnnualHobbyItemAllYears(itemId, label, kind, monthlyPlan) {
    Object.keys(state.years || {}).forEach(function (key) {
      ensureAnnualHobbyItemInData(state.years[key], itemId, label, kind, monthlyPlan)
    })
  }

  function allocateHobbyAnnualItemId(catId, planKind) {
    const used = {}
    Object.keys(state.years || {}).forEach(function (key) {
      const data = state.years[key]
      listItemIds(data && data.groups ? data.groups : []).forEach(function (id) { used[id] = true })
    })
    const cats = state.hobby && state.hobby.categories ? state.hobby.categories : []
    cats.forEach(function (cat) {
      if (cat && cat.daily && cat.daily.annualItemId) used[cat.daily.annualItemId] = true
      if (cat && cat.saving && cat.saving.annualItemId) used[cat.saving.annualItemId] = true
    })
    const base = 'hobby-' + String(catId || 'custom').replace(/^hobby-cat-/, 'custom-')
    let id = planKind === 'saving' ? base + '-saving' : base
    if (!used[id]) return id
    let n = 2
    while (used[id + '-' + n]) n += 1
    return id + '-' + n
  }

  function syncHobbyLabelsToAnnual(cat) {
    if (!cat || hobbyAnnualSyncing) return
    hobbyAnnualSyncing = true
    try {
      if (cat.daily && cat.daily.annualItemId) {
        setAnnualItemLabelAllYears(cat.daily.annualItemId, cat.label)
      }
      if (cat.saving && cat.saving.annualItemId) {
        setAnnualItemLabelAllYears(cat.saving.annualItemId, hobbyPurposeLabel(cat.label))
      }
    } finally {
      hobbyAnnualSyncing = false
    }
  }

  function syncHobbyPlanToAnnual(cat, planKind) {
    // v118: 月計画 no longer writes hobby annual budgets. Labels still follow the category name.
    void planKind
    if (!cat || hobbyAnnualSyncing) return
    syncHobbyLabelsToAnnual(cat)
  }

  function hobbyAnnualMonthsMatchAmount(data, itemId, amount) {
    return MONTH_KEYS.every(function (mm) {
      return asFiniteNumber(lineAt(data, mm, itemId).budget) === amount
    })
  }

  // Active-year hobby annual months = the actual in the month it was paid.
  // Daily item only (ペット目的別 is not written). A zero sum clears the months.
  // Returns true only when stored months changed.
  function syncHobbyActualsToAnnual(year) {
    if (hobbyAnnualSyncing) return false
    const y = year != null ? year : (state && state.activeYear)
    const data = state.years && state.years[String(y)]
    if (!data) return false
    const cats = state.hobby && Array.isArray(state.hobby.categories) ? state.hobby.categories : []
    let changed = false
    hobbyAnnualSyncing = true
    try {
      cats.forEach(function (cat) {
        if (!cat || isSoftDeleted(cat)) return
        if (!cat.daily || !cat.daily.annualItemId) return
        if (cat.daily.annualItemId === 'hobby-pet-saving') return
        if (writeDailyAnnualMonthsFromEntries(data, cat.daily.annualItemId, cat.entries, y)) changed = true
      })
    } finally {
      hobbyAnnualSyncing = false
    }
    return changed
  }

  function syncHobbyToAnnual() {
    return syncHobbyActualsToAnnual(state && state.activeYear)
  }

  function averageAnnualMonthBudgets(data, itemId) {
    let sum = 0
    MONTH_KEYS.forEach(function (mm) {
      sum += asFiniteNumber(lineAt(data, mm, itemId).budget)
    })
    return Math.round(sum / 12)
  }

  function syncAnnualBudgetsToHobby(annualItemId) {
    // v43: hobby → annual is one-way; annual edits do not write back
    void annualItemId
  }

  function syncAnnualLabelToHobby(itemId, nextLabel) {
    // v43: hobby → annual is one-way; annual renames do not write back
    void itemId
    void nextLabel
  }

  function fillHobbyLinkedIfEmpty(data, year) {
    // v118: do not copy 月計画 into annual. Only actual averages, and only when that year has them.
    void data
    syncHobbyActualsToAnnual(year)
  }

  function cascadeRemoveHobbyHalf(cat, planKind) {
    if (!cat) return
    if (planKind === 'saving') {
      if (cat.saving && cat.saving.annualItemId) removeAnnualItemAllYears(cat.saving.annualItemId)
      cat.saving = null
    } else {
      if (cat.daily && cat.daily.annualItemId) removeAnnualItemAllYears(cat.daily.annualItemId)
      cat.daily = null
    }
  }

  function clearHobbyAnnualLinks(cat) {
    if (!cat) return
    if (cat.daily && cat.daily.annualItemId) {
      removeAnnualItemAllYears(cat.daily.annualItemId)
      cat.daily.annualItemId = ''
    }
    if (cat.saving && cat.saving.annualItemId) {
      removeAnnualItemAllYears(cat.saving.annualItemId)
      cat.saving.annualItemId = ''
    }
  }

  function softDeleteHobbyCategory(cat) {
    if (!cat || isSoftDeleted(cat)) return
    clearHobbyAnnualLinks(cat)
    if (cat.daily) cat.daily.monthlyPlan = 0
    if (cat.saving) cat.saving.monthlyPlan = 0
    cat.deleted = true
  }

  function hardDeleteHobbyCategory(cat) {
    if (!cat) return
    clearHobbyAnnualLinks(cat)
    if (state.hobby && Array.isArray(state.hobby.categories)) {
      state.hobby.categories = state.hobby.categories.filter(function (row) {
        return !(row && row.id === cat.id)
      })
    }
  }

  function cascadeRemoveHobbyCategory(cat) {
    hardDeleteHobbyCategory(cat)
  }

  function pruneEmptyHobbyCategory(cat) {
    if (!cat) return
    if (!cat.daily && !cat.saving) {
      if (Array.isArray(cat.entries) && cat.entries.length) {
        softDeleteHobbyCategory(cat)
        return
      }
      if (state.hobby && Array.isArray(state.hobby.categories)) {
        state.hobby.categories = state.hobby.categories.filter(function (row) {
          return !(row && row.id === cat.id)
        })

    }

  function setHobbyMonthlyPlan(catId, planKind, value) {
    const cat = findHobbyCategory(catId)
    if (!cat || isSoftDeleted(cat)) return
    const kind = planKind === 'saving' ? 'saving' : 'daily'
    if (kind === 'saving' && !cat.saving) return
    if (kind === 'daily' && !cat.daily) {
      cat.daily = hobbyPlanLine({ monthlyPlan: 0 }, { defaultMonthly: 0, annualItemId: '' })
    }
    const line = kind === 'saving' ? cat.saving : cat.daily
    const def = HOBBY_CATALOG.filter(function (row) { return row.id === catId })[0]
    const defLine = def ? def[kind] : null
    if (value === '' || value == null) {
      line.monthlyPlan = defLine ? defLine.defaultMonthly : 0
    } else {
      line.monthlyPlan = Math.round(asFiniteNumber(value))
    }

  function setHobbyCategoryLabel(catId, value) {
    const cat = findHobbyCategory(catId)
    if (!cat || isSoftDeleted(cat)) return
    const label = String(value == null ? '' : value).trim()
    if (!label) {
      flash('中項目名を入れてください。', 'warn')
      return
    }
    // One name → one mid; MF matches this full name. Optional (望)/(はる) in the name.
    const parsed = parseHobbySplitLabel(label)
    const full = parsed ? parsed.fullLabel : label
    cat.label = full
    cat.midLabel = full
    if (parsed) {
      cat.person = parsed.person
      cat.personSplit = true

      cat.personSplit = false

  function addHobbyCategory(label, withSaving) {
    const raw = String(label == null ? '' : label).trim()
    if (!raw) {
      flash('中項目名を入れてください。', 'warn')
      return false
    }
    if (!state.hobby) state.hobby = seedHobby()
    if (!Array.isArray(state.hobby.categories)) state.hobby.categories = []
    const parsed = parseHobbySplitLabel(raw)
    const name = parsed ? parsed.fullLabel : raw
    const person = parsed ? parsed.person : null
    const midTaken = state.hobby.categories.some(function (cat) {
      if (!cat || isSoftDeleted(cat)) return false
      return hobbyMidLabelOf(cat) === name || stripSoftDeletedSuffix(cat.label || '') === name
    })
    if (midTaken) {
      flash('同じ中項目があります。', 'warn')
      return false
    }
    const stamp = Date.now()
    const id = 'hobby-cat-' + stamp
    const dailyId = allocateHobbyAnnualItemId(id, 'daily')
    const savingId = withSaving ? allocateHobbyAnnualItemId(id, 'saving') : ''
    const cat = {
      id: id,
      label: name,
      midLabel: name,
      person: person,
      personSplit: !!person,
      payCycle: payCycleDefault('hobby'),
      daily: hobbyPlanLine({ monthlyPlan: 0, annualItemId: dailyId }, { defaultMonthly: 0, annualItemId: dailyId }),
      saving: withSaving
        ? hobbyPlanLine({ monthlyPlan: 0, annualItemId: savingId }, { defaultMonthly: 0, annualItemId: savingId })
        : null,
      entries: [],
    }
    state.hobby.categories.push(cat)
    ensureAnnualHobbyItemAllYears(dailyId, name, 'daily', 0)
    if (withSaving && savingId) {
      ensureAnnualHobbyItemAllYears(savingId, hobbyPurposeLabel(name), 'saving', 0)
    }
    persist()
    flash('「' + name + '」を追加しました。', 'ok')
    return true
  }

  function removeHobbyCategory(catId, choice) {
    if (!state.hobby || !Array.isArray(state.hobby.categories)) return
    const cat = findHobbyCategory(catId)
    if (!cat) return
    if (isSoftDeleted(cat)) return
    if (hobbyCatHasDualPlans(cat)) {
      if (!choice) {
        openHobbyDeleteId = catId
        return
      }
      openHobbyDeleteId = null
      if (choice === 'daily') {
        cascadeRemoveHobbyHalf(cat, 'daily')
        if (!cat.daily && !cat.saving) pruneEmptyHobbyCategory(cat)
        persist()
        flash('日常の計画を外しました（記録は残します）。', 'ok')
        return
      }
      if (choice === 'saving') {
        cascadeRemoveHobbyHalf(cat, 'saving')
        if (!cat.daily && !cat.saving) pruneEmptyHobbyCategory(cat)
        persist()
        flash('目的別の計画を外しました（記録は残します）。', 'ok')
        return
      }
      if (choice !== 'both') return
      const okBoth = window.confirm(
        '「' + cat.label + '」を削除します。計画と年間同期は外し、年月の記録は「' +
          cat.label + SOFT_DELETED_SUFFIX + '」として残します。よろしいですか？',
      )
      if (!okBoth) {
        openHobbyDeleteId = catId
        return
      }
      softDeleteHobbyCategory(cat)
      persist()
      flash('「' + entityDisplayLabel(cat) + '」にしました。記録は残しています。', 'ok')
      return
    }
    const ok = window.confirm(
      '「' + cat.label + '」を削除します。計画と年間同期は外し、年月の記録は「' +
        cat.label + SOFT_DELETED_SUFFIX + '」として残します。よろしいですか？',
    )
    if (!ok) return
    softDeleteHobbyCategory(cat)
    persist()
    flash('「' + entityDisplayLabel(cat) + '」にしました。記録は残しています。', 'ok')
  }

  function hardRemoveHobbyCategory(catId) {
    const cat = findHobbyCategory(catId)
    if (!cat) return
    const name = entityDisplayLabel(cat)
    const ok = window.confirm(
      '「' + name + '」の記録も完全に消えます。よろしいですか？',
    )
    if (!ok) return
    hardDeleteHobbyCategory(cat)
    persist()

  function addHobbyEntry(catId, date, amount, memo) {
    const cat = findHobbyCategory(catId)

    const ym = normalizeYm(date)
    if (!ym) {

    if (!Array.isArray(cat.entries)) cat.entries = []
    cat.entries.push({

    })
    cat.entries = normalizeEntries(cat.entries)

      if (!ym) {

        return

      cat.entries[index].date = ym
      cat.entries = normalizeEntries(cat.entries)
    } else if (field === 'amount') {

    } else if (field === 'memo') {

    }

  function renderHobbyPlan(hobby) {
    // Write each screen-year actual into the month it was paid.
    if (syncHobbyActualsToAnnual(state && state.activeYear)) persist()
    const data = hobby && Array.isArray(hobby.categories) ? hobby : seedHobby()
    const cats = sortHobbyCategoriesForDisplay(data.categories || []).filter(function (cat) {
      return !isHobbyPurposeTabRow(cat)
    })
    let spentTotal = 0
    cats.forEach(function (cat) {
      spentTotal += hobbyCategorySpent(cat)
    })
    // v16: 月平均はタブ内すべて「実績÷画面の年の経過月数（今年は1月〜今月、過去年は12）、100円切上げ」に統一
    const avgMonths = hobbyTabAvgMonths()
    const nozomuStats = hobbyPersonSpentStats(cats, 'nozomu')
    const haruStats = hobbyPersonSpentStats(cats, 'haru')
    const spentKpiSub = '<p class="sub">月平均 ' + hobbyTabMonthAvgText(spentTotal) + '（' + avgMonths + 'か月で割り）</p>'
    const nozomuKpiSub = '<p class="sub">月平均 ' + hobbyTabMonthAvgText(nozomuStats.spent) + '（' + avgMonths + 'か月で割り）</p>'
    const haruKpiSub = '<p class="sub">月平均 ' + hobbyTabMonthAvgText(haruStats.spent) + '（' + avgMonths + 'か月で割り）</p>'
    const nozomuCats = []
    const haruCats = []
    const sharedCats = []
    const customCats = []
    cats.forEach(function (cat) {
      const bucket = hobbyDisplayBucket(cat)
      if (bucket.group === 'nozomu') nozomuCats.push(cat)
      else if (bucket.group === 'haru') haruCats.push(cat)
      else if (bucket.group === 'shared') sharedCats.push(cat)
      else customCats.push(cat)
    })
    function hobbyChildRows(list) {
      return list.map(function (cat) { return renderHobbyCategoryRows(cat, { child: true }) }).join('')

  function normalizeHousingDate(raw) {
    const text = String(raw == null ? '' : raw).trim()
    if (!text) return ''
    const yOnly = text.match(/^(\d{4})$/)
    if (yOnly) {
      const y = Number(yOnly[1])
      if (y >= 1900 && y <= 2200) return yOnly[1]
      return ''
    }
    const yJP = text.match(/^(\d{4})\s*年$/)
    if (yJP) {
      const y = Number(yJP[1])
      if (y >= 1900 && y <= 2200) return yJP[1]
      return ''
    }
    const ym = normalizeYm(text)
    if (ym) return ym
    return ''
  }

  function normalizeHousingEntries(raw) {
    if (!Array.isArray(raw)) return []
    const out = []
    raw.forEach(function (row) {
      if (!row || typeof row !== 'object') return
      const date = normalizeHousingDate(row.date)
      if (!date) return
      out.push({
        date: date,
        amount: asFiniteNumber(row.amount),
        memo: normalizeMemo(row.memo),
      })
    })
    out.sort(function (a, b) {
      if (a.date < b.date) return -1
      if (a.date > b.date) return 1
      return 0
    })
    return out
  }

  function normalizeHousingYearPlan(raw) {
    const out = {}
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return out
    Object.keys(raw).forEach(function (key) {
      const y = String(key).trim()
      if (!/^\d{4}$/.test(y)) return
      const n = asFiniteNumber(raw[key])
      if (!n) return
      out[y] = n

    return out
  }

  function housingCategoryFromSeed(row, index) {
    const id = row && typeof row.id === 'string' && row.id ? row.id : ('housing-cat-' + index)
    const label = row && typeof row.label === 'string' && row.label.trim() ? row.label.trim() : id
    // v6: 住宅費の年別予定は過去年も残す（実績に使う）
    const yearPlan = normalizeHousingYearPlan(row && row.yearPlan)
    const entries = filterEntriesToYearFrom(normalizeHousingEntries(row && row.entries), SEED_YEAR)
    let planTotal = asFiniteNumber(row && row.planTotal)
    const yearSum = Object.keys(yearPlan).reduce(function (s, k) { return s + asFiniteNumber(yearPlan[k]) }, 0)
    if (yearSum > 0) planTotal = yearSum
    return {
      id: id,
      label: label,
      planTotal: planTotal,
      yearPlan: yearPlan,
      entries: entries,
    }
  }

  function normalizeHousingCategory(raw, def, index) {
    const src = raw && typeof raw === 'object' ? raw : {}
    const id = typeof src.id === 'string' && src.id.trim()
      ? src.id.trim()
      : (def ? def.id : 'housing-cat-' + index)
    const catalog = def || HOUSING_CATALOG.filter(function (row) { return row.id === id })[0] || null
    let label = typeof src.label === 'string' && src.label.trim()
      ? src.label.trim()
      : (catalog ? catalog.label : id)
    if (catalog) label = catalog.label
    const deletedFlag = src.deleted === true || String(label).endsWith(SOFT_DELETED_SUFFIX)
    const baseLabel = stripSoftDeletedSuffix(label) || label
    let planTotal
    if (src.planTotal != null && src.planTotal !== '') {
      planTotal = asFiniteNumber(src.planTotal)
    } else if (catalog && catalog.planTotal != null) {
      planTotal = asFiniteNumber(catalog.planTotal)
    } else {
      const seedRow = (HOUSING_SHEET_SEED.categories || []).filter(function (r) { return r.id === id })[0]
      planTotal = asFiniteNumber(seedRow && seedRow.planTotal)
    }
    let yearPlan = normalizeHousingYearPlan(src.yearPlan)
    if (!Object.keys(yearPlan).length) {
      const seedRow = (HOUSING_SHEET_SEED.categories || []).filter(function (r) { return r.id === id })[0]
      yearPlan = normalizeHousingYearPlan(seedRow && seedRow.yearPlan)
    }
    const outCat = {
      id: id,
      label: baseLabel,
      planTotal: planTotal,
      yearPlan: yearPlan,
      entries: normalizeHousingEntries(src.entries),
    }
    if (deletedFlag) outCat.deleted = true
    return outCat
  }

  function normalizeHousing(raw) {
    const meta = housingMetaFromSeed()
    if (!raw || typeof raw !== 'object' || !Array.isArray(raw.categories) || !raw.categories.length) {
      return seedHousing()
    }
    const catsSrc = Array.isArray(raw.categories) ? raw.categories : []
    const byId = {}
    const byLabel = {}
    catsSrc.forEach(function (row) {
      if (!row || typeof row !== 'object') return
      if (typeof row.id === 'string' && row.id) byId[row.id] = row
      if (typeof row.label === 'string' && row.label) byLabel[row.label] = row
    })
    const categories = HOUSING_CATALOG.map(function (def, index) {
      const found = byId[def.id] || byLabel[def.label] || null
      if (found) {
        delete byId[found.id]
        if (found.label) delete byLabel[found.label]
        return normalizeHousingCategory(found, def, index)
      }
      const seedRow = (HOUSING_SHEET_SEED.categories || []).filter(function (r) { return r.id === def.id })[0]
      return housingCategoryFromSeed(seedRow || def, index)
    })
    catsSrc.forEach(function (row, index) {
      if (!row || typeof row !== 'object') return
      let taken = false
      categories.forEach(function (cat) {
        if (cat.id === row.id || cat.label === row.label) taken = true
      })
      if (taken) return
      categories.push(normalizeHousingCategory(row, null, categories.length + index))
    })
    const out = Object.assign({ categories: categories }, meta)
    if (typeof raw.startDate === 'string' && raw.startDate.trim()) out.startDate = raw.startDate.trim()
    if (raw.planYears != null && raw.planYears !== '') out.planYears = asFiniteNumber(raw.planYears) || out.planYears
    if (typeof raw.buildNote === 'string') out.buildNote = raw.buildNote
    if (typeof raw.birthYm === 'string' && /^\d{4}-\d{2}$/.test(raw.birthYm)) out.birthYm = raw.birthYm
    if (raw.buildSelfAmount != null && raw.buildSelfAmount !== '') out.buildSelfAmount = asFiniteNumber(raw.buildSelfAmount)
    if (raw.buildFullAmount != null && raw.buildFullAmount !== '') out.buildFullAmount = asFiniteNumber(raw.buildFullAmount)
    if (raw.buildOtherShare != null && raw.buildOtherShare !== '') out.buildOtherShare = asFiniteNumber(raw.buildOtherShare)
    return out
  }

  function housingUniqueYearsAcross(cats) {
    const seen = {}
    ;(cats || []).forEach(function (cat) {
      if (!cat || isSoftDeleted(cat)) return
      ;(cat.entries || []).forEach(function (row) {

  }

  /** Excel DATEDIF(start, end, "M"): whole months between dates. */
  function housingElapsedMonths(startDateStr, endDate) {
    const text = String(startDateStr || '').trim()
    const m = text.match(/^(\d{4})-(\d{2})-(\d{2})$/)
    if (!m) return 0
    const startY = Number(m[1])
    const startM = Number(m[2])
    const startD = Number(m[3])
    if (!startY || !startM || !startD) return 0
    const end = endDate instanceof Date ? endDate : new Date()
    let months = (end.getFullYear() - startY) * 12 + ((end.getMonth() + 1) - startM)
    if (end.getDate() < startD) months -= 1
    return months < 0 ? 0 : months
  }

  function housingSummary(housing) {
    const data = housing && typeof housing === 'object' ? housing : seedHousing()
    const cats = Array.isArray(data.categories) ? data.categories : []
    const planYears = asFiniteNumber(data.planYears) || 72
    const buildSelf = asFiniteNumber(data.buildSelfAmount)
    const buildFull = asFiniteNumber(data.buildFullAmount)
    let selfBurden = 0
    let spentTotal = 0
    cats.forEach(function (cat) {
      if (!cat || isSoftDeleted(cat)) return
      selfBurden += housingCategoryPlanTotal(cat)
      spentTotal += housingSpentToDate(cat)
    })
    // 総額: same cats but 建築費 at full (not 2/3)
    const grandTotal = selfBurden - buildSelf + buildFull
    const selfAnnual = planYears > 0 ? selfBurden / planYears : 0
    const grandAnnual = planYears > 0 ? grandTotal / planYears : 0
    // 月割 for 合計 KPIs: 年割÷12 (= 合計÷計画月数). planMonths = planYears×12 through age-100.
    // Distinct from 現在地月割 which uses elapsed months from startDate.
    const planMonths = planYears > 0 ? planYears * 12 : 0
    const selfMonthly = planMonths > 0 ? selfBurden / planMonths : 0
    const grandMonthly = planMonths > 0 ? grandTotal / planMonths : 0
    const startDate = data.startDate || '2009-10-31'
    const elapsedMonths = housingElapsedMonths(startDate, new Date())
    const elapsedYears = elapsedMonths / 12
    const spentAnnual = elapsedYears > 0 ? spentTotal / elapsedYears : 0
    const spentMonthly = elapsedMonths > 0 ? spentTotal / elapsedMonths : 0
    return {
      planYears: planYears,
      planMonths: planMonths,
      planRangeLabel: data.planRangeLabel || '',
      planStartYear: asFiniteNumber(data.planStartYear) || 2009,
      planEndYear: asFiniteNumber(data.planEndYear) || (asFiniteNumber(data.planStartYear) || 2009) + planYears - 1,
      planStartAge: asFiniteNumber(data.planStartAge) || 29,
      startDate: startDate,
      startDateNote: data.startDateNote || '',
      buildNote: data.buildNote || '',
      buildSelf: buildSelf,
      buildFull: buildFull,
      buildOtherShare: asFiniteNumber(data.buildOtherShare),
      selfBurden: selfBurden,
      selfAnnual: selfAnnual,
      selfMonthly: selfMonthly,
      grandTotal: grandTotal,
      grandAnnual: grandAnnual,
      grandMonthly: grandMonthly,
      spentTotal: spentTotal,
      spentAnnual: spentAnnual,
      spentMonthly: spentMonthly,
      elapsedMonths: elapsedMonths,
      elapsedYears: elapsedYears,
    }
  }

  function ensureHousingState() {
    if (!state.housing) state.housing = seedHousing()
    if (!Array.isArray(state.housing.categories)) state.housing.categories = seedHousing().categories
    const seeded = seedHousing()
    ;['startDate', 'planYears', 'planRangeLabel', 'planStartYear', 'planEndYear', 'planStartAge', 'buildSelfAmount', 'buildFullAmount', 'buildOtherShare', 'buildNote', 'startDateNote'].forEach(function (key) {
      if (state.housing[key] == null || state.housing[key] === '') state.housing[key] = seeded[key]
    })
    return state.housing
  }

  function setHousingCategoryLabel(catId, value) {
    const cat = findHousingCategory(catId)
    if (!cat || isSoftDeleted(cat)) return
    const next = String(value == null ? '' : value).replace(/\s+/g, ' ').trim()
    if (!next) return
    cat.label = next
    persist()
  }

  function setHousingCategoryPlanTotal(catId, value) {
    const cat = findHousingCategory(catId)
    if (!cat || isSoftDeleted(cat)) return
    cat.planTotal = asFiniteNumber(value)
    persist()
  }

  function housingYearPlanSum(cat) {
    const plan = cat && cat.yearPlan && typeof cat.yearPlan === 'object' ? cat.yearPlan : null
    if (!plan) return 0
    let sum = 0
    Object.keys(plan).forEach(function (key) {
      sum += asFiniteNumber(plan[key])
    })
    return sum
  }

  function setHousingCategoryYearPlan(catId, year, value) {
    const cat = findHousingCategory(catId)
    if (!cat || isSoftDeleted(cat)) return
    const y = String(year == null ? '' : year).trim()
    if (!/^\d{4}$/.test(y)) return
    if (!cat.yearPlan || typeof cat.yearPlan !== 'object' || Array.isArray(cat.yearPlan)) {
      cat.yearPlan = {}
    }
    const n = asFiniteNumber(value)
    if (!n) {
      delete cat.yearPlan[y]
    } else {
      cat.yearPlan[y] = n
    }
    // Keep 予定計 in sync with sheet: planTotal = Σ yearPlan
    cat.planTotal = housingYearPlanSum(cat)
    persist()
  }

  function addHousingCategory(label) {
    ensureHousingState()
    const name = String(label == null ? '' : label).replace(/\s+/g, ' ').trim()
    if (!name) {
      flash('カテゴリ名を入力してください。', 'warn')
      return false
    }
    const dup = state.housing.categories.some(function (cat) { return cat && cat.label === name })
    if (dup) {
      flash('同じカテゴリ名がすでにあります。', 'warn')
      return false
    }
    const id = 'housing-cat-' + Date.now()
    state.housing.categories.push({ id: id, label: name, planTotal: 0, yearPlan: {}, entries: [] })
    persist()
    flash('カテゴリ「' + name + '」を追加しました。', 'ok')
    return true
  }

  function removeHousingCategory(catId) {
    const cat = findHousingCategory(catId)
    if (!cat) return
    if (isSoftDeleted(cat)) {
      const okHard = window.confirm('「' + cat.label + '」を完全に削除します。記録も消えます。よろしいですか？')
      if (!okHard) return
      state.housing.categories = state.housing.categories.filter(function (row) {
        return !(row && row.id === catId)
      })
      persist()
      flash('カテゴリを完全に削除しました。', 'ok')
      return
    }
    const ok = window.confirm(
      '「' + cat.label + '」を' + SOFT_DELETED_SUFFIX + 'として残します。よろしいですか？',
    )
    if (!ok) return
    cat.deleted = true
    persist()
    flash('カテゴリを削除済みにしました。', 'ok')
  }

  function hardRemoveHousingCategory(catId) {
    const cat = findHousingCategory(catId)
    if (!cat) return
    const ok = window.confirm('「' + cat.label + '」を完全に削除します。記録も消えます。よろしいですか？')
    if (!ok) return
    state.housing.categories = state.housing.categories.filter(function (row) {
      return !(row && row.id === catId)
    })
    persist()
    flash('カテゴリを完全に削除しました。', 'ok')
  }

  function addHousingEntry(catId, date, amount, memo) {
    const cat = findHousingCategory(catId)
    if (!cat || isSoftDeleted(cat)) return
    const d = normalizeHousingDate(date)
    if (!d) {
      flash('年（YYYY）または年月（YYYY-MM）を入力してください。', 'warn')
      return
    }
    if (!Array.isArray(cat.entries)) cat.entries = []
    cat.entries.push({
      date: d,
      amount: asFiniteNumber(amount),
      memo: normalizeMemo(memo),
    })
    cat.entries = normalizeHousingEntries(cat.entries)
    openEntryPanels[cat.id] = true
    persist()
    flash(d + 'の記録を追加しました。', 'ok')
  }

  function setHousingEntry(catId, index, field, value) {
    const cat = findHousingCategory(catId)
    if (!cat || !Array.isArray(cat.entries) || !cat.entries[index]) return
    if (field === 'date') {
      const d = normalizeHousingDate(value)
      if (!d) {
        flash('年（YYYY）または年月（YYYY-MM）を入力してください。', 'warn')
        return
      }
      cat.entries[index].date = d
    } else if (field === 'amount') {
      cat.entries[index].amount = asFiniteNumber(value)
    } else if (field === 'memo') {
      cat.entries[index].memo = normalizeMemo(value)
    }
    cat.entries = normalizeHousingEntries(cat.entries)
    openEntryPanels[cat.id] = true
    persist()
  }

  function removeHousingEntry(catId, index) {
    const cat = findHousingCategory(catId)
    if (!cat || !Array.isArray(cat.entries) || !cat.entries[index]) return
    cat.entries.splice(index, 1)
    openEntryPanels[cat.id] = true
    persist()
    flash('記録を削除しました。', 'ok')
  }

  function housingYearSchedule(housing) {
    const data = housing && typeof housing === 'object' ? housing : seedHousing()
    const summary = housingSummary(data)
    const startY = summary.planStartYear
    const endY = summary.planEndYear
    const startAge = summary.planStartAge
    const cats = (data.categories || []).filter(function (cat) { return cat && !isSoftDeleted(cat) })
    const rows = []
    for (let y = startY; y <= endY; y++) {
      const yKey = String(y)
      const parts = []
      let total = 0
      cats.forEach(function (cat) {
        const plan = cat.yearPlan && typeof cat.yearPlan === 'object' ? cat.yearPlan : {}
        let amt = asFiniteNumber(plan[yKey])
        if (!amt) return
        total += amt
        parts.push({ label: cat.label, amount: amt })
      })
      rows.push({
        year: y,
        age: startAge + (y - startY),
        total: total,
        parts: parts,
      })
    }
    return rows
  }

  function renderHousingYearSchedule(housing) {
    const data = housing && typeof housing === 'object' ? housing : seedHousing()
    const summary = housingSummary(data)
    const rows = housingYearSchedule(data)
    const cats = (data.categories || []).filter(function (cat) { return cat && !isSoftDeleted(cat) })
    const nowY = new Date().getFullYear()
    const body = rows.map(function (row) {
      const yKey = String(row.year)
      const partsHtml = cats.map(function (cat) {
        const plan = cat.yearPlan && typeof cat.yearPlan === 'object' ? cat.yearPlan : {}
        const amt = asFiniteNumber(plan[yKey])
        return (
          '<label class="housing-year-part">' +
            '<span>' + escapeHtml(cat.label) + '</span>' +
            '<input class="housing-plan-input yen-amount" inputmode="numeric" data-housing-cat="' + escapeHtml(cat.id) +
              '" data-housing-year="' + escapeHtml(yKey) + '" data-housing-yfield="amount"' +
              ' aria-label="' + escapeHtml(cat.label + ' ' + yKey + '年予定') + '"' +
              ' value="' + escapeHtml(yenAmountDisplay(amt || 0)) + '">' +
          '</label>'
        )
      }).join('')
      const trClass = row.year === nowY ? ' class="housing-year-now"' : ''
      return (
        '<tr' + trClass + '>' +
          '<td>' + row.year + '</td>' +
          '<td>' + row.age + '歳</td>' +
          '<td>' + formatYen(row.total) + '</td>' +
          '<td class="housing-year-breakdown"><div class="housing-year-parts">' + partsHtml + '</div></td>' +
        '</tr>'
      )
    }).join('')
    const rangeSub = summary.planRangeLabel
      ? escapeHtml(summary.planRangeLabel)
      : (summary.planStartYear + '〜' + summary.planEndYear)
    return (
      '<section class="card">' +
        '<div class="group-head">' +
          '<div><h2>年別予定</h2><p class="sub">いつにどれぐらい · ' + rangeSub + '（' + formatPlainNumber(summary.planYears, 0) + '年）· 編集は端末に保存（MF取込なし）</p></div>' +
          '<p>' + rows.length + '年</p>' +
        '</div>' +
        '<div class="table-scroll housing-year-scroll"><table class="year-grid housing-year-grid">' +
          '<thead><tr><th>年</th><th>年齢</th><th>合計</th><th>カテゴリ予定</th></tr></thead>' +
          '<tbody>' + (body || '<tr><td colspan="4">予定がありません。</td></tr>') + '</tbody>' +
        '</table></div>' +
      '</section>'
    )
  }

  // v3: 住宅費カテゴリをカードで表示（実績=今日以前の記録合計、月平均=(予算−実績)÷100歳までの残り月数、100円切上げ）
  function housingDefaultBirthYm(data) {
    const endY = asFiniteNumber(data && data.planEndYear) || 2080
    const m = String((data && data.planRangeLabel) || '').match(/(\d{2})\/(\d{2})\(100歳\)/)
    const mm = m ? m[2] : '10'
    return String(endY - 100) + '-' + mm
  }
  function housingBirthYm(data) {
    const v = String((data && data.birthYm) || '').trim()
    return /^\d{4}-\d{2}$/.test(v) ? v : housingDefaultBirthYm(data)
  }
  function housingMonthsTo100(data) {
    const b = housingBirthYm(data).split('-')
    const t = tokyoTodayParts()
    const n = (Number(b[0]) + 100) * 12 + Number(b[1]) - (t.y * 12 + t.m)
    return n > 0 ? n : 0
  }
  function housingSpentToDate(cat) {
    const t = tokyoTodayParts()
    const todayKey = String(t.y) + '-' + String(t.m).padStart(2, '0') + '-' + String(t.d).padStart(2, '0')
    let sum = 0
    const plan = cat && cat.yearPlan && typeof cat.yearPlan === 'object' ? cat.yearPlan : {}
    Object.keys(plan).forEach(function (key) {
      const d = String(key || '').trim()
      if (!/^\d{4}/.test(d)) return
      if (d <= todayKey.slice(0, d.length)) sum += asFiniteNumber(plan[key])
    })
    return sum
  }
  function renderHousingCards(data) {
    const months = housingMonthsTo100(data)
    const cats = (data.categories || []).filter(function (cat) { return cat && !isSoftDeleted(cat) })
    const cards = cats.map(function (cat) {
      const spent = housingSpentToDate(cat)
      const budget = housingCategoryPlanTotal(cat)
      const avg = months > 0 ? ceilYen100(Math.max(0, budget - spent) / months) : 0
      return (
        '<div class="housing-card" style="border:1px solid var(--line,#ccc);border-radius:10px;padding:0.75rem;margin-bottom:0.75rem">' +
          '<div class="plain-field"><label class="yen-label">カテゴリ名</label>' +
            '<input data-housing-cat="' + escapeHtml(cat.id) + '" data-housing-pfield="label" aria-label="カテゴリ名" value="' + escapeHtml(cat.label) + '"></div>' +
          '<dl class="kpis">' +
            '<div class="kpi"><dt>今までの実績</dt><dd>' + formatYen(spent) + '</dd></div>' +
            '<div class="kpi"><dt>100歳までの予算</dt><dd><input class="housing-plan-input yen-amount" inputmode="numeric" data-housing-cat="' + escapeHtml(cat.id) +
              '" data-housing-pfield="planTotal" aria-label="100歳までの予算" value="' + escapeHtml(yenAmountDisplay(budget)) + '"></dd></div>' +
            '<div class="kpi"><dt>あといくら</dt><dd>' + formatYen(Math.max(0, budget - spent)) + '</dd></div>' +
            '<div class="kpi"><dt>あとの月平均</dt><dd>' + formatYen(avg) + '</dd><p class="sub">(予算−実績)÷' + months + 'か月</p></div>' +
            '<div class="kpi"><dt>あとの年平均</dt><dd>' + formatYen(avg * 12) + '</dd><p class="sub">あとの月平均×12</p></div>' +
          '</dl>' +
        '</div>'
      )
    }).join('')
    return (
      '<section class="card">' +
        '<div class="group-head"><h2>カテゴリ</h2><p>' + cats.length + '件 · 100歳まで残り ' + months + 'か月</p></div>' +
        '<div class="plain-field" style="margin-bottom:0.75rem"><label class="yen-label">生年月日（年月・100歳の基準）</label>' +
          '<input type="month" id="housing-birth-ym" value="' + escapeHtml(housingBirthYm(data)) + '"></div>' +
        (cards || '<p class="sub">カテゴリがありません。</p>') +
        '<div class="row-actions" style="margin-bottom:0.75rem">' +
          '<button type="button" class="btn" id="add-housing-cat">カテゴリを追加</button>' +
        '</div>' +
        '<form id="add-housing-cat-form" class="entry-add" hidden>' +
          '<div class="plain-field"><label class="yen-label">名前</label>' +
            '<input name="label" required placeholder="例: 庭木" autocomplete="off"></div>' +
          '<button type="submit" class="btn outline">カテゴリを追加</button>' +
          '<button type="button" class="btn-text" id="cancel-add-housing-cat">キャンセル</button>' +
        '</form>' +
      '</section>'
    )
  }

  function renderHousingPlan(housing) {
    const data = housing && Array.isArray(housing.categories) ? housing : seedHousing()
    const cats = data.categories || []
    const summary = housingSummary(data)
    const visible = cats.filter(function (cat) { return cat && !isSoftDeleted(cat) })
    const body = cats.map(renderHousingCategoryRows).join('')
    const buildNoteSub = summary.buildNote
      ? '<p class="sub build-note">' + escapeHtml(String(summary.buildNote).replace(/[ \u3000]{2,}/g, ' ')) + '</p>'
      : (summary.buildOtherShare
        ? '<p class="sub">建築費総額 ' + formatYen(summary.buildFull) + '（うち他負担 ' + formatYen(summary.buildOtherShare) + '）</p>'
        : '')
    const rangeSub = summary.planRangeLabel
      ? '<p class="sub">' + escapeHtml(summary.planRangeLabel) + ' · ' + formatPlainNumber(summary.planYears, 0) + '年</p>'
      : '<p class="sub">' + formatPlainNumber(summary.planYears, 0) + '年割（100歳まで）</p>'
    return (
      '<section class="card">' +
        '<div class="group-head">' +
          '<div><h2>住宅費</h2><p class="sub">履歴＋100歳までの予定（記録用・MF取込なし）</p></div>' +
        '</div>' +
        '<dl class="kpis">' +
          '<div class="kpi"><dt>自己負担合計</dt><dd>' + formatYen(summary.selfBurden) + '</dd>' +
            '<p class="sub">年割 ' + formatYen(summary.selfAnnual) + ' · 月割 ' + formatYen(summary.selfMonthly) + '</p>' + rangeSub +
            '<p class="sub">月割=年割÷12（=合計÷計画月数 ' + formatPlainNumber(summary.planMonths, 0) + '）</p></div>' +
          '<div class="kpi' + (summary.buildNote ? ' kpi-wide' : '') + '"><dt>総額合計</dt><dd>' + formatYen(summary.grandTotal) + '</dd>' +
            '<p class="sub">年割 ' + formatYen(summary.grandAnnual) + ' · 月割 ' + formatYen(summary.grandMonthly) + '</p>' + buildNoteSub + '</div>' +
          '<div class="kpi"><dt>現在地</dt><dd>' + formatYen(summary.spentTotal) + '</dd>' +
            '<p class="sub">年割 ' + formatYen(summary.spentAnnual) + ' · 月割 ' + formatYen(summary.spentMonthly) + '</p>' +
            '<p class="sub">年別予定の今日までの合計</p></div>' +
          '<div class="kpi"><dt>あといくら</dt><dd>' + formatYen(cats.filter(function (c) { return c && !isSoftDeleted(c) }).reduce(function (t, c) { return t + Math.max(0, housingCategoryPlanTotal(c) - housingSpentToDate(c)) }, 0)) + '</dd>' +
            '<p class="sub">各カテゴリーの (予算−実績) の合計（マイナスは0）</p></div>' +
          (function () {
            const m100 = housingMonthsTo100(data)
            const mAvg = cats.filter(function (c) { return c && !isSoftDeleted(c) }).reduce(function (t, c) {
              return t + (m100 > 0 ? ceilYen100(Math.max(0, housingCategoryPlanTotal(c) - housingSpentToDate(c)) / m100) : 0)
            }, 0)
            return '<div class="kpi"><dt>あとの月平均</dt><dd>' + formatYen(mAvg) + '</dd><p class="sub">各カテゴリーのあとの月平均の合計</p></div>' +
              '<div class="kpi"><dt>あとの年平均</dt><dd>' + formatYen(mAvg * 12) + '</dd><p class="sub">あとの月平均×12</p></div>'
          })() +
          '<div class="kpi"><dt>経過月数</dt><dd>' + formatPlainNumber(summary.elapsedMonths, 0) + '</dd>' +
            '<p class="sub">開始 ' + escapeHtml(summary.startDate) + '</p></div>' +
          '<div class="kpi"><dt>経過年数</dt><dd>' + formatPlainNumber(summary.elapsedYears, 2) + '年</dd>' +
            '<p class="sub">経過月数÷12</p></div>' +
        '</dl>' +
      '</section>' +
      renderHousingYearSchedule(data) +
      renderHousingCards(data)
