  // Education and social write plan spreads, not tab actuals, so they are not here.
  function syncMonthlyPayActualsToAnnual(year) {
    let changed = false
    if (syncHobbyActualsToAnnual(year)) changed = true
    return changed
  }

  // ---- 年別実績 (per-year view inside 自動車 / 教養・教育 / 趣味・娯楽 / 交際費) ----
  // Display only. Filters stored entries by year; never writes state.
  let statsYear = new Date().getFullYear()

  function statsEntryList(entries) {
    return (Array.isArray(entries) ? entries : []).filter(function (row) {
      return row && !isPurposeCarryRow(row) && asFiniteNumber(row.amount) !== 0
    })
  }

  function statsElapsedMonths(year) {
    const now = new Date()
    const y = Number(year)
    if (y === now.getFullYear()) return now.getMonth() + 1
    return 12
  }

  function statsRow(label, entries, year) {
    const list = statsEntryList(entries).filter(function (row) { return entryYearPrefix(row) === String(year) })
    let sum = 0
    list.forEach(function (row) { sum += asFiniteNumber(row.amount) })
    return { label: label, count: list.length, sum: sum, avg: ceilYen100(sum / statsElapsedMonths(year)) }
  }

  function statsYearsFromEntries(lists) {
    const seen = {}
    seen[new Date().getFullYear()] = true
    ;(lists || []).forEach(function (entries) {
      statsEntryList(entries).forEach(function (row) {
        const y = Number(entryYearPrefix(row))
        if (y >= 1900 && y <= 2200) seen[y] = true
      })
    })
    return Object.keys(seen).map(Number).sort(function (a, b) { return b - a })
  }

  function statsSections(tab) {
    const sections = []
    if (tab === 'hobby') {
      const cats = (state.hobby && state.hobby.categories || []).filter(function (cat) { return cat && !isSoftDeleted(cat) })
      const buckets = { nozomu: [], haru: [], shared: [] }
      sortHobbyCategoriesForDisplay(cats).forEach(function (cat) {
        const person = hobbyPersonOf(cat)
        const key = person === 'nozomu' || person === 'haru' ? person : 'shared'
        const label = cat.id === 'pet' || hobbyBaseMidOf(cat) === 'ペット' ? 'ペット（ペット目的別を含む）' : (hobbyMidLabelOf(cat) || entityDisplayLabel(cat))
        buckets[key].push({ label: label, entries: cat.entries })
      })
      sections.push({ label: '望', rows: buckets.nozomu })
      sections.push({ label: 'はる', rows: buckets.haru })
      sections.push({ label: '共通', rows: buckets.shared })
    } else if (tab === 'education') {
      const rows = []
      educationActivePeople(state.education && state.education.people || []).forEach(function (person) {
        ;(person.items || []).forEach(function (item) {
          if (isEducationDailyItem(item)) rows.push({ label: item.name || entityDisplayLabel(person), entries: item.entries })
        })
      })
      sections.push({ label: '日常', rows: rows })
    } else if (tab === 'social') {
      // One row per item name, summed across people (same names as the 交際費 table).
      const daily = []
      const purpose = []
      const byName = {}
      socialActivePeople(state.social && state.social.people || []).forEach(function (person) {
        ;(person.items || []).forEach(function (item) {
          if (!item) return
          const name = item.name || 'その他'
          if (!byName[name]) {
            byName[name] = { label: name, entries: [] }
            if (socialItemIsPurpose(item)) purpose.push(byName[name])
            else daily.push(byName[name])
          }
          byName[name].entries = byName[name].entries.concat(Array.isArray(item.entries) ? item.entries : [])
        })
      })
      sections.push({ label: '日常（プレゼント・その他）', rows: daily })
      sections.push({ label: '目的別（冠婚・葬祭・お年玉）', rows: purpose })
    } else if (tab === 'vehicles') {
      const byCat = {}
      const order = []
      ;(state.vehicles || []).forEach(function (car) {
        if (!car || isSoftDeleted(car)) return
        ;(car.items || []).forEach(function (item) {
          if (!item) return
          const label = item.category || 'その他'
          // 自動車目的別 (saving) is a set-aside, not an actual cost. Leave it out.
          const catDefs = Array.isArray(car.categories) && car.categories.length ? car.categories : VEHICLE_CATALOG
          const def = catDefs.filter(function (row) { return row && row.label === label })[0]
          if ((def && def.kind === 'saving') || label === '自動車目的別') return
          if (!byCat[label]) { byCat[label] = []; order.push(label) }
          byCat[label] = byCat[label].concat(Array.isArray(item.entries) ? item.entries : [])
        })
      })
      const rank = {}
      VEHICLE_CATALOG.forEach(function (row, index) { rank[row.label] = index })
      order.sort(function (a, b) {
        const ra = rank[a] != null ? rank[a] : 99
        const rb = rank[b] != null ? rank[b] : 99
        return ra - rb
      })
      sections.push({ label: '実費（全車）', rows: order.map(function (label) { return { label: label, entries: byCat[label] } }) })
    }
    return sections
  }

  function renderYearStatsCard(tab) {
    const sections = statsSections(tab)
    const lists = []
    sections.forEach(function (sec) { sec.rows.forEach(function (row) { lists.push(row.entries) }) })
    const years = statsYearsFromEntries(lists)
    if (years.indexOf(statsYear) < 0) statsYear = years.indexOf(new Date().getFullYear()) >= 0 ? new Date().getFullYear() : years[0]
    const year = statsYear
    const months = statsElapsedMonths(year)
    let grandSum = 0
    let grandCount = 0
    const body = sections.map(function (sec) {
      if (!sec.rows.length) return ''
      let secSum = 0
      let secCount = 0
      const rows = sec.rows.map(function (src) {
        const r = statsRow(src.label, src.entries, year)
        secSum += r.sum
        secCount += r.count
        return '<tr><td class="hobby-child-name">' + escapeHtml(r.label) + '</td><td class="year-summary">' + r.count +

  function tabDropBeforeId(clientX) {
    const chips = document.querySelectorAll('[data-tab-move]')
    let before = ''
    Array.prototype.forEach.call(chips, function (chip) {
      chip.classList.remove('is-drop-before')
      if (before) return
      const box = chip.getBoundingClientRect()
      if (clientX < box.left + box.width / 2) {
        before = chip.getAttribute('data-tab-move') || ''
        chip.classList.add('is-drop-before')
      }
    })
    return before
  }

  function endTabDrag(apply, clientX) {
    if (!tabDrag) return
    const fromId = tabDrag.id
    const dragged = tabDrag.moved
    const ready = tabDrag.ready
    clearTabDrag()
    if (!apply || !ready || !dragged) return
    tabSuppressClick = true
    if (moveTabOrder(fromId, tabDropBeforeId(clientX))) render()
  }

  function clearTabDrag() {
    if (!tabDrag) return
    if (tabDrag.timer) window.clearTimeout(tabDrag.timer)
    if (tabDrag.unlisten) {
      tabDrag.unlisten.forEach(function (fn) { fn() })
    }
    if (tabDrag.ghost && tabDrag.ghost.parentNode) tabDrag.ghost.parentNode.removeChild(tabDrag.ghost)
    if (tabDrag.button) {
      tabDrag.button.classList.remove('is-hold', 'is-dragging')
      try {
        if (tabDrag.pointerId != null) tabDrag.button.releasePointerCapture(tabDrag.pointerId)
      } catch (err) {}
    }
    document.querySelectorAll('.chip.is-drop-before').forEach(function (el) {
      el.classList.remove('is-drop-before')
    })
    tabDrag = null
  }

  function startTabDrag() {
    if (!tabDrag || tabDrag.ready) return
    tabDrag.ready = true
    tabDrag.button.classList.add('is-hold')
    try { tabDrag.button.setPointerCapture(tabDrag.pointerId) } catch (err) {}
    try { if (navigator.vibrate) navigator.vibrate(10) } catch (err) {}
  }

  function onTabPointerMove(event) {
    if (!tabDrag || event.pointerId !== tabDrag.pointerId) return
    const dx = event.clientX - tabDrag.startX
    const dy = event.clientY - tabDrag.startY
    if (!tabDrag.ready) {
      if (Math.abs(dx) > TAB_SCROLL_PX || Math.abs(dy) > TAB_SCROLL_PX) {
        // Allow native horizontal scroll / keep click for tab select
        tabSuppressClick = false
        clearTabDrag()
      }
      return
    }
    event.preventDefault()
    tabSuppressClick = true
    moveTabGhost(event.clientX, event.clientY)
  }

  function onTabPointerUp(event) {
    if (!tabDrag || event.pointerId !== tabDrag.pointerId) return
    if (!tabDrag.ready) {
      tabSuppressClick = false
      clearTabDrag()
      return
    }
    endTabDrag(true, event.clientX)
  }

  function onTabPointerCancel(event) {
    if (!tabDrag || event.pointerId !== tabDrag.pointerId) return
    endTabDrag(false, 0)
  }

  function moveTabGhost(clientX, clientY) {
    if (!tabDrag || !tabDrag.ready) return
    if (!tabDrag.moved) {
      tabDrag.moved = true
      tabDrag.button.classList.add('is-dragging')
      const ghost = tabDrag.button.cloneNode(true)
      ghost.removeAttribute('data-view')
      ghost.removeAttribute('data-tab-move')
      ghost.removeAttribute('id')
      ghost.setAttribute('aria-hidden', 'true')
      ghost.classList.add('chip-ghost')
      ghost.classList.remove('is-dragging')
      ghost.style.width = tabDrag.button.getBoundingClientRect().width + 'px'
      document.body.appendChild(ghost)
      tabDrag.ghost = ghost
    }
    if (tabDrag.ghost) {
      tabDrag.ghost.style.left = (clientX - tabDrag.offsetX) + 'px'
      tabDrag.ghost.style.top = (clientY - tabDrag.offsetY) + 'px'
    }
    tabDropBeforeId(clientX)
  }

  function bindTabReorder() {
    document.querySelectorAll('[data-tab-move]').forEach(function (button) {
      button.addEventListener('contextmenu', function (event) {
        event.preventDefault()
      })
      button.addEventListener('pointerdown', function (event) {
        if (event.button != null && event.button !== 0) return
        clearTabDrag()
        tabSuppressClick = false
        const box = button.getBoundingClientRect()
        tabDrag = {
          id: button.getAttribute('data-tab-move'),
          button: button,
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          offsetX: event.clientX - box.left,
          offsetY: event.clientY - box.top,
          ready: false,
          moved: false,
          unlisten: [],
          timer: window.setTimeout(startTabDrag, TAB_HOLD_MS),
        }
        // setPointerCapture only after hold ready (startTabDrag) so .views can pan
        const moveOpts = { passive: false }
        document.addEventListener('pointermove', onTabPointerMove, moveOpts)
        document.addEventListener('pointerup', onTabPointerUp)
        document.addEventListener('pointercancel', onTabPointerCancel)
        tabDrag.unlisten.push(function () {
          document.removeEventListener('pointermove', onTabPointerMove, moveOpts)
          document.removeEventListener('pointerup', onTabPointerUp)
          document.removeEventListener('pointercancel', onTabPointerCancel)
        })
      })
    })
  }

      })
    })
    document.querySelectorAll('[data-unretire-special-item]').forEach(function (button) {
      button.addEventListener('click', function () {
        const catId = button.getAttribute('data-special-cat')
        const itemId = button.getAttribute('data-unretire-special-item')
        const ok = unretireSpecialItem(catId, itemId)
        if (ok) render()
      })
    })
    document.querySelectorAll('details[data-special-retired-fold]').forEach(function (el) {
      el.addEventListener('toggle', function () {
        const catId = el.getAttribute('data-special-retired-fold')
        if (!catId) return
        if (el.open) openSpecialRetiredFold[catId] = true
        else delete openSpecialRetiredFold[catId]
      })
    })
    document.querySelectorAll('[data-special-edit-form]').forEach(function (form) {
      function syncRenewFromCycle() {
        const startEl = form.elements.startDate
        const cycleEl = form.elements.cycleYears
        const renewEl = form.elements.renewDate
        if (!startEl || !cycleEl || !renewEl) return
        const auto = computeSpecialRenewDate(startEl.value, specialYearsToMonths(cycleEl.value))
        if (auto) renewEl.value = auto
      }
      if (form.elements.startDate) {
        form.elements.startDate.addEventListener('change', syncRenewFromCycle)
      }
      if (form.elements.cycleYears) {
        form.elements.cycleYears.addEventListener('change', syncRenewFromCycle)
        form.elements.cycleYears.addEventListener('input', syncRenewFromCycle)
      }
      form.addEventListener('submit', function (event) {
        event.preventDefault()
        const catId = form.getAttribute('data-special-cat')
        const itemId = form.getAttribute('data-special-edit-form')
        syncRenewFromCycle()
        const ok = updateSpecialItemFields(catId, itemId, {
          name: form.elements.name.value,
          maker: form.elements.maker.value,
          memo: form.elements.memo ? form.elements.memo.value : '',
          cycleYears: form.elements.cycleYears.value,
          price: form.elements.price.value,
          renewDate: form.elements.renewDate.value,
          startDate: form.elements.startDate.value,
        })
        if (!ok) return
        openSpecialEditItemId = null
        flash('項目を更新しました。', 'ok')
        render()
      })
    })
    document.querySelectorAll('[data-toggle-special-history]').forEach(function (button) {
      button.addEventListener('click', function () {
        const id = button.getAttribute('data-toggle-special-history')
        if (!id) return
        if (openSpecialHistoryIds[id]) delete openSpecialHistoryIds[id]
        else openSpecialHistoryIds[id] = true
        render()
      })
    })
    document.querySelectorAll('[data-remove-special-item]').forEach(function (button) {
      button.addEventListener('click', function () {
        removeSpecialItem(button.getAttribute('data-special-cat'), button.getAttribute('data-remove-special-item'))
        render()
      })
    })
    document.querySelectorAll('[data-special-other-pfield]').forEach(function (input) {
      input.addEventListener('change', function () {
        if (input.getAttribute('data-special-other-pfield') === 'monthlyPlan') {
          setSpecialOtherMonthlyPlan(parseYenInput(input.value))
        }
        render()
      })
    })
    document.querySelectorAll('[data-special-other-efield]').forEach(function (input) {
      input.addEventListener('change', function () {
        const field = input.getAttribute('data-special-other-efield')
        const value = field === 'amount' ? parseYenInput(input.value) : input.value
        setSpecialOtherEntry(
          Number(input.getAttribute('data-special-other-entry-index')),
          field,
          value,
        )
        render()
      })
    })
    document.querySelectorAll('[data-remove-special-other-entry-index]').forEach(function (button) {
      button.addEventListener('click', function () {
        removeSpecialOtherEntry(Number(button.getAttribute('data-remove-special-other-entry-index')))
        render()
      })
    })
    const addSpecialOtherEntryForm = document.getElementById('add-special-other-entry-form')
    if (addSpecialOtherEntryForm) {
      addSpecialOtherEntryForm.addEventListener('submit', function (event) {
        event.preventDefault()
        addSpecialOtherEntry(
          addSpecialOtherEntryForm.elements.date.value,
          addSpecialOtherEntryForm.elements.amount.value,
          '',
        )
        render()
      })
    }
    const dismissHint = document.getElementById('dismiss-homescreen-hint')
    if (dismissHint) {
      dismissHint.addEventListener('click', function () {
        try { localStorage.setItem(HOMESCREEN_HINT_KEY, '1') } catch (err) {}
        showHomescreenHint = false
        const node = document.getElementById('homescreen-hint')
        if (node) node.remove()
      })
    }
    const statsSelect = document.getElementById('stats-year-select')
    if (statsSelect) {
      statsSelect.addEventListener('change', function (event) {
        statsYear = Number(event.target.value)
        render()
      })
    }
    bindYenAmountInputs()
  }

  enableHomescreen()
  window.addEventListener('resize', syncSpecialHistoryWidths)
  render()
})()
    </script>
  </body>
</html>
