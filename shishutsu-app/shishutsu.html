    }
    const monthlyGuide = remainMonths > 0 ? Math.round(remainPaySum / remainMonths) : 0
    return {
      total: total,
      principal: principal,
      interest: interest,
      remaining: remaining,
      monthlyGuide: monthlyGuide,
      annualGuide: monthlyGuide * 12,
      remainMonths: remainMonths,
      loanCount: loans.length,
    }
  }

  function loanOwnSummary(loan) {
    let total = 0, principal = 0, interest = 0, remaining = 0, paidCount = 0, unpaidCount = 0
    ;(loan.schedule || []).forEach(function (row) {
      total += row.payment
      principal += row.principal
      interest += row.interest
      if (loanRowIsPaid(loan, row)) paidCount += 1
      else {
        remaining += row.payment
        unpaidCount += 1
      }
    })
    return { total: total, principal: principal, interest: interest, remaining: remaining, paidCount: paidCount, unpaidCount: unpaidCount, count: (loan.schedule || []).length }
  }

  function setLoanField(loanId, field, value) {
    const loan = findLoan(loanId)
    if (!loan) return
    if (field === 'label') loan.label = String(value || '').trim() || loan.label
    else if (field === 'payDay') loan.payDay = Math.max(1, Math.min(28, asFiniteNumber(value) || 1))
    persist()
  }

  function setLoanScheduleField(loanId, index, field, value) {
    const loan = findLoan(loanId)
    if (!loan || !loan.schedule[index]) return
    const row = loan.schedule[index]
    if (field === 'ym') {
      const m = String(value || '').match(/^(\d{4})-(\d{2})$/)
      if (m) row.ym = m[1] + '-' + m[2]
    } else if (field === 'payment' || field === 'principal' || field === 'interest') {
      row[field] = Math.max(0, Math.round(asFiniteNumber(value)))
    } else if (field === 'memo') {
      row.memo = String(value == null ? '' : value)
    } else if (field === 'paid') {
      if (value === 'auto' || value === null || value === '') delete row.paid
      else row.paid = !!value
    }
    loan.total = loan.schedule.reduce(function (s, r) { return s + r.payment }, 0)
    loan.principal = loan.schedule.reduce(function (s, r) { return s + r.principal }, 0)
    loan.interest = loan.schedule.reduce(function (s, r) { return s + r.interest }, 0)
    openEntryPanels[loanId] = true
    persist()
  }

  function toggleLoanPaid(loanId, index) {
    const loan = findLoan(loanId)
    if (!loan || !loan.schedule[index]) return
    const row = loan.schedule[index]
    const currently = loanRowIsPaid(loan, row)
    row.paid = !currently
    openEntryPanels[loanId] = true
    persist()
  }

  function addLoanScheduleRow(loanId, ym, payment, principal, interest, memo) {
    const loan = findLoan(loanId)
    if (!loan) return
    const pay = Math.max(0, Math.round(asFiniteNumber(payment)))
    let prin = Math.round(asFiniteNumber(principal))
    let ints = Math.round(asFiniteNumber(interest))
    if (!Number.isFinite(prin)) prin = pay
    if (!Number.isFinite(ints)) ints = 0
    const m = String(ym || '').match(/^(\d{4})-(\d{2})$/)
    if (!m) {
      flash('年月は YYYY-MM で入力してください。', 'warn')
      return
    }
    loan.schedule.push(normalizeLoanScheduleRow({
      ym: m[1] + '-' + m[2], payment: pay, principal: prin, interest: ints, memo: memo || '',
    }, loan))
    loan.schedule.sort(function (a, b) { return a.ym < b.ym ? -1 : a.ym > b.ym ? 1 : 0 })
    loan.total = loan.schedule.reduce(function (s, r) { return s + r.payment }, 0)
    loan.principal = loan.schedule.reduce(function (s, r) { return s + r.principal }, 0)
    loan.interest = loan.schedule.reduce(function (s, r) { return s + r.interest }, 0)
    openEntryPanels[loanId] = true
    persist()
    flash('返済行を追加しました。', 'ok')
  }

  function removeLoanScheduleRow(loanId, index) {
    const loan = findLoan(loanId)
    if (!loan || !loan.schedule[index]) return
    loan.schedule.splice(index, 1)
    loan.total = loan.schedule.reduce(function (s, r) { return s + r.payment }, 0)
    loan.principal = loan.schedule.reduce(function (s, r) { return s + r.principal }, 0)
    loan.interest = loan.schedule.reduce(function (s, r) { return s + r.interest }, 0)
    openEntryPanels[loanId] = true
    persist()
    flash('返済行を削除しました。', 'ok')
  }

  function addLoan(label) {
    ensureLoansState()
    const name = String(label || '').trim()
    if (!name) return
    const dup = state.loans.loans.some(function (loan) { return loan && loan.label === name })
    if (dup) {
      flash('同じ名前の借入が既にあります。', 'warn')
      return
    }
    const id = 'loan-' + Date.now()
    state.loans.loans.push({
      id: id, label: name, payDay: 1, total: 0, principal: 0, interest: 0, schedule: [],
    })
    openEntryPanels[id] = true
    persist()
    flash('借入を追加しました。', 'ok')
  }

  function removeLoan(loanId) {
    ensureLoansState()
    state.loans.loans = state.loans.loans.filter(function (loan) { return loan && loan.id !== loanId })
    delete openEntryPanels[loanId]
    persist()
    flash('借入を削除しました。', 'ok')
  }

  function renderLoanSchedule(loan) {
    const rows = Array.isArray(loan.schedule) ? loan.schedule : []
    const today = tokyoTodayParts()
    const body = rows.map(function (row, index) {
      const paid = loanRowIsPaid(loan, row)
      const autoPaid = loanPaymentDatePassed(row.ym, loan.payDay, today)
      const isFuture = !autoPaid
      const statusLabel = paid ? '済' : (isFuture ? '予定/未' : '未')
      const statusClass = paid ? 'loan-paid' : (isFuture ? 'loan-planned' : 'loan-unpaid')
      const overrideNote = (row.paid === true || row.paid === false)
        ? (row.paid === autoPaid ? '' : ' <span class="sub">(手動)</span>')
        : ''
      return (
        '<tr class="' + statusClass + '">' +
          '<td><input class="loan-ym-input" data-loan-id="' + escapeHtml(loan.id) +
            '" data-loan-row="' + index + '" data-loan-field="ym" aria-label="年月" value="' + escapeHtml(row.ym) + '"></td>' +
          '<td><input class="housing-plan-input yen-amount" inputmode="numeric" data-loan-id="' + escapeHtml(loan.id) +
            '" data-loan-row="' + index + '" data-loan-field="payment" aria-label="返済額" value="' + escapeHtml(yenAmountDisplay(row.payment)) + '"></td>' +
          '<td><input class="housing-plan-input yen-amount" inputmode="numeric" data-loan-id="' + escapeHtml(loan.id) +
            '" data-loan-row="' + index + '" data-loan-field="principal" aria-label="元金" value="' + escapeHtml(yenAmountDisplay(row.principal)) + '"></td>' +
          '<td><input class="housing-plan-input yen-amount" inputmode="numeric" data-loan-id="' + escapeHtml(loan.id) +
            '" data-loan-row="' + index + '" data-loan-field="interest" aria-label="利息" value="' + escapeHtml(yenAmountDisplay(row.interest)) + '"></td>' +
          '<td><input class="entry-memo" data-loan-id="' + escapeHtml(loan.id) +
            '" data-loan-row="' + index + '" data-loan-field="memo" aria-label="メモ" placeholder="メモ" value="' + escapeHtml(row.memo || '') + '"></td>' +
          '<td><button type="button" class="btn outline loan-paid-btn' + (paid ? ' is-paid' : '') +
            '" data-toggle-loan-paid="' + escapeHtml(loan.id) + '" data-toggle-loan-row="' + index +
            '">' + statusLabel + '</button>' + overrideNote + '</td>' +
          '<td><button type="button" class="btn-text danger" data-remove-loan-row="' + escapeHtml(loan.id) +
            '" data-remove-loan-row-index="' + index + '">削除</button></td>' +
        '</tr>'
      )
    }).join('')
    return (
      '<details class="entries-block"' + (openEntryPanels[loan.id] ? ' open' : '') + ' data-entries="' + escapeHtml(loan.id) + '">' +
        '<summary>月次返済 ' + rows.length + '件' +
          (rows.length ? ' · 支払日 ' + loan.payDay + '日' : '') +
          ' · 過去=済 / 未来=予定・未（切替可）</summary>' +
        '<div class="table-scroll loan-sched-scroll"><table class="year-grid loan-sched-grid">' +
          '<thead><tr><th>年月</th><th>返済額</th><th>元金</th><th>利息</th><th>メモ</th><th>済/未</th><th></th></tr></thead>' +
          '<tbody>' + (body || '<tr><td colspan="7">まだ返済予定がありません。</td></tr>') + '</tbody>' +
        '</table></div>' +
        '<form class="entry-add" data-add-loan-row="' + escapeHtml(loan.id) + '">' +
          '<div class="plain-field"><label class="yen-label">年月</label>' +
            '<input name="ym" required placeholder="YYYY-MM" pattern="\\d{4}-\\d{2}"></div>' +
          '<div class="plain-field"><label class="yen-label">返済額</label>' +
            '<input class="yen-amount" name="payment" inputmode="numeric" value="' + formatYen(0) + '"></div>' +
          '<div class="plain-field"><label class="yen-label">元金</label>' +
            '<input class="yen-amount" name="principal" inputmode="numeric" value="' + formatYen(0) + '"></div>' +
          '<div class="plain-field"><label class="yen-label">利息</label>' +
            '<input class="yen-amount" name="interest" inputmode="numeric" value="' + formatYen(0) + '"></div>' +
          '<div class="plain-field entry-memo"><label class="yen-label">メモ</label>' +
            '<input name="memo" placeholder="メモ"></div>' +
          '<button type="submit" class="btn outline">行を追加</button>' +
        '</form>' +
      '</details>'
    )
  }

  }

    dt.setMonth(dt.getMonth() + Math.round(months));

    return Math.round((t1 - t0) / 86400000);

      if (src.price === '' || src.price == null) price = null;
      else price = asFiniteNumber(src.price);

    item.maker = '';
    item.price = null;
    item.startDate = '';
    item.renewDate = '';
    // name / memo / cycleMonths / monthly kept for user to adjust

    persist();

    item.renewDate = '';
    item.monthly = 0;
    item.retired = true;

    persist();

    return true;

  function specialCycleYearsDisplay(months) {
    if (months == null || months === '') return '—';

  function specialYearsToMonths(yearsInput) {
    if (yearsInput === '' || yearsInput == null) return null;
    const y = asFiniteNumber(yearsInput);
    if (!Number.isFinite(y)) return null;
    return Math.round(y * 12);

  function maybeRecalcSpecialMonthly(item, changedField) {
    if (!item) return;
    if (changedField !== 'price' && changedField !== 'cycleMonths') return;
    const price = asFiniteNumber(item.price);
    const cycle = asFiniteNumber(item.cycleMonths);
    if (!(price > 0 && cycle > 0)) return;
    item.monthly = Math.round(price / cycle);
  }

  function setSpecialItemField(catId, itemId, field, value) {
    const cat = findSpecialCategory(catId);
    if (!cat) return;
    let item = null;
    if (itemId === 'housing-budget' || (state.special.housingBudgetItem && state.special.housingBudgetItem.id === itemId)) {
      item = state.special.housingBudgetItem;
    } else {
      item = findSpecialItem(cat, itemId);
    }
    if (!item) return;
    if (field === 'name') {
      const next = String(value || '').replace(/\s+/g, ' ').trim();
      if (!next) {
        flash('名称を入力してください。', 'warn');
        return;
      }
      item.name = next;
    } else if (field === 'maker') {
      item.maker = String(value == null ? '' : value);
    } else if (field === 'memo') {
      item.memo = String(value == null ? '' : value);
    } else if (field === 'startDate' || field === 'renewDate') {
      item[field] = String(value || '');
    } else if (field === 'cycleMonths') {
      if (value === '' || value == null) item.cycleMonths = null;
      else item.cycleMonths = Math.round(asFiniteNumber(value));
      maybeRecalcSpecialMonthly(item, 'cycleMonths');
    } else if (field === 'price') {
      if (value === '' || value == null) item.price = null;
      else item.price = asFiniteNumber(value);
      maybeRecalcSpecialMonthly(item, 'price');
    } else if (field === 'monthly') {
      item.monthly = Math.round(asFiniteNumber(value));
    }
    syncSpecialToAnnual();
    persist();
  }

  function updateSpecialItemFields(catId, itemId, fields) {
    const cat = findSpecialCategory(catId)
    if (!cat) return false
    let item = null
    if (itemId === 'housing-budget' || (state.special.housingBudgetItem && state.special.housingBudgetItem.id === itemId)) {
      item = state.special.housingBudgetItem
    } else {
      item = findSpecialItem(cat, itemId)
    }
    if (!item) return false
    const src = fields || {}
    if ('name' in src) {
      const next = String(src.name || '').replace(/\s+/g, ' ').trim()
      if (!next) {
        flash('名称を入力してください。', 'warn')
        return false
      }
      item.name = next
    }
    if ('maker' in src) item.maker = String(src.maker == null ? '' : src.maker)
    if ('memo' in src) item.memo = String(src.memo == null ? '' : src.memo)
    const startChanged = 'startDate' in src
    if (startChanged) item.startDate = String(src.startDate || '')
    if ('renewDate' in src) item.renewDate = String(src.renewDate || '')
    // history is display-only reference; preserve unless explicitly provided
    if ('history' in src) item.history = normalizeSpecialHistory(src.history)
    else if (!Array.isArray(item.history)) item.history = []
    if ('retired' in src) item.retired = src.retired === true
    else if (typeof item.retired !== 'boolean') item.retired = false
    let cycleChanged = false
    if ('cycleYears' in src) {
      item.cycleMonths = specialYearsToMonths(src.cycleYears)
      cycleChanged = true
    } else if ('cycleMonths' in src) {
      if (src.cycleMonths === '' || src.cycleMonths == null) item.cycleMonths = null
      else item.cycleMonths = Math.round(asFiniteNumber(src.cycleMonths))
      cycleChanged = true
    }
    // 開始日＋周期(年)から更新日を自動（開始日か周期が変わったとき、または更新日が空のとき）
    const autoRenew = computeSpecialRenewDate(item.startDate, item.cycleMonths)
    if (autoRenew && (startChanged || cycleChanged || !String(item.renewDate || '').trim())) {
      item.renewDate = autoRenew
    }
    const priceChanged = 'price' in src
    if (priceChanged) {
      if (src.price === '' || src.price == null) item.price = null
      else item.price = asFiniteNumber(src.price)
    }
    if ('monthly' in src && !(src.monthly === '' || src.monthly == null)) {
      item.monthly = Math.round(asFiniteNumber(src.monthly))
    } else {
      // no monthly input → always recalc from price ÷ cycleMonths
      maybeRecalcSpecialMonthly(item, priceChanged ? 'price' : 'cycleMonths')
    }
    syncSpecialToAnnual()
    persist()
    return true
  }

  function addSpecialItem(catId, payload) {
    const cat = findSpecialCategory(catId);
    if (!cat) return false;
    if (cat.sync === 'plan' || cat.id === 'other') {
      flash('その他特別な支出は月計画と実績で管理します。項目は追加できません。', 'warn');
      return false;
    }
    if (!Array.isArray(cat.items)) cat.items = [];
    const used = {};
    cat.items.forEach(function (it) { if (it && it.id) used[it.id] = true; });
    let renewDate = payload.renewDate;
    const autoRenew = computeSpecialRenewDate(payload.startDate, payload.cycleMonths);
    if (autoRenew && !String(renewDate || '').trim()) renewDate = autoRenew;
    const item = normalizeSpecialItem({
      name: payload.name,
      memo: payload.memo,
      cycleMonths: payload.cycleMonths,
      price: payload.price,
      monthly: payload.monthly,
      renewDate: renewDate,
      startDate: payload.startDate,
      maker: payload.maker,
      history: payload.history,
    }, cat.id, cat.items.length, used);
    if (payload.monthly === '' || payload.monthly == null) {
      maybeRecalcSpecialMonthly(item, 'price');
    }
    cat.items.push(item);
    syncSpecialToAnnual();
    persist();
    flash(item.name + 'を追加しました。', 'ok');
    return true;
  }

  function specialDueSoonHtml(special) {
    const data = special && Array.isArray(special.categories) ? special : null;
    if (!data) return '';
    const housing = data.housingBudgetItem || null;
    const rows = [];
    (data.categories || []).forEach(function (cat) {
      (cat && cat.items ? cat.items : []).forEach(function (item) {
        if (!item || item === housing) return;
        if (item.role === 'budget' || item.id === 'housing-budget') return;
        if (isSpecialItemRetired(item)) return;
        const diff = specialRenewDayDiff(item.renewDate);
        if (diff == null || diff > 30) return;
        const info = specialDaysLeftInfo(item.renewDate);
        rows.push({ category: cat.label || '', name: item.name || '', diff: diff, text: info.text, cls: info.cls || '' });
      });
    });
    if (!rows.length) return '';
    rows.sort(function (a, b) { return a.diff - b.diff; });
    const lis = rows.map(function (row) {
      const cls = row.cls ? ' class="days ' + row.cls + '"' : ' class="days"';
      const label = row.category ? row.category + ' / ' : '';
      return '<li><span class="name">' + escapeHtml(label + row.name) + '</span><span' + cls + '>' + escapeHtml(row.text) + '</span></li>';
    }).join('');
    return (
      '<div class="special-due-soon" role="status">' +
        '<p class="special-due-label">あと30日以内・経過</p>' +
        '<ul>' + lis + '</ul>' +

  function socialMfMidNames() {
    const set = {}
    SOCIAL_CATALOG.forEach(function (cat) {
      if (cat && cat.name) set[cat.name] = true
    })
    return set
  }

  function mapSocialMfTarget(mid, memo) {
    const m = String(mid == null ? '' : mid).trim()
    // MF mid「その他交際費」(alias「その他」): always person/item「その他」; memo ignored
    if (m === 'その他交際費' || m === 'その他') {
      const people = socialActivePeople(state && state.social ? state.social.people : [])
      let person = null
      people.forEach(function (row) {
        if (!row) return
        if (row.id === 'other' || String(row.label || '').trim() === 'その他') person = row
      })
      if (!person) return 'unknown'
      const item = findSocialItemByName(person, 'その他')
      if (!item) return 'unknown-mid'
      return { personId: person.id, itemId: item.id }
    }
    const midOk = !!socialMfMidNames()[m]
    if (!midOk) return 'unknown-mid'
    const t = String(memo == null ? '' : memo).trim()
    if (!t) return 'empty'
    const people = socialActivePeople(state && state.social ? state.social.people : [])
    let person = null
    people.forEach(function (row) {
      if (row && String(row.label || '').trim() === t) person = row
    })
    if (!person) return 'unknown'
    const item = findSocialItemByName(person, m)
    if (!item) return 'unknown-mid'
    return { personId: person.id, itemId: item.id }
  }

  function parseCsvLine(line) {
    const out = []
    let cur = ''
    let inQuotes = false
    for (let i = 0; i < line.length; i++) {
      const ch = line[i]
      if (inQuotes) {
        if (ch === '"') {
          if (line[i + 1] === '"') {
            cur += '"'
            i++
          } else {
            inQuotes = false
          }
        } else {
          cur += ch
        }
      } else if (ch === '"') {
        inQuotes = true
      } else if (ch === ',') {
        out.push(cur)
        cur = ''
      } else {
        cur += ch
      }
    }
    out.push(cur)
    return out
  }

  function mapVehicleMfMid(mid) {
    const key = String(mid == null ? '' : mid).trim()
    if (VEHICLE_MF_MID_MAP[key]) return VEHICLE_MF_MID_MAP[key]
    return 'その他'
  }

  function parseMfCsvDateParts(rawDate) {
    const t = String(rawDate == null ? '' : rawDate).trim()
    const full = t.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/)
    if (full) {
      const y = Number(full[1])
      const m = Number(full[2])
      const d = Number(full[3])
      const ymd = y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0')
      const ym = y + '-' + String(m).padStart(2, '0')
      if (parseIsoDate(ymd)) {
        return { ym: ym, compareYmd: ymd, hasDay: true }
      }
    }
    const ymOnly = t.match(/^(\d{4})[\/\-.](\d{1,2})$/)
    if (ymOnly) {
      const month = Number(ymOnly[2])
      if (month >= 1 && month <= 12) {
        const ym = ymOnly[1] + '-' + String(month).padStart(2, '0')
        return { ym: ym, compareYmd: ym + '-01', hasDay: false }
      }
    }
    return null
  }

  // Vehicle ownership match: first car in state.vehicles whose inclusive start–end
  // contains the CSV date (empty end = still owned / open-ended).
  function findVehicleContainingDate(ymd) {
    const parsed = parseIsoDate(ymd)
    if (!parsed) return null
    const vehicles = state && state.vehicles ? state.vehicles : []
    for (let i = 0; i < vehicles.length; i++) {
      const car = vehicles[i]
      if (!car) continue
      if (dateInWindow(parsed.y, parsed.m, parsed.d, car.start || '', car.end || '')) {
        return car
      }
    }
    return null
  }

  function mergeOrAddVehicleEntry(entries, date, amount, memo) {
    const ym = normalizeYm(date) || String(date || '').trim()
    if (!ym) return Array.isArray(entries) ? normalizeEntries(entries) : []
    const next = Array.isArray(entries) ? entries.slice() : []
    let found = null
    next.forEach(function (row) {
      if (row && row.date === ym) found = row
    })
    const addAmt = Math.round(asFiniteNumber(amount))
    const incoming = normalizeMemo(memo)
    if (found) {
      found.amount = Math.round(asFiniteNumber(found.amount) + addAmt)
      const existing = normalizeMemo(found.memo)
      if (incoming) {
        if (!existing) found.memo = incoming
        else if (existing.indexOf(incoming) < 0) {
          const joined = existing + '／' + incoming
          found.memo = joined.length > 120 ? existing : joined
        }
      }
    } else {
      next.push({
        date: ym,
        amount: addAmt,
        memo: incoming || '',
      })
    }
    return normalizeEntries(next)
  }

  function educationPersonMatchLabels(person) {
    const out = []
    const seen = {}
    function add(v) {
      const t = String(v == null ? '' : v).trim()
      if (!t || seen[t]) return
      seen[t] = true
      out.push(t)
    }
    if (!person) return out
    add(stripSoftDeletedSuffix(person.label))
    const id = String(person.id || '')
    if (id === 'natsu') add('なつ')
    if (id === 'kazuharu' || person.label === 'かず' || person.label === '一春') {
      add('かず')
      add('一春')
    }
    return out
  }

  function findEducationPersonByMfLabel(label) {
    const want = String(label == null ? '' : label).trim()
    if (!want) return null
    let found = null
    const people = state && state.education ? state.education.people : []
    ;(people || []).forEach(function (person) {
      if (!person || isSoftDeleted(person)) return
      if (educationPersonMatchLabels(person).indexOf(want) !== -1) found = person
    })
    return found
  }

  function mapEducationMfTarget(mid, content) {
    const m = String(mid == null ? '' : mid).trim()
    if (!m) return 'unknown-mid'
    // Daily: mid = 雑費 + person label (e.g. 雑費なつ). Ignore 内容.
    if (m.indexOf('雑費') === 0) {
      const personLabel = m.slice('雑費'.length)
      if (!personLabel) return 'unknown-mid'
      const person = findEducationPersonByMfLabel(personLabel)
      if (!person) return 'unknown-mid'
      const item = findEducationDailyItem(person)
      if (!item) return { personId: person.id, itemId: '__daily__' }
      return { personId: person.id, itemId: item.id }
    }
    // Purpose: mid equals person's current label (かず also accepts 一春). 内容 = item name.
    const person = findEducationPersonByMfLabel(m)
    if (!person) return 'unknown-mid'
    const contentT = String(content == null ? '' : content).trim()
    if (!contentT) return 'empty'
    const item = findEducationItemByName(person, contentT)
    if (!item) return 'unknown'
    return { personId: person.id, itemId: item.id }
  }

  // Shown on 年間予定 only. No tab. normalizeVehicleItem still drops a vehicle line named ガソリン.
  // Only 5 MF 大項目 are imported: 自動車, 教養・教育, 趣味・娯楽, 特別な支出 (中項目「その他特別な支出」only), 交際費.
  // Every other 大項目 row is skipped silently (counted in skippedOtherBig, no error).
  function parseMfCsvText(text) {
    const raw = String(text || '').replace(/^\uFEFF/, '')
    const lines = raw.split(/\r?\n/).filter(function (line) { return line.trim().length })
    if (!lines.length) return { ok: false, reason: 'empty' }
    const header = parseCsvLine(lines[0]).map(function (h) { return h.trim() })
    const need = ['計算対象', '日付', '金額（円）', '大項目', '中項目', '振替']
    const idx = {}
    need.forEach(function (name) {
      idx[name] = header.indexOf(name)
    })
    if (need.some(function (name) { return idx[name] < 0 })) {
      return { ok: false, reason: 'headers' }
    }
    const memoIdx = header.indexOf('メモ')
    const contentIdx = header.indexOf('内容')
    const eduByKey = {}
    const hobbyByKey = {}
    const vehicleByKey = {}
    const specialOtherByYm = {}
    let skippedCalc = 0
    let skippedUnknownEdu = 0
    let skippedUnknownHobby = 0
    let skippedNoVehicle = 0
    let skippedMfOff = 0
    let skippedOtherBig = 0
    let eduRows = 0
    const eduEmptyContentMonths = {}
    const eduUnknownContentMonths = {}
    let eduEmptyContentCount = 0
    let eduUnknownContentCount = 0
    let hobbyRows = 0
    let autoRows = 0
    let specialOtherRows = 0
    const socialByKey = {}
    let socialRows = 0
    const socialEmptyMemoMonths = {}
    const socialUnknownMemoMonths = {}
    const socialUnknownMidMonths = {}
    let socialEmptyMemoCount = 0
    let socialUnknownMemoCount = 0
    let socialUnknownMidCount = 0
    const targetYear = String(state && state.activeYear != null ? state.activeYear : '')
    let skippedWrongYear = 0

    function truthyFlag(value) {
      const t = String(value == null ? '' : value).trim().toLowerCase()
      return t === '1' || t === 'true' || t === 'yes'
    }
    function falsyCalc(value) {
      const t = String(value == null ? '' : value).trim().toLowerCase()
      return t === '0' || t === 'false' || t === 'no'
    }
    function parseAmount(rawAmt) {
      const n = Number(String(rawAmt == null ? '' : rawAmt).replace(/,/g, '').trim())
      if (!Number.isFinite(n)) return 0
      return Math.abs(Math.round(n))
    }
    function parseYmFromDate(rawDate) {
      const t = String(rawDate == null ? '' : rawDate).trim()
      const m = t.match(/^(\d{4})[\/\-.](\d{1,2})/)
      if (!m) return ''
      const month = Number(m[2])
      if (month < 1 || month > 12) return ''
      return m[1] + '-' + String(month).padStart(2, '0')
    }
    function bump(bucket, key, ym, amount, memo) {
      if (!bucket[key]) bucket[key] = {}
      if (!bucket[key][ym]) bucket[key][ym] = { amount: 0, memos: [] }
      bucket[key][ym].amount += amount
      if (memo) bucket[key][ym].memos.push(memo)
    }

    for (let i = 1; i < lines.length; i++) {
      const cols = parseCsvLine(lines[i])
      const calc = cols[idx['計算対象']]
      const xfer = cols[idx['振替']]
      if (falsyCalc(calc) || truthyFlag(xfer)) {
        skippedCalc++
        continue
      }
      const big = String(cols[idx['大項目']] || '').trim()
      const mid = String(cols[idx['中項目']] || '').trim()
      const amount = parseAmount(cols[idx['金額（円）']])
      const memo = memoIdx >= 0 ? normalizeMemo(cols[memoIdx]) : ''
      if (!amount) continue
      const ymEarly = parseYmFromDate(cols[idx['日付']])
      if (!ymEarly) continue
      if (targetYear && ymEarly.slice(0, 4) !== targetYear) {
        skippedWrongYear++
        continue
      }
      if (big === '特別な支出') {
        // Only 中項目「その他特別な支出」. Other 特別な支出 rows are skipped.
        if (mid === 'その他特別な支出') {
          if (!specialOtherByYm[ymEarly]) specialOtherByYm[ymEarly] = { amount: 0, memos: [] }
          specialOtherByYm[ymEarly].amount += amount
          specialOtherRows++
        } else {
          skippedOtherBig++
        }
      } else if (big === '教養・教育') {
        const ym = ymEarly
        if (!state.education) state.education = seedEducation()
        const content = contentIdx >= 0 ? String(cols[contentIdx] == null ? '' : cols[contentIdx]).trim() : ''
        const mapped = mapEducationMfTarget(mid, content)
        if (mapped === 'empty') {
          eduEmptyContentMonths[ym] = true
          eduEmptyContentCount++
        } else if (mapped === 'unknown') {
          eduUnknownContentMonths[ym] = true
          eduUnknownContentCount++
        } else if (mapped === 'unknown-mid') {
          skippedUnknownEdu++
        } else {
          bump(eduByKey, mapped.personId + '\t' + mapped.itemId, ym, amount, memo)
          eduRows++
        }
      } else if (big === '趣味・娯楽') {
        const ym = ymEarly
        if (!state.hobby) state.hobby = seedHobby()
        const content = contentIdx >= 0 ? String(cols[contentIdx] == null ? '' : cols[contentIdx]).trim() : ''
        const mapped = mapHobbyMfTarget(mid, memo, content)
        if (mapped === 'unknown-mid' || mapped === 'unknown') {
          skippedUnknownHobby++
        } else {
          bump(hobbyByKey, mapped, ym, amount, memo)
          hobbyRows++
        }
      } else if (big === '自動車') {
        const parts = parseMfCsvDateParts(cols[idx['日付']])
        if (!parts || !parts.ym) continue
        const car = findVehicleContainingDate(parts.compareYmd)
        if (!car) {
          skippedNoVehicle++
          continue
        }
        // mfImport defaults ON; when OFF, skip this date-matched car (no fallthrough).
        if (car.mfImport === false) {
          skippedMfOff++
          continue
        }
        const category = mapVehicleMfMid(mid)
        let name = memo
        if (!name) name = mid
        if (!name) name = 'MF CSV'
        const key = car.id + '\t' + category + '\t' + name
        bump(vehicleByKey, key, parts.ym, amount, memo)
        autoRows++
      } else if (big === '交際費' || big === '交際') {
        const ym = ymEarly
        const mapped = mapSocialMfTarget(mid, memo)
        if (mapped === 'empty') {
          socialEmptyMemoMonths[ym] = true
          socialEmptyMemoCount++
        } else if (mapped === 'unknown') {
          socialUnknownMemoMonths[ym] = true
          socialUnknownMemoCount++
        } else if (mapped === 'unknown-mid') {
          socialUnknownMidMonths[ym] = true
          socialUnknownMidCount++
        } else {
          bump(socialByKey, mapped.personId + '\t' + mapped.itemId, ym, amount, '')
          socialRows++
        }
      } else {
        // Not one of the 5 imported 大項目 (e.g. 食費, 保険, 住宅, 借入). Skip without error.
        skippedOtherBig++
      }
    }

    function monthCount(bucket) {
      let n = 0
      Object.keys(bucket).forEach(function (key) {
        n += Object.keys(bucket[key]).length
      })
      return n
    }

    function sortedMonthKeys(map) {
      return Object.keys(map || {}).sort()
    }
    return {
      ok: true,
      eduByKey: eduByKey,
      hobbyByKey: hobbyByKey,
      vehicleByKey: vehicleByKey,
      eduRows: eduRows,
      hobbyRows: hobbyRows,
      autoRows: autoRows,
      eduMonths: monthCount(eduByKey),
      hobbyMonths: monthCount(hobbyByKey),
      autoMonths: monthCount(vehicleByKey),
      specialOtherByYm: specialOtherByYm,
      specialOtherRows: specialOtherRows,
      specialOtherMonths: Object.keys(specialOtherByYm).length,
      skippedCalc: skippedCalc,
      skippedOtherBig: skippedOtherBig,
      skippedUnknown: skippedUnknownEdu + skippedUnknownHobby,
      skippedUnknownEdu: skippedUnknownEdu,
      skippedUnknownHobby: skippedUnknownHobby,
      eduEmptyContentMonths: sortedMonthKeys(eduEmptyContentMonths),
      eduUnknownContentMonths: sortedMonthKeys(eduUnknownContentMonths),
      eduEmptyContentCount: eduEmptyContentCount,
      eduUnknownContentCount: eduUnknownContentCount,
      skippedNoVehicle: skippedNoVehicle,
      skippedMfOff: skippedMfOff,
      socialByKey: socialByKey,
      socialRows: socialRows,
      socialMonths: monthCount(socialByKey),
      socialEmptyMemoMonths: sortedMonthKeys(socialEmptyMemoMonths),
      socialUnknownMemoMonths: sortedMonthKeys(socialUnknownMemoMonths),
      socialUnknownMidMonths: sortedMonthKeys(socialUnknownMidMonths),
      socialEmptyMemoCount: socialEmptyMemoCount,
      socialUnknownMemoCount: socialUnknownMemoCount,
      socialUnknownMidCount: socialUnknownMidCount,
      skippedWrongYear: skippedWrongYear,
      targetYear: targetYear,
    }
  }
  function replaceMonthEntries(entries, ym, amount, memo) {
    const list = Array.isArray(entries) ? entries : []
    let oldMemo = ''
    list.forEach(function (row) {
      if (row && row.date === ym) oldMemo = normalizeMemo(row.memo)
    })
    const incoming = normalizeMemo(memo)
    let merged = ''
    if (!incoming) merged = oldMemo || ''
    else if (!oldMemo) merged = incoming
    else if (oldMemo === incoming || oldMemo.indexOf(incoming) >= 0) merged = oldMemo
    else if (incoming.indexOf(oldMemo) >= 0) merged = incoming
    else merged = oldMemo + '／' + incoming
    const next = list.filter(function (row) {
      return !(row && row.date === ym)
    })
    next.push({
      date: ym,
      amount: Math.round(asFiniteNumber(amount)),
      memo: merged,
    })
    return normalizeEntries(next)
  }


  function applyMfCsvImport(parsed, mode) {
    if (!state.education) state.education = seedEducation()
    if (!state.hobby) state.hobby = seedHobby()
    if (!state.special) state.special = seedSpecial()
    if (!state.social) state.social = seedSocial()
    const importMode = mode || 'every'
    if (importMode === 'social') {
      Object.keys(parsed.socialByKey || {}).forEach(function (key) {
        const parts = key.split('\t')
        if (parts.length < 2) return
        const person = findSocialPerson(parts[0])
        if (!person || isSoftDeleted(person)) return
        const item = findSocialItem(person, parts[1])
        if (!item) return
        Object.keys(parsed.socialByKey[key]).forEach(function (ym) {
          const pack = parsed.socialByKey[key][ym]
          item.entries = replaceMonthEntries(item.entries, ym, pack.amount, '')
        })
      })
      persist()
      return
    }
    if (importMode === 'special') {
      const cat = findSpecialCategory('other')
      if (cat) {
        cat.sync = 'plan'
        cat.items = []
        if (!Array.isArray(cat.entries)) cat.entries = []
        Object.keys(parsed.specialOtherByYm || {}).forEach(function (ym) {
          const pack = parsed.specialOtherByYm[ym]
          cat.entries = replaceMonthEntries(cat.entries, ym, pack.amount, '')
        })
        syncSpecialToAnnual()
      }
      persist()
      return
    }
    if (importMode === 'edu') {
      Object.keys(parsed.eduByKey || {}).forEach(function (key) {
        const parts = key.split('\t')
        if (parts.length < 2) return
        const person = findEducationPerson(parts[0])
        if (!person || isSoftDeleted(person)) return
        let item = null
        if (parts[1] === '__daily__') {
          item = findEducationDailyItem(person)
          if (!item) {
            item = {
              id: person.id + '-daily',
              name: educationDailyItemName(person),
              role: 'daily',
              plan: 0,
              entries: [],
            }
            if (!Array.isArray(person.items)) person.items = []
            person.items.unshift(item)
          }
        } else {
          item = findEducationItem(person, parts[1])
        }
        if (!item) return
        Object.keys(parsed.eduByKey[key]).forEach(function (ym) {
          const pack = parsed.eduByKey[key][ym]
          const memo = pack.memos && pack.memos.length ? pack.memos.slice(0, 3).join('／') : ''
          item.entries = replaceMonthEntries(item.entries, ym, pack.amount, memo)
        })
      })
      persist()
      return
    }
    if (importMode === 'hobby') {
      Object.keys(parsed.hobbyByKey || {}).forEach(function (catId) {
        let cat = findHobbyCategory(catId)
        if (!cat) {
          const cats = state.hobby.categories || []
          const def = HOBBY_CATALOG.filter(function (row) { return row && row.id === catId })[0]
          cats.forEach(function (row) {
            if (!row || cat) return
            if (row.id === catId || row.label === catId) cat = row
            else if (def && hobbyMidLabelOf(row) === def.midLabel) cat = row
            else if (def && hobbyMidLabelOf(row) === def.midLabel && hobbyPersonOf(row) === (def.person || null)) cat = row
          })
          if (!cat && def) {
            ensureHobbyCategoriesForMfMid(def.midLabel)
            cat = findHobbyCategory(def.id)
            if (!cat) {
              ;(state.hobby.categories || []).forEach(function (row) {
                if (!row || cat) return
                if (hobbyMidLabelOf(row) === def.midLabel) cat = row
              })
            }
          }
        }
        if (!cat) return
        if (isSoftDeleted(cat)) {
          cat.deleted = false
          cat.label = stripSoftDeletedSuffix(cat.label) || cat.label
        }
        Object.keys(parsed.hobbyByKey[catId]).forEach(function (ym) {
          const pack = parsed.hobbyByKey[catId][ym]
          cat.entries = replaceMonthEntries(cat.entries, ym, pack.amount, '')
        })
      })
      if (Object.keys(parsed.hobbyByKey || {}).length) syncHobbyToAnnual()
      persist()
      return
    }
    if (importMode === 'auto') {
      const vehicleTouched = {}
      Object.keys(parsed.vehicleByKey || {}).forEach(function (key) {
        const parts = key.split('\t')
        if (parts.length < 3) return
        const carId = parts[0]
        const category = parts[1]
        const name = parts.slice(2).join('\t')
        const car = findVehicle(carId)
        if (!car) return
        if (!Array.isArray(car.items)) car.items = []
        let item = null
        car.items.forEach(function (row) {
          if (row && row.category === category && row.name === name) item = row
        })
        if (!item) {
          item = {
            id: nextVehicleItemId(car),
            name: name,
            category: category || 'その他',
            total: 0,
            count: 0,
            avg: 0,
            entries: [],
          }
          car.items.push(item)
        }
        Object.keys(parsed.vehicleByKey[key]).forEach(function (ym) {
          const pack = parsed.vehicleByKey[key][ym]
          const memo = pack.memos && pack.memos.length ? pack.memos.slice(0, 3).join('／') : ''
          item.entries = replaceMonthEntries(item.entries, ym, pack.amount, memo)
        })
        applyItemDerived(item)
        vehicleTouched[carId] = car
      })
      Object.keys(vehicleTouched).forEach(function (carId) {
        applyVehicleDerived(vehicleTouched[carId])
      })
      if (Object.keys(vehicleTouched).length) syncVehiclesToAnnual()
      persist()
      return
    }
    // Unknown mode: nothing is imported.
  }

  function wireMfCsvButton(buttonId, fileId, mode) {
    const btn = document.getElementById(buttonId)
    const file = document.getElementById(fileId)
    if (!btn || !file) return
    const importMode = mode || 'all'
    btn.addEventListener('click', function () { file.click() })
    file.addEventListener('change', function (event) {
      const picked = event.target.files && event.target.files[0]
      event.target.value = ''
      if (!picked) return
      const reader = new FileReader()
      reader.onload = function () { importMfCsvFromText(String(reader.result || ''), importMode) }
      reader.onerror = function () { flash('このCSVは読み取れませんでした。', 'warn') }
      reader.readAsText(picked, 'UTF-8')
    })
  }


  function educationItemSpent(item) {
    return sumEntriesForYear(item && item.entries)
  }

  function educationPersonPlan(person) {
    let sum = 0
    ;(person && person.items ? person.items : []).forEach(function (item) {
      if (item && item.name !== '計') sum += asFiniteNumber(item.plan)
    })
    return sum
  }

  function educationPersonSpent(person) {
    let sum = 0
    ;(person && person.items ? person.items : []).forEach(function (item) {
      if (item && item.name !== '計') sum += educationItemSpent(item)
    })
    return sum
  }

  function educationPlanTotal(edu) {
    let sum = 0
    ;(edu && edu.people ? edu.people : []).forEach(function (person) {
      sum += educationPersonPlan(person)
    })
    return sum
  }

  function educationSpentTotal(edu) {
    let sum = 0
    ;(edu && edu.people ? edu.people : []).forEach(function (person) {
      sum += educationPersonSpent(person)
    })
    return sum
  }

  function educationPerYear(edu) {
    const years = asFiniteNumber(edu && edu.planYears)
    return years > 0 ? educationPlanTotal(edu) / years : 0
  }

  function educationPerMonth(edu) {
    return educationPerYear(edu) / 12
  }

  function educationMatrixRows(edu) {
    const rows = []
    const seen = {}
    EDUCATION_CATALOG.forEach(function (cat) {
      if (!cat || isEducationDailyName(cat.name)) return
      seen[cat.name] = true
      rows.push({ id: cat.id, name: cat.name })
    })
    ;(edu && edu.people ? edu.people : []).forEach(function (person) {
      ;(person.items || []).forEach(function (item) {
        if (!item || !item.name || item.name === '計' || seen[item.name]) return
        seen[item.name] = true
        rows.push({ id: item.id, name: item.name })
      })
    })
    return rows
  }

  function findEducationItemByName(person, name) {
    let found = null
    ;(person && person.items ? person.items : []).forEach(function (item) {
      if (item && item.name === name) found = item
    })
    return found
  }

  function educationDailyItemName(personOrLabel) {
    const label = typeof personOrLabel === 'string'
      ? personOrLabel
      : (personOrLabel && personOrLabel.label != null ? personOrLabel.label : '')
    const base = stripSoftDeletedSuffix(String(label == null ? '' : label).trim())
    return '雑費' + (base || '')
  }

  function isEducationDailyName(name) {
    const n = String(name == null ? '' : name).trim()
    return n === '雑費' || n.indexOf('雑費') === 0
  }

  function isEducationDailyItem(item) {
    if (!item) return false
    if (item.role === 'daily' || item.kind === 'daily') return true
    if (item.role === 'purpose' || item.kind === 'purpose' || item.kind === 'saving') return false
    const id = String(item.id || '')
    return isEducationDailyName(item.name) || id === 'zappi' || id.endsWith('-zappi')
  }

  function findEducationDailyItem(person) {
    let found = null
    ;(person && person.items ? person.items : []).forEach(function (item) {
      if (isEducationDailyItem(item)) found = item
    })
    return found
  }

  function isEducationDailyRow(row, edu) {
    if (!row) return false
    if (row.id === 'zappi' || isEducationDailyName(row.name)) return true
    let daily = false
    ;(edu && edu.people ? edu.people : []).forEach(function (person) {
      const item = findEducationItemByName(person, row.name)
      if (item && isEducationDailyItem(item)) daily = true
    })
    return daily
  }

  function isEducationLicenseName(name) {
    return name === '免許'
  }

  function educationGroupedRows(edu) {
    const daily = []
    const saving = []
    educationMatrixRows(edu).forEach(function (row) {
      if (isEducationDailyRow(row, edu)) daily.push(row)
      else saving.push(row)
    })
    return [
      { id: 'daily', label: '日常的な支出', subtotalLabel: '日常計', rows: daily },
      { id: 'saving', label: '目的別の貯金枠', subtotalLabel: '貯金枠計', rows: saving },
    ]
  }

  function educationNamePlan(person, name) {
    const item = findEducationItemByName(person, name)
    return item ? asFiniteNumber(item.plan) : 0
  }

  function educationRowsPlanForPerson(person, rows) {
    let sum = 0
    ;(rows || []).forEach(function (row) { sum += educationNamePlan(person, row.name) })
    return sum
  }

  function educationRowsPlanTotal(people, rows) {
    let sum = 0
    ;(people || []).forEach(function (person) { sum += educationRowsPlanForPerson(person, rows) })
    return sum
  }

  function educationPersonKind(person) {
    if (!person) return 'both'
    if (person.kind === 'child' || person.kind === 'grandchild' || person.kind === 'both') return person.kind
    const id = String(person.id || '')
    const label = String(person.label || '')
    if (id === 'natsu' || id === 'kazuharu' || label === 'なつ' || label === '一春' || label === 'かず') return 'child'
    if (id.indexOf('mago') === 0 || label.indexOf('孫') === 0) return 'grandchild'
    return 'both'
  }

  function educationPersonShowsGroup(person, groupId) {
    const kind = educationPersonKind(person)
    if (kind === 'both' || kind === 'child') return true
    if (kind === 'grandchild') return groupId === 'saving'
    return true
  }

  function educationPersonShowsItem(person, name) {
    const kind = educationPersonKind(person)
    if (kind === 'grandchild') {
      const item = findEducationItemByName(person, name)
      if (item) return !isEducationDailyItem(item)
      return !isEducationDailyName(name)
    }
    return true
  }

  function educationItemHasEntries(item) {
    return !!(item && Array.isArray(item.entries) && item.entries.length)
  }

  function educationPersonShowsAmount(person, name) {
    if (!educationPersonShowsItem(person, name)) return false
    // v103: existing items always show (plan 0 still editable / entry-ready)
    return !!findEducationItemByName(person, name)
  }

  function educationPeopleForGroup(people, groupId) {
    return (people || []).filter(function (person) {
      return educationPersonShowsGroup(person, groupId)
    })
  }

  function educationPeopleOfKinds(people, kinds) {
    return (people || []).filter(function (person) {
      return kinds.indexOf(educationPersonKind(person)) !== -1
    })
  }

  function educationVisibleRowsForPeople(people, rows, editMode) {
    // v103 edit: row appears if any person has the item; cells stay gated per-person below
    return (rows || []).filter(function (row) {
      return (people || []).some(function (person) {
        if (editMode) {
          if (!educationPersonShowsItem(person, row.name)) return false
          return !!findEducationItemByName(person, row.name)
        }
        return educationPersonShowsAmount(person, row.name)
      })
    })
  }

  function educationRowsVisiblePlanForPerson(person, rows) {
    let sum = 0
    ;(rows || []).forEach(function (row) {
      if (!educationPersonShowsItem(person, row.name)) return
      sum += educationNamePlan(person, row.name)
    })
    return sum
  }

  function educationRowsVisiblePlanTotal(people, rows) {
    let sum = 0
    ;(people || []).forEach(function (person) {
      sum += educationRowsVisiblePlanForPerson(person, rows)
    })
    return sum
  }

  function educationSplitAmount(amount, years) {
    const y = asFiniteNumber(years)
    const year = y > 0 ? amount / y : 0
    return {
      year: year,
      month: year / 12,
    }
  }

  function educationDerivedHtml(amount, years) {
    const split = educationSplitAmount(amount, years)
    return (
      '<span class="edu-derived">年 ' + formatYen(split.year) + '</span>' +
      '<span class="edu-derived">月 ' + formatYen(split.month) + '</span>'
    )
  }

  function educationPersonVisiblePlan(person) {
    let sum = 0
    ;(person && person.items ? person.items : []).forEach(function (item) {
      if (!item || item.name === '計') return
      if (!educationPersonShowsItem(person, item.name)) return
      sum += asFiniteNumber(item.plan)
    })
    return sum
  }

  function educationPersonVisibleSpent(person) {
    let sum = 0
    ;(person && person.items ? person.items : []).forEach(function (item) {
      if (!item || item.name === '計') return
      if (!educationPersonShowsItem(person, item.name)) return
      sum += educationItemSpent(item)
    })
    return sum
  }

  function educationVisiblePlanTotal(edu) {
    let sum = 0
    ;(edu && edu.people ? edu.people : []).forEach(function (person) {
      sum += educationPersonVisiblePlan(person)
    })
    return sum
  }

  function educationVisibleSpentTotal(edu) {
    let sum = 0
    ;(edu && edu.people ? edu.people : []).forEach(function (person) {
      sum += educationPersonVisibleSpent(person)
    })
    return sum
  }

  function educationRowsVisibleSpentForPerson(person, rows) {
    let sum = 0
    ;(rows || []).forEach(function (row) {
      if (!educationPersonShowsItem(person, row.name)) return
      const item = findEducationItemByName(person, row.name)
      sum += educationItemSpent(item)
    })
    return sum
  }

  function educationRowsVisibleSpentTotal(people, rows) {
    let sum = 0
    ;(people || []).forEach(function (person) {
      sum += educationRowsVisibleSpentForPerson(person, rows)
    })
    return sum
  }

  function educationVisibleGroupTotals(edu) {
    const groups = educationGroupedRows(edu)
    const people = edu && edu.people ? edu.people : []
    const active = educationActivePeople(people)
    function pack(rows) {
      const plan = educationRowsVisiblePlanTotal(active, rows)
      const spent = educationRowsVisibleSpentTotal(people, rows)
      return { plan: plan, spent: spent, remain: plan - spent }
    }
    const daily = pack(groups[0] ? groups[0].rows : [])
    const saving = pack(groups[1] ? groups[1].rows : [])
    return {
      daily: daily,
      saving: saving,
      total: {
        plan: daily.plan + saving.plan,
        spent: daily.spent + saving.spent,
        remain: daily.remain + saving.remain,
      },
    }
  }

  function educationPersonGroupTotals(person, groups) {
    return (groups || []).map(function (group) {
      const visibleRows = educationVisibleRowsForPeople([person], group.rows)
      const show = educationPersonShowsGroup(person, group.id) && visibleRows.length > 0
      const plan = show ? educationRowsVisiblePlanForPerson(person, visibleRows) : 0
      const spent = show ? educationRowsVisibleSpentForPerson(person, visibleRows) : 0
      return {
        id: group.id,
        label: group.label,
        short: group.id === 'daily' ? '日常' : '目的別',
        show: show,
        plan: plan,
        spent: spent,
        remain: plan - spent,
      }
    })
  }

  // 詳細タブ → 年間予算の共通パイプライン（車両のみ）。
  // 教養・教育と趣味・娯楽は常時同期のため、ここでは登録しない。
  const ANNUAL_REFLECT_SOURCES = []

  function registerAnnualReflectSource(source) {
    if (!source || !source.id) return
    ANNUAL_REFLECT_SOURCES.push(source)
  }

  function educationPersonByKeys(people, ids, labels) {
    let found = null
    ;(people || []).forEach(function (person) {
      if (!person) return
      if (ids.indexOf(person.id) !== -1 || labels.indexOf(person.label) !== -1) found = person
    })
    return found
  }

  const EDUCATION_ANNUAL_DAILY = {
    'edu-natsu': { personIds: ['natsu'], labels: ['なつ'] },
    'edu-kazu': { personIds: ['kazuharu'], labels: ['かず', '一春'] },
  }
  const EDUCATION_ANNUAL_SAVING_ID = 'edu-saving'
  const EDUCATION_ANNUAL_SAVING_LABEL = '祝い目的別'
  let educationAnnualSyncing = false

  function isEducationAnnualReadonly(itemId) {
    return isEducationAnnualLinkedId(itemId)
  }

  function educationPersonByAnnualItemId(itemId) {
    if (!itemId || !state.education) return null
    let found = null
    ;(state.education.people || []).forEach(function (person) {
      if (!person || isSoftDeleted(person) || educationPersonKind(person) === 'grandchild') return
      const daily = findEducationDailyItem(person)
      if (daily && daily.annualItemId === itemId) found = person
    })
    return found
  }

  function isEducationAnnualDailyId(itemId) {
    if (!itemId) return false
    if (EDUCATION_ANNUAL_DAILY[itemId]) return true
    return !!educationPersonByAnnualItemId(itemId)
  }

  function isEducationAnnualLinkedId(itemId) {
    return isEducationAnnualDailyId(itemId) || itemId === EDUCATION_ANNUAL_SAVING_ID
  }

  function educationAnnualItemIdForPerson(person) {
    if (!person || isSoftDeleted(person)) return ''
    const daily = findEducationDailyItem(person)
    if (daily && daily.annualItemId) return daily.annualItemId
    const id = String(person.id || '')
    const label = String(person.label || '')
    if (id === 'natsu' || label === 'なつ') return 'edu-natsu'
    if (id === 'kazuharu' || label === 'かず' || label === '一春') return 'edu-kazu'
    return ''
  }

  function educationPersonForAnnualItem(itemId) {
    const byLink = educationPersonByAnnualItemId(itemId)
    if (byLink && !isSoftDeleted(byLink)) return byLink
    const spec = EDUCATION_ANNUAL_DAILY[itemId]
    if (!spec || !state.education) return null
    const person = educationPersonByKeys(state.education.people, spec.personIds, spec.labels)
    if (person && isSoftDeleted(person)) return null
    return person
  }

  function allocateEducationAnnualItemId(label) {
    const fixed = educationFixedDailyIdForLabel(label)
    if (fixed) return fixed
    const used = {}
    Object.keys(state.years || {}).forEach(function (key) {
      const data = state.years[key]
      listItemIds(data && data.groups ? data.groups : []).forEach(function (id) { used[id] = true })
    })
    ;(state.education && state.education.people ? state.education.people : []).forEach(function (person) {
      const daily = findEducationDailyItem(person)
      if (daily && daily.annualItemId) used[daily.annualItemId] = true
    })
    Object.keys(EDUCATION_ANNUAL_DAILY).forEach(function (id) { used[id] = true })
    used[EDUCATION_ANNUAL_SAVING_ID] = true
    const group = findGroup(yearData(), 'education') || { id: 'education' }
    let n = 1
    let id = group.id + '-item-' + n
    while (used[id]) {
      n += 1
      id = group.id + '-item-' + n
    }
    return id
  }

  function educationLinkedDailyPack(edu, year) {
    const zero = splitYearAcrossMonths(0)
    const out = {}
    if (!edu) return out
    const inWindow = yearOverlapsWindow(year, edu.start, edu.end)
    const groups = educationGroupedRows(edu)
    const dailyRows = groups[0] ? groups[0].rows : []
    const years = asFiniteNumber(edu.planYears)
    ;(edu.people || []).forEach(function (person) {
      if (!person || isSoftDeleted(person) || educationPersonKind(person) === 'grandchild') return
      const daily = findEducationDailyItem(person)
      if (!daily) return
      let annualId = daily.annualItemId || educationAnnualItemIdForPerson(person)
      if (!annualId) return
      if (!daily.annualItemId) daily.annualItemId = annualId
      const yearAmt = inWindow && years > 0
        ? educationRowsVisiblePlanForPerson(person, dailyRows) / years
        : 0
      out[annualId] = splitYearAcrossMonths(yearAmt)
    })
    // keep fixed keys present for fillers that expect them
    if (!out['edu-natsu']) out['edu-natsu'] = zero
    if (!out['edu-kazu']) out['edu-kazu'] = zero
    return out
  }

  function educationReflectMonths(edu, year) {
    return educationLinkedDailyPack(edu, year)
  }

  function educationPurposeYearAmount(edu) {
    if (!edu) return 0
    const groups = educationGroupedRows(edu)
    const savingRows = groups[1] ? groups[1].rows : []
    const years = asFiniteNumber(edu.planYears)
    if (years <= 0) return 0
    return educationRowsVisiblePlanTotal(educationActivePeople(edu.people || []), savingRows) / years
  }

  function educationPurposeMismatch(edu, data) {
    return null
  }

  function educationPurposeMismatchBannerHtml(edu, data) {
    return ''
  }

  function educationAnnualLabelForItem(itemId) {
    if (itemId === EDUCATION_ANNUAL_SAVING_ID) return EDUCATION_ANNUAL_SAVING_LABEL
    const person = educationPersonForAnnualItem(itemId)
    if (person && person.label) return educationDailyItemName(person)
    if (itemId === 'edu-natsu') return educationDailyItemName('なつ')
    if (itemId === 'edu-kazu') return educationDailyItemName('かず')
    return itemId
  }

  function educationFixedDailyIdForLabel(label) {
    let name = String(label == null ? '' : label).trim()
    if (name.indexOf('雑費') === 0 && name.length > ('雑費').length) name = name.slice(('雑費').length)
    if (name === 'なつ') return 'edu-natsu'
    if (name === 'かず' || name === '一春') return 'edu-kazu'
    return ''
  }


  function ensureEducationPersonForAnnualDaily(annualId, label) {
    if (!state.education) state.education = seedEducation()
    if (!Array.isArray(state.education.people)) state.education.people = []
    let person = educationPersonForAnnualItem(annualId)
    let resolvedLabel = String(label || '').trim()
    // Annual mid-style 雑費X → person label X
    if (resolvedLabel.indexOf('雑費') === 0 && resolvedLabel.length > ('雑費').length) {
      resolvedLabel = resolvedLabel.slice(('雑費').length)
    }
    if (!resolvedLabel) {
      if (annualId === 'edu-natsu') resolvedLabel = 'なつ'
      else if (annualId === 'edu-kazu') resolvedLabel = 'かず'
      else resolvedLabel = '日常'
    }
    if (!person) {
      let id
      if (annualId === 'edu-natsu') id = 'natsu'
      else if (annualId === 'edu-kazu') id = 'kazuharu'
      else id = nextEducationPersonId(resolvedLabel)
      person = { id: id, label: resolvedLabel, kind: 'child', items: [] }
      state.education.people.push(person)
    } else if (resolvedLabel) {
      person.label = resolvedLabel
    }
    if (!person.kind) person.kind = 'child'
    let daily = findEducationDailyItem(person)
    if (!daily) {
      daily = {
        id: person.id + '-daily',
        name: educationDailyItemName(person),
        role: 'daily',
        plan: 0,
        entries: [],
        annualItemId: annualId,
      }
      if (!Array.isArray(person.items)) person.items = []
      person.items.unshift(daily)
    } else {
      daily.annualItemId = annualId
      if (!daily.role) daily.role = 'daily'
      daily.name = educationDailyItemName(person)
    }
    return person
  }

  function ensureEducationAnnualItemInData(data, itemId, label, kind) {
    if (!data || !itemId) return
    let group = findGroup(data, 'education')
    if (!group) {
      group = { id: 'education', label: '教養・教育', items: [] }
      data.groups = Array.isArray(data.groups) ? data.groups.concat([group]) : [group]
    }
    let item = findItem(group, itemId)
    if (!item) {
      item = { id: itemId, label: label, kind: kind === 'saving' ? 'saving' : 'daily' }
      group.items.push(item)
    } else {
      item.label = label
      item.kind = kind === 'saving' ? 'saving' : 'daily'
    }
    if (!data.months) data.months = {}
    MONTH_KEYS.forEach(function (mm) {
      if (!data.months[mm]) data.months[mm] = {}
      if (!data.months[mm][itemId]) data.months[mm][itemId] = emptyLine()
    })
  }

  function syncEducationItemToAnnual(itemId) {
    if (!itemId || educationAnnualSyncing) return
    if (!isEducationAnnualDailyId(itemId)) return
    educationAnnualSyncing = true
    try {
      const person = educationPersonForAnnualItem(itemId)
      const daily = person ? findEducationDailyItem(person) : null
      if (!person || !daily) {
        removeAnnualItemAllYears(itemId)
        return
      }
      if (!daily.annualItemId) daily.annualItemId = itemId
      const label = educationDailyItemName(person) || educationAnnualLabelForItem(itemId)
      const year = state.activeYear
      const pack = educationReflectMonths(state.education, year)
      const months = pack[itemId] || splitYearAcrossMonths(0)
      const data = yearData()
      ensureEducationAnnualItemInData(data, itemId, label, 'daily')
      setAnnualItemLabelAllYears(itemId, label)
      Object.keys(state.years || {}).forEach(function (key) {
        const yd = state.years[key]
        if (!yd) return
        if (!yearHasItem(yd, itemId)) {
          ensureEducationAnnualItemInData(yd, itemId, label, 'daily')
        }
      })
      setItemYearBudgets(data, itemId, months)
    } finally {
      educationAnnualSyncing = false
    }
  }

  function syncEducationPurposeToAnnual() {
    if (educationAnnualSyncing) return
    educationAnnualSyncing = true
    try {
      const edu = state.education
      const yearAmt = educationPurposeYearAmount(edu)
      const months = splitYearAcrossMonths(yearAmt)
      const label = EDUCATION_ANNUAL_SAVING_LABEL
      const itemId = EDUCATION_ANNUAL_SAVING_ID
      Object.keys(state.years || {}).forEach(function (key) {
        const yd = state.years[key]
        if (!yd) return
        ensureEducationAnnualItemInData(yd, itemId, label, 'saving')
      })
      setAnnualItemLabelAllYears(itemId, label)
      const data = yearData()
      ensureEducationAnnualItemInData(data, itemId, label, 'saving')
      setItemYearBudgets(data, itemId, months)
    } finally {
      educationAnnualSyncing = false
    }
  }

  function syncEducationAllToAnnual() {
    const seen = {}
    ;(state.education && state.education.people ? state.education.people : []).forEach(function (person) {
      if (!person || isSoftDeleted(person) || educationPersonKind(person) === 'grandchild') return
      const annualId = educationAnnualItemIdForPerson(person)
      if (!annualId || seen[annualId]) return
      seen[annualId] = true
      syncEducationItemToAnnual(annualId)
    })
    // fixed fallbacks for seed people without daily yet (skip if soft-deleted)
    ;['edu-natsu', 'edu-kazu'].forEach(function (id) {
      if (seen[id]) return
      const person = educationPersonForAnnualItem(id)
      if (!person) {
        // soft-deleted or missing: ensure annual line is gone
        removeAnnualItemAllYears(id)
        return
      }
      syncEducationItemToAnnual(id)
    })
    syncEducationPurposeToAnnual()
  }

  function syncEducationPlanChange(personId, itemName) {
    if (educationAnnualSyncing) return
    const person = findEducationPerson(personId)
    if (!person) return
    const item = findEducationItemByName(person, itemName)
    const daily = findEducationDailyItem(person)
    if ((item && isEducationDailyItem(item)) || (daily && daily.name === itemName) || isEducationDailyName(itemName)) {
      let annualId = educationAnnualItemIdForPerson(person)
      if (!annualId && daily) {
        annualId = allocateEducationAnnualItemId(person.label)
        daily.annualItemId = annualId
      }
      if (annualId) syncEducationItemToAnnual(annualId)
    } else {
      // purpose / other plan change → refresh edu-saving
      syncEducationPurposeToAnnual()
    }
  }

  function syncEducationLabelsToAnnual(person) {
    if (!person || educationAnnualSyncing) return
    const annualId = educationAnnualItemIdForPerson(person)
    if (!annualId) return
    educationAnnualSyncing = true
    try {
      setAnnualItemLabelAllYears(annualId, educationDailyItemName(person))
    } finally {
      educationAnnualSyncing = false
    }
  }

  function syncAnnualBudgetsToEducation(itemId) {
    if (!itemId || educationAnnualSyncing) return
    if (itemId === EDUCATION_ANNUAL_SAVING_ID) return
    if (!isEducationAnnualDailyId(itemId)) return
    const person = educationPersonForAnnualItem(itemId)
    if (!person || !state.education) return
    educationAnnualSyncing = true
    try {
      const avgMonth = averageAnnualMonthBudgets(yearData(), itemId)
      const years = asFiniteNumber(state.education.planYears)
      const plan = years > 0 ? Math.round(avgMonth * 12 * years) : 0
      let item = findEducationDailyItem(person)
      if (!item) {
        item = {
          id: person.id + '-daily',
          name: educationDailyItemName(person),
          role: 'daily',
          plan: plan,
          entries: [],
          annualItemId: itemId,
        }
        if (!Array.isArray(person.items)) person.items = []
        person.items.unshift(item)
      } else {
        item.plan = plan
        if (!item.role) item.role = 'daily'
        item.annualItemId = itemId
        item.name = educationDailyItemName(person)
      }
    } finally {
      educationAnnualSyncing = false
    }
  }

  function syncAnnualLabelToEducation(itemId, nextLabel) {
    if (!itemId || educationAnnualSyncing) return
    if (itemId === EDUCATION_ANNUAL_SAVING_ID) return
    if (!isEducationAnnualDailyId(itemId)) return
    const person = educationPersonForAnnualItem(itemId)
    if (!person) return
    let label = String(nextLabel == null ? '' : nextLabel).trim()
    if (!label) return
    // Annual may show mid-style 雑費なつ; strip to person label when present.
    if (label.indexOf('雑費') === 0 && label.length > 2) label = label.slice(2)
    if (!label) return
    educationAnnualSyncing = true
    try {
      person.label = label
      const daily = findEducationDailyItem(person)
      if (daily) daily.name = educationDailyItemName(person)
      setAnnualItemLabelAllYears(itemId, educationDailyItemName(person))
    } finally {
      educationAnnualSyncing = false
    }
  }

  function fillEducationLinkedIfEmpty(data, year) {
    const pack = educationReflectMonths(state.education, year)
    Object.keys(pack).forEach(function (itemId) {
      if (!isEducationAnnualDailyId(itemId)) return
      const person = educationPersonForAnnualItem(itemId)
      const daily = person ? findEducationDailyItem(person) : null
      if (!person || !daily) return
      const label = educationAnnualLabelForItem(itemId)
      ensureEducationAnnualItemInData(data, itemId, label, 'daily')
      if (!itemYearBudgetsAllZero(data, itemId)) return
      setItemYearBudgets(data, itemId, pack[itemId])
    })
    // purpose auto-fill
    const purposeYear = educationPurposeYearAmount(state.education)
    ensureEducationAnnualItemInData(data, EDUCATION_ANNUAL_SAVING_ID, EDUCATION_ANNUAL_SAVING_LABEL, 'saving')
    if (itemYearBudgetsAllZero(data, EDUCATION_ANNUAL_SAVING_ID)) {
      setItemYearBudgets(data, EDUCATION_ANNUAL_SAVING_ID, splitYearAcrossMonths(purposeYear))
    }
  }

  function removeEducationDailyZappi(person) {
    if (!person || !Array.isArray(person.items)) return
    person.items = person.items.filter(function (item) {
      if (!item) return false
      if (isEducationDailyItem(item)) return false
      return true
    })
  }

  function cascadeRemoveEducationDailyByAnnualId(itemId) {
    if (!isEducationAnnualDailyId(itemId)) return
    const person = educationPersonForAnnualItem(itemId)
    if (person) removeEducationDailyZappi(person)
    removeAnnualItemAllYears(itemId)
  }

  function cascadeRemoveEducationAnnualDaily(person) {
    const annualId = educationAnnualItemIdForPerson(person)
    if (person) removeEducationDailyZappi(person)
    if (annualId) removeAnnualItemAllYears(annualId)
  }

  const VEHICLE_ANNUAL_MAP = [
    { catId: 'shaken', itemId: 'auto-shaken', kind: 'daily' },
    { catId: 'tax', itemId: 'auto-tax', kind: 'daily' },
    { catId: 'oil', itemId: 'auto-oil', kind: 'daily' },
    { catId: 'other', itemId: 'auto-other', kind: 'daily' },
    { catId: 'tsumitate', itemId: 'auto-saving', kind: 'saving' },
  ]

  function vehicleCatalogAnnualItemId(catId) {
    let found = ''
    VEHICLE_ANNUAL_MAP.forEach(function (map) {
      if (map.catId === catId) found = map.itemId
    })
    return found
  }

  function vehicleCatalogKind(catId) {
    let found = ''
    VEHICLE_CATALOG.forEach(function (row) {
      if (row && row.id === catId) found = row.kind === 'saving' ? 'saving' : 'daily'
    })
    if (found) return found
    VEHICLE_ANNUAL_MAP.forEach(function (map) {
      if (map.catId === catId) found = map.kind === 'saving' ? 'saving' : 'daily'
    })
    return found || 'daily'
  }

  function vehicleCategoryKind(cat) {
    if (!cat) return 'daily'
    const catalogId = vehicleCatalogAnnualItemId(cat.id)
    if (catalogId) return vehicleCatalogKind(cat.id)
    return cat.kind === 'saving' ? 'saving' : 'daily'
  }

  function vehicleCategoryAnnualItemId(cat) {
    if (!cat) return ''
    const catalogId = vehicleCatalogAnnualItemId(cat.id)
    if (catalogId) return catalogId
    if (typeof cat.annualItemId === 'string' && cat.annualItemId.trim()) return cat.annualItemId.trim()
    return ''
  }

  function vehicleCategoryById(car, catId) {
    let found = null
    ;(car && car.categories ? car.categories : []).forEach(function (cat) {
      if (cat && cat.id === catId) found = cat
    })
    return found
  }

  function vehicleLabelKindKey(label, kind) {
    return String(label || '') + '\0' + (kind === 'saving' ? 'saving' : 'daily')
  }

  function findSharedVehicleAnnualItemId(vehicles, label, kind, skipCatId) {
    const key = vehicleLabelKindKey(label, kind)
    let found = ''
    ;(vehicles || []).forEach(function (car) {
      if (found) return
      ;(car && car.categories ? car.categories : []).forEach(function (cat) {
        if (!cat || found) return
        if (skipCatId && cat.id === skipCatId) return
        if (vehicleCatalogAnnualItemId(cat.id)) return
        if (vehicleLabelKindKey(cat.label, vehicleCategoryKind(cat)) !== key) return
        const aid = vehicleCategoryAnnualItemId(cat)
        if (aid) found = aid
      })
    })
    return found
  }

  function allocateVehicleAnnualItemId(catId, label, kind, vehicles) {
    const shared = findSharedVehicleAnnualItemId(vehicles, label, kind, catId)
    if (shared) return shared
    const base = 'auto-vcat-' + String(catId || 'custom')
    const used = {}
    ;(vehicles || []).forEach(function (car) {
      ;(car && car.categories ? car.categories : []).forEach(function (cat) {
        const aid = vehicleCategoryAnnualItemId(cat)
        if (aid) used[aid] = true
      })
    })
    VEHICLE_ANNUAL_MAP.forEach(function (map) { used[map.itemId] = true })
    if (!used[base]) return base
    let n = 2
    while (used[base + '-' + n]) n += 1
    return base + '-' + n
  }

  function reconcileVehicleAnnualItemIds(vehicles) {
    const list = vehicles || []
    const byKey = {}
    list.forEach(function (car) {
      ;(car && car.categories ? car.categories : []).forEach(function (cat) {
        if (!cat || vehicleCatalogAnnualItemId(cat.id)) return
        const kind = vehicleCategoryKind(cat)
        cat.kind = kind
        const key = vehicleLabelKindKey(cat.label, kind)
        const existing = typeof cat.annualItemId === 'string' && cat.annualItemId.trim()
          ? cat.annualItemId.trim()
          : ''
        if (byKey[key]) {
          cat.annualItemId = byKey[key]
        } else if (existing) {
          byKey[key] = existing
          cat.annualItemId = existing
        } else {
          const allocated = allocateVehicleAnnualItemId(cat.id, cat.label, kind, list)
          byKey[key] = allocated
          cat.annualItemId = allocated
        }
      })
    })
    return list
  }

  function listVehicleAnnualMaps(vehicles) {
    const maps = []
    const seen = {}
    VEHICLE_ANNUAL_MAP.forEach(function (map) {
      if (!vehicleCatsForAnnualItem(vehicles, map.itemId).length) return
      let label = ''
      VEHICLE_CATALOG.forEach(function (row) {
        if (row && row.id === map.catId) label = row.label
      })
      if (map.itemId === 'auto-saving') label = '自動車目的別'
      const links = vehicleCatsForAnnualItem(vehicles, map.itemId)
      if (links.length && links[0].cat && links[0].cat.label) label = links[0].cat.label
      maps.push({
        itemId: map.itemId,
        kind: map.kind === 'saving' ? 'saving' : 'daily',
        label: label || map.itemId,
        catalog: true,
        catId: map.catId,
      })
      seen[map.itemId] = true
    })
    ;(vehicles || []).forEach(function (car) {
      ;(car && car.categories ? car.categories : []).forEach(function (cat) {
        if (!cat) return
        const itemId = vehicleCategoryAnnualItemId(cat)
        if (!itemId || seen[itemId]) return
        const kind = vehicleCategoryKind(cat)
        maps.push({
          itemId: itemId,
          kind: kind,
          label: cat.label || itemId,
          catalog: false,
          catId: cat.id,
        })
        seen[itemId] = true
      })
    })
    return maps
  }

  function vehicleCatsForAnnualItem(vehicles, itemId) {

  // lifetimeBudget / planYears stays in vehicle state (cat.perYear) but is not shown on 大項目別予算.
  // Catalog 自動車 rows (税・オイル・その他・車検・目的別) are one annual figure in 合計.
  // Months hold that figure spread evenly (remainder in 12月).
  // Custom categories still use dated actuals on the entry's month.
  const VEHICLE_ANNUAL_NOTE = '自動車の年間予定は、車ごとの行にはしない。税・オイル・その他は、シエンタの支払いが2年分たまるまで、アクアの累計を経過年数で割った額。2年分になった年からは、その行だけシエンタの累計を経過年数で割った額に替わる。車検は、シエンタの車検が2回入るまでアクアの額のまま。2回目が入った年からシエンタに替わる。目的別は平均にしない。シエンタの返済総額を計画使用年数で割った額を、最初から置く。経過年数はカードの計画使用年数の横に、開始日から自動で入る。切り替わる条件は経過年数ではなく、上の支払い回数。'

  const VEHICLE_SCHEDULE_ITEM_IDS = {
    'auto-shaken': 'shaken',
    'auto-tax': 'tax',
    'auto-oil': 'oil',
    'auto-other': 'other',
    'auto-saving': 'tsumitate',

  function isVehicleScheduleAnnualItem(itemId) {

  function vehicleByIdFrom(vehicles, id) {
    let found = null
    ;(vehicles || []).forEach(function (car) {
      if (car && car.id === id) found = car
    })

  }

  function vehicleCategoryLabelOnCar(car, catId) {
    let label = ''
    ;(car && car.categories ? car.categories : []).forEach(function (cat) {
      if (cat && cat.id === catId && !label) label = cat.label || ''
    })
    if (label) return label
    VEHICLE_CATALOG.forEach(function (row) {
      if (row && row.id === catId && !label) label = row.label
    })
    return label
  }

  function vehicleDatedCategoryStats(car, label) {
    const years = {}
    let total = 0
    let payments = 0
    if (!car || !label) return { total: 0, yearCount: 0, paymentCount: 0 }
    ;(car.items || []).forEach(function (item) {
      if (!item || item.category !== label) return
      ;(Array.isArray(item.entries) ? item.entries : []).forEach(function (row) {
        if (isPurposeCarryRow(row)) return
        const ym = normalizeYm(row && (row.date != null ? row.date : row.ym))
        if (!ym) return
        total += asFiniteNumber(row.amount)
        payments += 1
        years[ym.slice(0, 4)] = true
      })
    })
    return { total: total, yearCount: Object.keys(years).length, paymentCount: payments }
  }

  // Card elapsed. housingElapsedMonths is the vehicle clock already on this screen
  // (day-aware whole months). Stop at end when end is before today.
  // Future or missing start is null so the card shows —.
  function calParseYmd(text) {
    const m = String(text || '').trim().match(/^(\d{4})-(\d{2})-(\d{2})$/)
    if (!m) return null
    const y = Number(m[1])
    const mo = Number(m[2])
    const d = Number(m[3])
    if (!y || mo < 1 || mo > 12 || d < 1 || d > 31) return null
    return { y: y, m: mo, d: d }
  }

  function calToday(today) {
    const now = today instanceof Date ? today : new Date()
    return new Date(now.getFullYear(), now.getMonth(), now.getDate())
  }

  // Contract end stops the clock. A later end leaves today (local calendar date).
  function calElapsedAsOfDate(endStr, today) {
    const todayDate = calToday(today)
    const end = calParseYmd(endStr)
    if (!end) return todayDate
    const endDate = new Date(end.y, end.m - 1, end.d)
    if (endDate.getTime() < todayDate.getTime()) return endDate
    return todayDate
  }

  function vehicleShownElapsedYears(car, today) {
    if (!car || !calParseYmd(car.start)) return null
    const start = calParseYmd(car.start)
    const todayDate = calToday(today)
    const startDate = new Date(start.y, start.m - 1, start.d)
    if (startDate.getTime() > todayDate.getTime()) return null
    const asOf = calElapsedAsOfDate(car.end, todayDate)
    const months = housingElapsedMonths(car.start, asOf)
    if (!(months > 0)) return null
    return months / 12
  }

  // Annual divisor. A stored positive elapsedYears wins (Aqua seed is 14, the agreed divisor).
  // Otherwise the live start-date years, one decimal. 0 or missing does not divide.
  function vehicleScheduleElapsedYears(car, today) {
    if (!car) return null
    if (car.elapsedYears != null && car.elapsedYears !== '') {
      const stored = asFiniteNumber(car.elapsedYears)
      if (stored > 0) return stored
    }
    const live = vehicleShownElapsedYears(car, today)
    if (live == null || !(live > 0)) return null
    const rounded = Math.round(live * 10) / 10
    return rounded > 0 ? rounded : null
  }

  function vehicleScheduleAnnualAmount(itemId, vehicles, today) {
    if (!isVehicleScheduleAnnualItem(itemId)) return null
    const list = vehicles || (state && state.vehicles) || []
    const catId = VEHICLE_SCHEDULE_ITEM_IDS[itemId]
    if (catId === 'tsumitate') {
      const loan = findLoan('loan-sienta')
      const total = loan ? asFiniteNumber(loan.total) : 0
      const sienta = vehicleByIdFrom(list, 'sienta')
      const planYears = sienta ? asFiniteNumber(sienta.planYears) : 0
      if (!(total > 0) || !(planYears > 0)) return null
      return Math.round(total / planYears)
    }
    const aqua = vehicleByIdFrom(list, 'aqua')
    const sienta = vehicleByIdFrom(list, 'sienta')
    const aquaStats = vehicleDatedCategoryStats(aqua, vehicleCategoryLabelOnCar(aqua, catId))
    const sientaStats = vehicleDatedCategoryStats(sienta, vehicleCategoryLabelOnCar(sienta, catId))
    const switched = catId === 'shaken'
      ? sientaStats.paymentCount >= 2
      : sientaStats.yearCount >= 2
    const source = switched ? sienta : aqua
    const stats = switched ? sientaStats : aquaStats
    const elapsed = vehicleScheduleElapsedYears(source, today)
    if (!(elapsed > 0)) return null
    return Math.round(stats.total / elapsed)
  }

  function vehicleActualMonthsForItem(vehicles, itemId, year) {
    const prefix = String(year == null ? '' : year)
    const months = {}
    MONTH_KEYS.forEach(function (mm) { months[mm] = 0 })
    let dated = 0
    vehicleCatsForAnnualItem(vehicles, itemId).forEach(function (link) {
      const label = link.cat && link.cat.label
      if (!label) return
      ;(link.car && link.car.items ? link.car.items : []).forEach(function (item) {
        if (!item || item.category !== label) return
        const entries = Array.isArray(item.entries) ? item.entries : []
        // Spending stored only as item.total has no month. Do not spread it.
        if (!entries.length) return
        entries.forEach(function (row) {
          if (isPurposeCarryRow(row)) return
          const ym = normalizeYm(row && (row.date != null ? row.date : row.ym))
          if (!ym || ym.slice(0, 4) !== prefix) return
          const mm = ym.slice(5, 7)
          if (MONTH_KEYS.indexOf(mm) < 0) return
          months[mm] += asFiniteNumber(row.amount)
          dated += 1
        })
      })
    })
    if (!dated) return null
    let sum = 0
    MONTH_KEYS.forEach(function (mm) {
      months[mm] = Math.round(months[mm])
      sum += months[mm]
    })
    if (sum === 0) return null
    return months
  }

  function vehicleReflectMonths(vehicles, year) {
    const out = {}
    const list = vehicles || (state && state.vehicles)
    listVehicleAnnualItemIds(list).forEach(function (itemId) {

        const annual = vehicleScheduleAnnualAmount(itemId, list)
        if (annual == null) return
        // Months carry the displayed 合計 spread evenly.
        // 合計 / 月平均 on screen still use vehicleScheduleAnnualAmount.
        out[itemId] = spreadIntegerYenAcrossMonths(annual)
        return
      }
      const months = vehicleActualMonthsForItem(list, itemId, year)
      if (months) out[itemId] = months
    })
    return out
  }

    if (isHobbyAnnualReadonly(itemId)) return '趣味タブから自動'

  function vehicleAnnualLabelForItem(itemId) {

  function ensureVehicleAnnualItemInData(data, itemId, label, kind) {
    if (!data || !itemId) return

      })
